<!-- v2-7 (23/09/2026): player ocupa a tela inteira, com o dock flutuando por cima (sem o conteúdo vazando entre os dois).
     v2-6 (23/09/2026): o player deixa o dock à vista; o episódio passa para as outras telas pelo mini-player do kit (v6-18) e volta a esta
     tela retomando do mesmo segundo.
     v2-5 (23/09/2026): player do RedaCast no estilo dos streamings: cena grande, barra larga para arrastar, voltar/avançar 10 s,
     play central, velocidade 1×–2×, ícone do microfone no topo; controles de pular também na tela de bloqueio.
     v2-4 (23/09/2026): aceita ?ep=<id>&volta=<página> — abre o episódio direto (atalho do Material de apoio) e a seta do player volta para lá.
     v2-3 (22/09/2026): selo dos robôs no tamanho certo nos cartões médios; título do cartão grande em até 2 linhas.
     v2-2 (22/09/2026): capa do episódio usa a versão larga do tema (arquivo -larga) quando existe.
     v2-1 (22/09/2026): arte definitiva do RedaCast (os dois robôs da RedaON): cena no player e no cabeçalho do modo, selo no canto dos cartões e no mini-player.
     v2-0 (22/09/2026): Você ON com dois modos, Vídeos (claquete) e RedaCast (microfone). Estrutura aprovada pelo Alan no mockup v3:
     "Para você agora" (cartões grandes pela necessidade do aluno: competência-foco → tema da semana → demais), "Continue de onde parou",
     Shorts em faixa própria, uma faixa por trilha (Bases da Redação, Correção Guiada, Tema da Semana, Rota 1.000), chips como atalho.
     RedaCast: episódios com a arte do tema como capa, título = nome do tema, chamada embaixo; player com os apresentadores (ilustração
     provisória) e mini-player que segue tocando dentro desta tela. Lê materiais tipo 'video' e 'audio' (publicados, origem redaon). -->

<script>
if (typeof authGuard === 'function') { authGuard('aluno'); }
montarEsqueleto({ ativo:'voce-on', titulo:'Você ON', icone:'play', sino:true, versao:'aluno · você on · v2-7' });

/* ids de trilha são os do banco (base, correcao, aposta, rota); os nomes são os aprovados em 22/09/2026 */
var TRILHAS=[
 {id:'base',     nome:'Bases da Reda\u00e7\u00e3o', curto:'Bases',      sub:'a estrutura da reda\u00e7\u00e3o, compet\u00eancia a compet\u00eancia'},
 {id:'correcao', nome:'Corre\u00e7\u00e3o Guiada',  curto:'Corre\u00e7\u00e3o', sub:'uma reda\u00e7\u00e3o corrigida na sua frente'},
 {id:'aposta',   nome:'Tema da Semana',   curto:'Tema',       sub:'por que este tema, e como atac\u00e1-lo'},
 {id:'rota',     nome:'Rota 1.000',       curto:'Rota 1.000', sub:'construindo a reda\u00e7\u00e3o com o material das trilhas'}
];
var VIDEOS=[], EPIS=[], TEMAS={}, FOCO=null, TEMA_SEMANA=null, MODO='vid', tocando=null;
var PROG=(function(){ try{ return JSON.parse(localStorage.getItem('redaon-voceon-prog')||'{}'); }catch(e){ return {}; } })();
function salvarProg(){ try{ localStorage.setItem('redaon-voceon-prog', JSON.stringify(PROG)); }catch(e){} }
var PLAY='<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nome(id){ for(var i=0;i<TRILHAS.length;i++) if(TRILHAS[i].id===id) return TRILHAS[i].nome; return ''; }
function idYoutube(url){ var m=String(url||'').match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
function pct(v){ return PROG[v.id] && PROG[v.id].p ? Math.min(99, Math.round(PROG[v.id].p)) : 0; }
function porque(v){
  if(v.t==='base' && FOCO && v.comp===FOCO) return 'Sua m\u00e9dia mais baixa \u00e9 em '+FOCO;
  if(v.t==='aposta' && TEMA_SEMANA && v.temaId===TEMA_SEMANA) return 'Tema da semana';
  if(v.t==='base' && v.comp) return 'Bases \u00b7 '+v.comp;
  return nome(v.t); }
function peso(v){
  if(v.t==='base' && FOCO && v.comp===FOCO) return 0;
  if(v.t==='aposta' && TEMA_SEMANA && v.temaId===TEMA_SEMANA) return 1;
  if(v.t==='aposta') return 2; if(v.t==='base') return 3; return 4; }
function ord(l){ return l.slice().sort(function(a,b){ return peso(a.v)-peso(b.v) || (b.v.novo?1:0)-(a.v.novo?1:0) || (b.v.criado>a.v.criado?1:-1); }); }
function capV(v){ var p=pct(v); return '<div class="cap"><img src="https://i.ytimg.com/vi/'+v.yt+'/hqdefault.jpg" alt="" loading="lazy">'+PLAY+(v.dur?'<span class="dur">'+esc(v.dur)+'</span>':'')+(p?'<span class="barra"><i style="width:'+p+'%"></i></span>':'')+'</div>'; }
function grande(v,i){ var p=pct(v); return '<div class="grande" onclick="abrirVideo('+i+')">'+capV(v).replace(/<\/div>$/,'<div class="scrim"></div><div class="sobre"><div class="pq">'+esc(porque(v))+'</div><h3>'+esc(v.tit)+'</h3>'+(v.chamada?'<div class="ch">'+esc(v.chamada)+'</div>':'')+'</div></div>')+'<div class="pe"><span class="selo">'+esc(nome(v.t))+'</span>'+esc(v.dur)+(p?' \u00b7 faltam '+(100-p)+'%':'')+'<button class="bt">Assistir</button></div></div>'; }
function medio(v,i){ var p=pct(v); return '<div class="medio" onclick="abrirVideo('+i+')">'+capV(v)+'<div class="txt">'+(v.novo?'<span class="selo branco">novo</span> ':'')+(v.comp?'<span class="selo">'+esc(v.comp)+'</span>':'')+'<p>'+esc(v.tit)+'</p>'+(v.chamada?'<div class="pe" style="color:var(--text2);margin-bottom:3px">'+esc(v.chamada)+'</div>':'')+'<div class="pe">'+esc(v.dur)+(p?' \u00b7 faltam '+(100-p)+'%':'')+'</div></div></div>'; }
function short(v,i){ return '<div class="short" onclick="abrirVideo('+i+')"><div class="cap"><img src="https://i.ytimg.com/vi/'+v.yt+'/hqdefault.jpg" alt="" loading="lazy">'+(v.dur?'<span class="dur">'+esc(v.dur)+'</span>':'')+'</div><div class="rot">'+esc(v.tit)+'</div></div>'; }
/* capa do tema: nos cartões deitados, usa a versão larga (mesmo nome + "-larga") quando existir; senão, a vertical alinhada pela base */
function capaTema(e){ var t=e.temaId && TEMAS[e.temaId]; if(t && t.capa_url){ var v=esc(t.capa_url), l=v.replace(/\.(webp|jpg|png)$/,'-larga.$1');
    return '<img src="'+l+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+v+'\'">'; } return '<div class="arte">'+esc(e.comp?'Compet\u00eancia '+e.comp:'RedaCast')+'</div>'; }
function capE(e){ var p=pct(e); return '<div class="cap">'+capaTema(e)+'<img class="seloR" src="avatares/redacast-selo.webp?v=23" alt="RedaCast">'+(e.dur?'<span class="dur">'+esc(e.dur)+'</span>':'')+(p?'<span class="barra"><i style="width:'+p+'%"></i></span>':'')+'</div>'; }
function grandeE(e,i){ var p=pct(e); return '<div class="grande" onclick="abrirAudio('+i+')">'+capE(e).replace(/<\/div>$/,'<div class="scrim"></div><div class="sobre"><div class="pq">'+esc(porque(e))+'</div><h3>'+esc(e.tit)+'</h3>'+(e.chamada?'<div class="ch">'+esc(e.chamada)+'</div>':'')+'</div></div>')+'<div class="pe"><span class="selo">'+esc(nome(e.t))+'</span>'+esc(e.dur)+(p?' \u00b7 faltam '+(100-p)+'%':'')+'<button class="bt">Ouvir</button></div></div>'; }
function medioE(e,i){ var p=pct(e); return '<div class="medio" onclick="abrirAudio('+i+')">'+capE(e)+'<div class="txt">'+(e.novo?'<span class="selo branco">novo</span> ':'')+(e.comp?'<span class="selo">'+esc(e.comp)+'</span>':'')+'<p>'+esc(e.tit)+'</p>'+(e.chamada?'<div class="pe" style="color:var(--text2);margin-bottom:3px">'+esc(e.chamada)+'</div>':'')+'<div class="pe">'+esc(e.dur)+(p?' \u00b7 faltam '+(100-p)+'%':'')+'</div></div></div>'; }
function faixa(tit,sub,itens){ return '<div class="faixa"><h2>'+tit+'</h2>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')+'<div class="trilho">'+itens+'</div></div>'; }

function montar(){
  document.getElementById('modos').innerHTML=
    '<button class="modo'+(MODO==='vid'?' on':'')+'" onclick="modo(\'vid\')">'+feIcone('claquete')+'V\u00eddeos</button>'
   +'<button class="modo'+(MODO==='aud'?' on':'')+'" onclick="modo(\'aud\')">'+feIcone('microfone')+'RedaCast</button>';
  document.getElementById('chips').innerHTML=TRILHAS.map(function(t){ return '<button class="vChip" onclick="irFaixa(\''+t.id+'\')"><span class="longo">'+esc(t.nome)+'</span><span class="curto">'+esc(t.curto)+'</span></button>'; }).join('');
  var h='';
  if(MODO==='vid'){
    var todos=VIDEOS.map(function(v,i){ return {v:v,i:i}; }), longos=todos.filter(function(x){ return !x.v.curto; }), curtos=todos.filter(function(x){ return x.v.curto; });
    if(!todos.length) h+='<p class="vazioTudo">Em breve. A Profa. Blanche est\u00e1 gravando os primeiros v\u00eddeos.</p>';
    else {
      h+=faixa('Para voc\u00ea agora', null, ord(longos).slice(0,5).map(function(x){ return grande(x.v,x.i); }).join(''));
      var cont=longos.filter(function(x){ return pct(x.v); }); if(cont.length) h+=faixa('Continue de onde parou', null, cont.map(function(x){ return medio(x.v,x.i); }).join(''));
      if(curtos.length) h+=faixa('Shorts <small>at\u00e9 1 minuto</small>', null, ord(curtos).map(function(x){ return short(x.v,x.i); }).join(''));
    }
    TRILHAS.forEach(function(t){ var l=ord(longos.filter(function(x){ return x.v.t===t.id; }));
      h+='<div id="f-'+t.id+'">'+faixa(esc(t.nome)+' <small>'+l.length+' v\u00eddeo'+(l.length===1?'':'s')+'</small>', t.sub, l.length? l.map(function(x){ return medio(x.v,x.i); }).join('') : '<div class="breve">Em breve. A Profa. Blanche est\u00e1 gravando.</div>')+'</div>'; });
  } else {
    var eps=EPIS.map(function(v,i){ return {v:v,i:i}; });
    h+='<div class="cabCast"><img src="img/redacast-cena.webp?v=23" alt=""><div class="txt"><b>RedaCast</b><span>Seu podcast que te aproxima da nota 1.000 \u00b7 d\u00e1 para ouvir com a tela apagada</span></div></div>';
    if(!eps.length) h+='<p class="vazioTudo">Em breve. O primeiro epis\u00f3dio est\u00e1 sendo conferido.</p>';
    else {
      h+=faixa('Para voc\u00ea agora', null, ord(eps).slice(0,5).map(function(x){ return grandeE(x.v,x.i); }).join(''));
      var contE=eps.filter(function(x){ return pct(x.v); }); if(contE.length) h+=faixa('Continue de onde parou', null, contE.map(function(x){ return medioE(x.v,x.i); }).join(''));
    }
    TRILHAS.forEach(function(t){ var l=ord(eps.filter(function(x){ return x.v.t===t.id; }));
      h+='<div id="f-'+t.id+'">'+faixa(esc(t.nome)+' <small>'+l.length+' epis\u00f3dio'+(l.length===1?'':'s')+'</small>', t.sub, l.length? l.map(function(x){ return medioE(x.v,x.i); }).join('') : '<div class="breve">Em breve. O primeiro epis\u00f3dio est\u00e1 sendo conferido.</div>')+'</div>'; });
  }
  document.getElementById('corpo').innerHTML=h;
}
function modo(m){ MODO=m; try{ localStorage.setItem('redaon-voceon-modo',m); }catch(e){} montar(); window.scrollTo({top:0,behavior:'smooth'}); }
function irFaixa(id){ var el=document.getElementById('f-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function abrirVideo(i){ var v=VIDEOS[i];
  document.getElementById('vTit').textContent=v.tit; document.getElementById('vDesc').textContent=v.desc||'';
  var q=document.getElementById('vQuadro'); q.className='quadro'+(v.curto?' v':'');
  q.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+v.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="'+esc(v.tit)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  document.getElementById('telaVideo').classList.add('on'); }
function fecharVideo(){ document.getElementById('telaVideo').classList.remove('on'); document.getElementById('vQuadro').innerHTML=''; }

/* player do RedaCast · mini-player dentro desta tela (levar ao kit é rodada futura) */
var aud=document.getElementById('aud');
function abrirAudio(i){ var e=EPIS[i]; tocando=e;
  document.getElementById('aTit').textContent=e.tit; document.getElementById('aSub').textContent=e.chamada||'';
  document.getElementById('miniT').textContent=e.tit;
  if(aud.getAttribute('src')!==e.url){ aud.src=e.url; var pr=PROG[e.id]; if(pr && pr.s) aud.addEventListener('loadedmetadata', function f(){ aud.removeEventListener('loadedmetadata', f); if(pr.s < aud.duration-5) aud.currentTime=pr.s; }); }
  aud.playbackRate=VELS[velI]; document.getElementById('pVel').textContent=String(VELS[velI]).replace('.',',')+'\u00d7';
  abrirAudioTela(); aud.play().catch(function(){});
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({ title:e.tit, artist:'RedaCast \u00b7 RedaON', album:nome(e.t) });
    navigator.mediaSession.setActionHandler('play', function(){ aud.play(); }); navigator.mediaSession.setActionHandler('pause', function(){ aud.pause(); });
    navigator.mediaSession.setActionHandler('seekbackward', function(){ pular(-10); }); navigator.mediaSession.setActionHandler('seekforward', function(){ pular(10); }); }catch(x){} }
}
function abrirAudioTela(){ document.getElementById('telaAudio').classList.add('on'); document.getElementById('mini').classList.remove('on'); }
var PARAM = new URLSearchParams(location.search), EP_ALVO = PARAM.get('ep'), VOLTA = PARAM.get('volta');
if (VOLTA && !/^hub-preparacao\.html/.test(VOLTA)) VOLTA = null;
function minimizar(){ if (VOLTA){ salvarProg(); location.href = VOLTA; return; } document.getElementById('telaAudio').classList.remove('on'); if(tocando && !aud.paused) document.getElementById('mini').classList.add('on'); montar(); }
function gravarCast(){ if(!tocando || !window.redaCastEstado) return; redaCastEstado.gravar({ id:tocando.id, url:tocando.url, tit:tocando.tit, t:aud.currentTime||0, dur:aud.duration||0, tocando:!aud.paused, rate:aud.playbackRate||1 }); }
var ultCast=0;
aud.addEventListener('play', gravarCast); aud.addEventListener('pause', gravarCast);
aud.addEventListener('timeupdate', function(){ var n=Date.now(); if(n-ultCast>3000){ ultCast=n; gravarCast(); } });
window.addEventListener('pagehide', gravarCast);
function pararAudio(){ if(window.redaCastEstado) redaCastEstado.limpar(); aud.pause(); document.getElementById('mini').classList.remove('on'); tocando=null; montar(); }
/* v2-5 · controles próprios */
var ICO_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', ICO_PAUSA='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
var VELS=[1,1.25,1.5,2], velI=0, arrastando=false;
function fmt(t){ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function pintarPlayer(){ var d=aud.duration||0, c=aud.currentTime||0, sk=document.getElementById('pSeek');
  if(!arrastando && d){ sk.value=Math.round(c/d*1000); }
  sk.style.setProperty('--p', (sk.value/10)+'%');
  document.getElementById('pAgora').textContent=fmt(arrastando&&d? sk.value/1000*d : c);
  document.getElementById('pFalta').textContent='-'+fmt(d-(arrastando&&d? sk.value/1000*d : c));
  document.getElementById('pPlay').innerHTML = aud.paused ? ICO_PLAY : ICO_PAUSA; }
function tocarPausar(){ if(aud.paused) aud.play().catch(function(){}); else aud.pause(); }
function pular(s){ if(!aud.duration) return; aud.currentTime=Math.max(0,Math.min(aud.duration-0.5, aud.currentTime+s)); pintarPlayer(); }
function trocarVel(){ velI=(velI+1)%VELS.length; aud.playbackRate=VELS[velI]; document.getElementById('pVel').textContent=String(VELS[velI]).replace('.',',')+'\u00d7'; }
(function(){ var sk=document.getElementById('pSeek');
  sk.addEventListener('input', function(){ arrastando=true; pintarPlayer(); });
  sk.addEventListener('change', function(){ if(aud.duration) aud.currentTime=sk.value/1000*aud.duration; arrastando=false; pintarPlayer(); });
  ['play','pause','loadedmetadata','durationchange','seeked'].forEach(function(ev){ aud.addEventListener(ev, pintarPlayer); });
  aud.addEventListener('ratechange', function(){ aud.playbackRate=VELS[velI]; });
  var ic=document.getElementById('icoCast'); if(ic && typeof feIcone==='function') ic.innerHTML=feIcone('microfone');
  pintarPlayer();
})();
aud.addEventListener('timeupdate', function(){ pintarPlayer(); if(!tocando || !aud.duration) return; var p=aud.currentTime/aud.duration*100; PROG[tocando.id]={ s:aud.currentTime, p:(p>=97?0:p) }; if(Math.floor(aud.currentTime)%5===0) salvarProg(); });
aud.addEventListener('ended', function(){ if(window.redaCastEstado) redaCastEstado.limpar(); if(tocando){ PROG[tocando.id]={ s:0, p:0 }; salvarProg(); } document.getElementById('mini').classList.remove('on'); });
aud.addEventListener('pause', function(){ salvarProg(); });

function linhaMat(m){ var j=m.conteudo_json||{}; return { id:m.id, t:m.trilha||'base', tit:m.nome||'', desc:m.conteudo||'', chamada:j.chamada||'', dur:j.duracao||'', curto:!!j.curto, comp:m.competencia||null, temaId:m.tema_id||null, criado:m.criado_em||'', novo:(new Date()-new Date(m.criado_em))<7*864e5 }; }
async function carregar(){
  try{ MODO=localStorage.getItem('redaon-voceon-modo')||'vid'; }catch(e){}
  try{
    var res=await dbFetch(SUPABASE_URL+'/rest/v1/materiais?tipo=in.(video,audio)&publicado=eq.true&origem=eq.redaon&select=id,nome,tipo,conteudo,arquivo_url,trilha,competencia,tema_id,criado_em,conteudo_json&order=criado_em.desc', {});
    var linhas=res.ok ? await res.json() : [];
    VIDEOS=[]; EPIS=[];
    linhas.forEach(function(m){ var o=linhaMat(m);
      if(m.tipo==='video'){ o.yt=idYoutube(m.arquivo_url); if(o.yt) VIDEOS.push(o); }
      else { o.url=m.arquivo_url||''; if(o.url) EPIS.push(o); } });
    var ids=[]; EPIS.concat(VIDEOS).forEach(function(x){ if(x.temaId && ids.indexOf(x.temaId)<0) ids.push(x.temaId); });
    if(ids.length){ var r2=await dbFetch(SUPABASE_URL+'/rest/v1/temas?select=id,titulo,capa_url&id=in.('+ids.join(',')+')', {}); (r2.ok?await r2.json():[]).forEach(function(t){ TEMAS[t.id]=t; }); }
  }catch(e){ console.warn('[você on]', e); }
  montar();
  abrirPedido();
  /* foco e tema da semana: a mesma regra do Meu Plano; chegam depois e reordenam o "Para você agora" */
  try{
    var d=new Date(), hoje=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var r3=await dbFetch(SUPABASE_URL+'/rest/v1/temas?select=id,semana_de&ativo=eq.true&semana_de=lte.'+hoje+'&order=semana_de.desc&limit=1', {});
    var ts=r3.ok?await r3.json():[]; if(ts[0]) TEMA_SEMANA=ts[0].id;
    var hist=(typeof dbGetHistoricoRedacoes==='function') ? await dbGetHistoricoRedacoes(4) : [];
    if(hist.length){ var cs=['c1','c2','c3','c4','c5'], melhor=null, vMed=1e9, vUlt=1e9;
      cs.forEach(function(c){ var soma=0; hist.forEach(function(r){ soma+=(r[c]||0); }); var med=soma/hist.length, ult=(hist[0][c]||0); if(med<vMed || (med===vMed && ult<vUlt)){ melhor=c; vMed=med; vUlt=ult; } });
      FOCO=melhor?melhor.toUpperCase():null; }
    montar();
  }catch(e){ console.warn('[você on foco]', e); }
}
/* atalho vindo do Preparar: abre o episódio pedido */
function retomarCast(){ var st = window.redaCastEstado ? redaCastEstado.ler() : null; if(!st || !st.id) return null;
  if (st.t){ PROG[st.id] = { s:st.t, p:(st.dur? st.t/st.dur*100 : 0) }; }
  if (st.rate){ for(var k=0;k<VELS.length;k++) if(VELS[k]===st.rate){ velI=k; } }
  return st; }
function abrirPedido(){ var st = retomarCast();
  if (!EP_ALVO){ if(st){ for(var j=0;j<EPIS.length;j++){ if(EPIS[j].id===st.id){ tocando=EPIS[j]; document.getElementById('miniT').textContent=tocando.tit;
        aud.src=tocando.url; aud.addEventListener('loadedmetadata', function f(){ aud.removeEventListener('loadedmetadata', f); if(st.t < aud.duration-3) aud.currentTime=st.t; aud.playbackRate=VELS[velI]; }, { once:true });
        document.getElementById('mini').classList.add('on'); if(st.tocando) aud.play().catch(function(){}); return; } } } return; } for (var i=0;i<EPIS.length;i++){ if (EPIS[i].id===EP_ALVO){ if (MODO!=='aud'){ MODO='aud'; montar(); } abrirAudio(i); return; } } }
carregar();
</script>
