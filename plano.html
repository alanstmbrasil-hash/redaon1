<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RedaON | Plano de estudos</title>
<!-- RedaON · Portal do Aluno · Plano de estudos · produção v1 (quadro P0–P7) · sobre aluno-base-v6 -->
<script>
(function(){
  var pref = 'auto';
  try { pref = localStorage.getItem('redaon-tema') || 'auto'; } catch(e) {}
  var efetivo = pref;
  if (pref === 'auto') {
    var claroNoSistema = false;
    try { claroNoSistema = window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e) {}
    efetivo = claroNoSistema ? 'claro' : 'escuro';
  }
  document.documentElement.setAttribute('data-tema', efetivo);
  document.documentElement.setAttribute('data-tema-pref', pref);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="aluno-base-v6.css" rel="stylesheet"/>

<style>
/* ═══ TELA · Plano de estudos · v1 (produção) ═══ */
#conteudo{ max-width:680px; margin:0 auto; width:100%; padding:0 .9rem 3rem; }
.rotuloTopo{ font-size:.66rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.9rem .1rem .25rem; }
.tituloTela{ font-family:Georgia,serif; font-size:1.22rem; font-weight:700; line-height:1.3; margin:0 .1rem .3rem; }
.porque{ font-size:.78rem; color:var(--text2); line-height:1.55; margin:0 .1rem .9rem; }
.porque b{ color:var(--cyan); font-weight:800; }

/* Ouro de conquista: mesmo tom vivo nos dois temas (padrão do Hub) */
:root, html[data-tema="claro"]{ --ouro:#fabd00; --ouroRGB:250,189,0; }

/* Progresso da semana */
.cardProg{ background:var(--surface); border:1px solid rgba(var(--borderRGB),.22); border-radius:1rem; padding:.85rem .95rem; margin-bottom:.9rem; display:flex; align-items:center; gap:.75rem; }
.cardProg .rotP{ font-size:.7rem; font-weight:700; color:var(--muted); }
.cardProg .trilho{ flex:1; height:8px; border-radius:99px; background:rgba(var(--borderRGB),.25); overflow:hidden; }
.cardProg .trilho i{ display:block; height:100%; border-radius:99px; background:var(--ouro); transition:width .4s; width:0; }
.cardProg .numP{ font-size:.95rem; font-weight:800; font-variant-numeric:tabular-nums; }

/* Cards de dia */
.dia{ display:flex; align-items:center; gap:.75rem; background:var(--surface); border:1px solid rgba(var(--borderRGB),.22); border-radius:1rem; padding:.8rem .9rem; margin-bottom:.55rem; min-height:60px; }
.dia.navegavel{ cursor:pointer; }
.dia .icd{ flex:0 0 auto; width:2rem; height:2rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; background:var(--surface2); }
.dia .txts{ flex:1; min-width:0; }
.dia .rotDia{ display:block; font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.dia .tarefa{ display:block; font-size:.85rem; font-weight:600; color:var(--text); margin-top:.1rem; }
.dia .onde{ display:block; font-size:.68rem; color:var(--muted); margin-top:.15rem; }
.dia .fimD{ flex:0 0 auto; font-size:.72rem; color:var(--muted); }
.dia.feito{ opacity:.62; }
.dia.feito .icd{ background:rgba(var(--greenRGB),.14); }
.dia.feito .tarefa{ text-decoration:line-through; text-decoration-thickness:1px; }
.dia.feito .fimD{ color:var(--green); font-weight:800; }
.dia.hoje{ border-color:rgba(var(--cyanRGB),.5); }
.dia.hoje .rotDia{ color:var(--cyan); }
.dia.hoje .icd{ background:rgba(var(--cyanRGB),.14); }
.dia.descanso .icd{ background:rgba(var(--greenRGB),.1); }

.btnFeito{ flex:0 0 auto; min-height:40px; padding:0 .8rem; border-radius:10px; border:1px solid rgba(var(--cyanRGB),.45); background:transparent; color:var(--cyan); font-size:.72rem; font-weight:800; cursor:pointer; font-family:inherit; white-space:nowrap; }

/* Rodapé de transparência */
.comoMontado{ background:var(--surface2); border:1px solid rgba(var(--borderRGB),.18); border-radius:1rem; padding:.8rem .95rem; margin-top:1rem; }
.comoMontado .t{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:.35rem; }
.comoMontado p{ font-size:.74rem; color:var(--text2); line-height:1.55; }
.comoMontado p b{ color:var(--text); }

/* Estados */
.estado{ text-align:center; padding:2.2rem 1rem; color:var(--muted); font-size:.82rem; line-height:1.6; }
.estado .em{ font-size:1.8rem; display:block; margin-bottom:.5rem; }
.hidden{ display:none !important; }

/* Conquista 5/5 (padrão ouro do produto) */
.veuPlano{ position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:120; display:none; align-items:center; justify-content:center; padding:1.5rem; }
.veuPlano.show{ display:flex; }
.conqPlano{ background:var(--top); border:1px solid rgba(var(--ouroRGB),.4); border-radius:1.25rem; padding:1.5rem 1.25rem; text-align:center; max-width:20rem; }
.conqPlano .circ{ width:3.4rem; height:3.4rem; border-radius:50%; background:rgba(var(--ouroRGB),.16); display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto .7rem; }
.conqPlano .r{ font-size:.95rem; font-weight:800; color:var(--ouro); }
.conqPlano .s{ font-size:.74rem; color:var(--text2); margin-top:.35rem; line-height:1.5; }
</style>
</head>
<body>

<div id="conteudo">
  <div class="estado" id="estadoCarregando"><span class="em">📅</span>Montando sua semana…</div>
  <div class="estado hidden" id="estadoErro"><span class="em">😕</span>Não consegui carregar seu plano agora.<br/>Confira a internet e recarregue a página.</div>

  <div class="hidden" id="telaPlano">
    <p class="rotuloTopo" id="rotSemana">Semana</p>
    <p class="tituloTela">Plano da semana</p>
    <p class="porque" id="fraseFoco"></p>

    <div class="cardProg">
      <span class="rotP">Progresso</span>
      <div class="trilho"><i id="barraProg"></i></div>
      <span class="numP" id="numProg">0/5</span>
    </div>

    <div id="listaDias"></div>

    <div class="comoMontado">
      <p class="t">Como este plano foi montado</p>
      <p id="txtComoMontado"></p>
    </div>
  </div>
</div>

<div class="veuPlano" id="veuSemana" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="conqPlano">
    <div class="circ">🏁</div>
    <p class="r">Semana completa!</p>
    <p class="s">Você fechou as 5 tarefas. A próxima semana chega segunda-feira, já calibrada pela sua Evolução.</p>
  </div>
</div>

<script src="supabase-auth.js"></script>
<script src="aluno-base-v6.js"></script>
<script>
/* ═══ RedaON · Plano de estudos · produção v1 ═══
   Regra determinística (P1a, custo zero de IA):
   foco = ?foco=CX da Evolução > pior competência das últimas 8 > nenhum.
   5 tarefas seg–sex; sáb+dom descanso por natureza (P7);
   nenhuma tarefa presa ao dia — ✓ aceito a qualquer momento. */
if (typeof authGuard === 'function') { authGuard('aluno'); }

montarEsqueleto({
  ativo:  '',
  titulo: 'Plano de estudos',
  icone:  'calendar_month',
  sino:   true,
  versao: 'aluno \u00b7 plano \u00b7 v1'
});

var NOME_COMP = { C1:'Norma culta', C2:'Tema e repert\u00f3rio', C3:'Argumenta\u00e7\u00e3o', C4:'Coes\u00e3o', C5:'Interven\u00e7\u00e3o' };
var DIAS_ROT = { 1:'seg', 2:'ter', 3:'qua', 4:'qui', 5:'sex' };
var ICONE_TIPO = { repertorio:'\uD83D\uDCDA', redacao:'\u270F\uFE0F', revisao:'\uD83D\uDD0D', exercicio:'\uD83C\uDFAF', flashcards:'\uD83C\uDFB4' };

var ITENS = [];        /* linhas de plano_itens desta semana */
var SEMANA_DE = null;  /* 'YYYY-MM-DD' da segunda-feira */
var FOCO = null;       /* 'C1'..'C5' ou null */
var ORIGEM_FOCO = '';  /* 'evolucao' | 'diagnostico' | '' */
var TEMA = null;       /* tema da semana, se houver */

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n){ return (n<10?'0':'')+n; }
function dataISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function segundaDaSemana(){
  var d = new Date(); d.setHours(0,0,0,0);
  var dow = d.getDay();                 /* 0=dom..6=sáb */
  var recuo = (dow === 0) ? 6 : dow-1;  /* volta até a segunda */
  d.setDate(d.getDate()-recuo);
  return d;
}
function diaHoje(){ var g=new Date().getDay(); return (g>=1 && g<=5) ? g : 0; } /* 0 = fim de semana */

/* ── Tema da Semana (mesmo padrão do Hub) ── */
var SEL_TEMA = 'id,titulo,categoria,nivel,ano_enem,aplicacao,descricao,semana_de';
async function temaDaSemana(){
  try{
    var res = await dbFetch(SUPABASE_URL + '/rest/v1/temas?select=' + SEL_TEMA + '&ativo=eq.true&semana_de=not.is.null&order=semana_de.desc&limit=8', {});
    if(!res.ok) return null;
    var rows = await res.json();
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    for (var i=0;i<rows.length;i++){
      var t = rows[i];
      var ini = new Date(t.semana_de + 'T00:00:00');
      var fim = new Date(ini); fim.setDate(fim.getDate() + 7);
      if (hoje >= ini && hoje < fim) return t;
    }
    return null;
  }catch(e){ console.warn('[tema da semana]', e); return null; }
}

/* ── Foco: ?foco=CX da Evolução > diagnóstico (pior média das últimas 8) ── */
function focoDaURL(){
  try{
    var m = (location.search||'').match(/[?&]foco=(C[1-5])/i);
    return m ? m[1].toUpperCase() : null;
  }catch(e){ return null; }
}
async function focoDoDiagnostico(){
  try{
    if (typeof dbGetHistoricoRedacoes !== 'function') return null;
    var hist = await dbGetHistoricoRedacoes(8);
    if (!hist || !hist.length) return null;
    var soma = {c1:0,c2:0,c3:0,c4:0,c5:0}, chaves=['c1','c2','c3','c4','c5'];
    hist.forEach(function(r){ chaves.forEach(function(k){ soma[k] += (r[k]||0); }); });
    var pior = chaves.slice().sort(function(a,b){ return soma[a]-soma[b]; })[0];
    return pior.toUpperCase();
  }catch(e){ console.warn('[diagnostico]', e); return null; }
}

/* ── Regra determinística: monta as 5 tarefas da semana ── */
function montarTarefas(){
  var destinoHub = TEMA ? ('hub-preparacao.html?tema=' + encodeURIComponent(TEMA.id)) : 'hub-preparacao.html';
  var rotRep  = TEMA ? ('Repert\u00f3rio do Tema da Semana') : 'Repert\u00f3rio para sua pr\u00f3xima reda\u00e7\u00e3o';
  var rotExe  = FOCO ? ('Refor\u00e7o de ' + FOCO + ' \u00b7 ' + NOME_COMP[FOCO]) : 'Refor\u00e7o da sua compet\u00eancia mais fraca';
  return [
    { dia:1, tipo:'repertorio', rotulo:rotRep, destino:destinoHub, competencia:null },
    { dia:2, tipo:'redacao',    rotulo:'Escrever e enviar uma reda\u00e7\u00e3o', destino:'nova-redacao.html?metodo=digitar', competencia:null },
    { dia:3, tipo:'revisao',    rotulo:'Revisar a corre\u00e7\u00e3o da PROfa', destino:'minhas-redacoes.html', competencia:null },
    { dia:4, tipo:'exercicio',  rotulo:rotExe, destino:destinoHub, competencia:FOCO },
    { dia:5, tipo:'flashcards', rotulo:'Flashcards de repert\u00f3rio', destino:destinoHub, competencia:null }
  ];
}

/* ── Banco ── */
async function carregarItens(uid){
  var url = SUPABASE_URL + '/rest/v1/plano_itens?aluno_id=eq.'+uid+'&semana_de=eq.'+SEMANA_DE+'&order=dia.asc'
    + '&select=id,dia,tipo,rotulo,destino,competencia,feito_em';
  var res = await dbFetch(url, {});
  if (!res.ok) throw new Error('plano_itens ' + res.status);
  return await res.json();
}
async function criarSemana(uid){
  var corpo = montarTarefas().map(function(t){
    return { aluno_id:uid, semana_de:SEMANA_DE, dia:t.dia, tipo:t.tipo, rotulo:t.rotulo, destino:t.destino, competencia:t.competencia };
  });
  var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Prefer':'return=representation' },
    body: JSON.stringify(corpo)
  });
  if (!res.ok) throw new Error('criar plano ' + res.status);
  return await res.json();
}
async function marcarFeitoBanco(id){
  var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens?id=eq.'+id, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify({ feito_em: new Date().toISOString() })
  });
  return res.ok;
}
/* Foco novo vindo da Evolução atualiza o item de exercício da semana corrente */
async function atualizarFocoExistente(){
  var exe = ITENS.filter(function(i){ return i.tipo==='exercicio'; })[0];
  if (!exe || !FOCO || exe.competencia === FOCO || exe.feito_em) return;
  var rotNovo = 'Refor\u00e7o de ' + FOCO + ' \u00b7 ' + NOME_COMP[FOCO];
  var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens?id=eq.'+exe.id, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify({ competencia: FOCO, rotulo: rotNovo })
  });
  if (res.ok){ exe.competencia = FOCO; exe.rotulo = rotNovo; toast('Foco de refor\u00e7o atualizado: ' + FOCO); }
}
/* Redação da semana marca sozinha (P3): existe redação enviada desde segunda? */
async function autoMarcarRedacao(uid){
  var item = ITENS.filter(function(i){ return i.tipo==='redacao' && !i.feito_em; })[0];
  if (!item) return;
  try{
    var url = SUPABASE_URL + '/rest/v1/redacoes?aluno_id=eq.'+uid+'&created_at=gte.'+SEMANA_DE+'T00:00:00&select=id&limit=1';
    var res = await dbFetch(url, {});
    if (!res.ok) return;
    var rows = await res.json();
    if (rows.length){
      var ok = await marcarFeitoBanco(item.id);
      if (ok) item.feito_em = new Date().toISOString();
    }
  }catch(e){ console.warn('[auto redacao]', e); }
}

/* ── Render ── */
function ondeAcontece(item){
  if (item.tipo==='redacao') return 'marcada sozinha quando voc\u00ea envia';
  if (item.tipo==='revisao') return 'em Minhas Reda\u00e7\u00f5es \u00b7 An\u00e1lise e Reescrita';
  if (item.tipo==='exercicio') return TEMA ? ('no Hub \u00b7 ' + esc(TEMA.titulo)) : 'no Hub de Prepara\u00e7\u00e3o';
  return TEMA ? ('no Hub de Prepara\u00e7\u00e3o \u00b7 ' + esc(TEMA.titulo)) : 'no Hub de Prepara\u00e7\u00e3o';
}
function renderPlano(){
  var hoje = diaHoje();
  var feitos = ITENS.filter(function(i){ return !!i.feito_em; }).length;
  document.getElementById('numProg').textContent = feitos + '/5';
  document.getElementById('barraProg').style.width = Math.round(feitos/5*100) + '%';

  var h = ITENS.map(function(item){
    var feito = !!item.feito_em;
    var ehHoje = (!feito && item.dia === hoje);
    var cls = 'dia' + (feito ? ' feito' : '') + (ehHoje ? ' hoje' : '') + (feito ? '' : ' navegavel');
    var rot = (ehHoje ? 'Hoje \u00b7 ' : '') + DIAS_ROT[item.dia];
    var fim;
    if (feito) fim = '<span class="fimD">\u2713</span>';
    else if (item.tipo === 'redacao') fim = '<span class="fimD">\u203A</span>';
    else fim = '<button class="btnFeito" onclick="event.stopPropagation();marcarFeito(\'' + item.id + '\', this)">Marcar feito</button>';
    var nav = feito ? '' : ' onclick="irPara(\'' + esc(item.destino||'') + '\')"';
    return '<div class="' + cls + '"' + nav + '>'
      + '<span class="icd">' + (ICONE_TIPO[item.tipo]||'\uD83D\uDCCC') + '</span>'
      + '<span class="txts">'
      +   '<span class="rotDia">' + rot + '</span>'
      +   '<span class="tarefa">' + esc(item.rotulo) + '</span>'
      +   '<span class="onde">' + ondeAcontece(item) + '</span>'
      + '</span>' + fim + '</div>';
  });

  /* Fim de semana: descanso por natureza (P7) — sem tarefa, sem prescrição */
  var fdsHoje = (diaHoje() === 0);
  h.push('<div class="dia descanso' + (fdsHoje ? ' hoje' : '') + '">'
    + '<span class="icd">\uD83C\uDF3F</span>'
    + '<span class="txts">'
    +   '<span class="rotDia">' + (fdsHoje ? 'Hoje \u00b7 ' : '') + 's\u00e1b \u00b7 dom</span>'
    +   '<span class="tarefa">Fim de semana livre</span>'
    +   '<span class="onde">se quiser adiantar, as tarefas aceitam \u2713 em qualquer dia</span>'
    + '</span><span class="fimD">\u263A</span></div>');

  document.getElementById('listaDias').innerHTML = h.join('');
}
function renderCabecalho(){
  var ini = new Date(SEMANA_DE + 'T00:00:00');
  var fim = new Date(ini); fim.setDate(fim.getDate()+6);
  var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var rot = 'Semana de ' + ini.getDate() + ' a ' + fim.getDate() + ' de ' + MES[fim.getMonth()];
  document.getElementById('rotSemana').textContent = rot;

  var fr = document.getElementById('fraseFoco');
  if (FOCO) {
    var motivo = (ORIGEM_FOCO === 'evolucao')
      ? 'foi voc\u00ea que escolheu na Evolu\u00e7\u00e3o'
      : '\u00e9 onde sua Evolu\u00e7\u00e3o mostra mais espa\u00e7o para crescer';
    fr.innerHTML = 'Semana com foco em <b>' + FOCO + ' \u00b7 ' + NOME_COMP[FOCO] + '</b> \u2014 ' + motivo + '.';
  } else {
    fr.innerHTML = 'Sua primeira semana de ritmo. Depois da primeira reda\u00e7\u00e3o corrigida, o plano passa a mirar a sua compet\u00eancia mais fraca.';
  }

  var partes = [];
  partes.push(FOCO ? ('do seu foco em <b>' + FOCO + '</b>' + (ORIGEM_FOCO==='evolucao' ? ' (escolhido por voc\u00ea na Evolu\u00e7\u00e3o)' : ' (sua <b>Evolu\u00e7\u00e3o</b>)')) : 'do seu come\u00e7o na RedaON');
  if (TEMA) partes.push('do <b>Tema da Semana</b> (' + esc(TEMA.titulo) + ')');
  partes.push('do ritmo de <b>1 reda\u00e7\u00e3o por semana</b>');
  document.getElementById('txtComoMontado').innerHTML =
    'A RedaON montou sua semana a partir ' + partes.join(', ') + '. Toda segunda-feira, uma semana nova. Nenhuma tarefa \u00e9 presa ao dia \u2014 o ritmo \u00e9 sugest\u00e3o, a ordem \u00e9 sua.';
}

/* ── Interações ── */
window.irPara = function(destino){ if (destino) window.location.href = destino; };
window.marcarFeito = async function(id, btn){
  var item = ITENS.filter(function(i){ return String(i.id)===String(id); })[0];
  if (!item || item.feito_em) return;
  if (btn){ btn.disabled = true; btn.textContent = '\u2026'; }
  var ok = await marcarFeitoBanco(id);
  if (!ok){
    if (btn){ btn.disabled = false; btn.textContent = 'Marcar feito'; }
    toast('N\u00e3o consegui salvar. Tente de novo.');
    return;
  }
  item.feito_em = new Date().toISOString();
  renderPlano();
  var feitos = ITENS.filter(function(i){ return !!i.feito_em; }).length;
  if (feitos >= 5) document.getElementById('veuSemana').classList.add('show');
  else toast('\u2713 Tarefa conclu\u00edda');
};

/* ── Carga ── */
function mostrarEstado(id){
  ['estadoCarregando','estadoErro','telaPlano'].forEach(function(k){
    document.getElementById(k).classList.toggle('hidden', k !== id);
  });
}
(async function init(){
  try{
    var uid = (typeof authGetUserId === 'function') ? authGetUserId() : null;
    if (!uid) { mostrarEstado('estadoErro'); return; }
    SEMANA_DE = dataISO(segundaDaSemana());

    var focoURL = focoDaURL();
    TEMA = await temaDaSemana();
    ITENS = await carregarItens(uid);

    if (ITENS.length) {
      /* semana já montada: foco da URL atualiza o exercício pendente */
      if (focoURL) { FOCO = focoURL; ORIGEM_FOCO = 'evolucao'; await atualizarFocoExistente(); }
      var exe = ITENS.filter(function(i){ return i.tipo==='exercicio'; })[0];
      if (!FOCO && exe && exe.competencia) { FOCO = exe.competencia; ORIGEM_FOCO = 'diagnostico'; }
    } else {
      if (focoURL) { FOCO = focoURL; ORIGEM_FOCO = 'evolucao'; }
      else { FOCO = await focoDoDiagnostico(); ORIGEM_FOCO = FOCO ? 'diagnostico' : ''; }
      ITENS = await criarSemana(uid);
    }

    await autoMarcarRedacao(uid);
    renderCabecalho();
    renderPlano();
    mostrarEstado('telaPlano');
  }catch(e){
    console.warn('[plano]', e);
    mostrarEstado('estadoErro');
  }
})();
</script>
