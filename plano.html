<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RedaON | Meu Plano</title>
<!-- v2-2 (21/09/2026): as estrelas viram série posicional — uma por redação, antiga à esquerda e recente à direita, acesa onde a nota foi 200. -->
<!-- v2-1 (21/09/2026): as estrelas passavam a contar as redações com 200 na competência (antes 160+).
     RedaON · Portal do Aluno · Meu Plano · produção v2-0 (21/09/2026)
     Fusão de Plano de estudos + Evolução, aprovada ponto a ponto pelo Alan:
     · nome "Meu Plano", ícone bússola na linha .pgHead (sem caixa)
     · dois cards em rolagem lateral: "Sua semana" e "Como você está"
     · a semana é uma trilha vertical de 5 passos, com ícone Fluent solto (sem círculo)
       feito = ✅ e texto riscado · hoje = halo ciano e selo "hoje"
       ficou para trás = despertador, texto e botão em vermelho, selo "em atraso"
     · nada de "Marcar feito": o estado é lido dos fatos. A única exceção declarada
       pela Profa. Blanche é o "revisei" da correção, que tem botão.
     · régua de cores igual à do Início: 0-79 vermelho · 80-120 amarelo · 121-199 verde · 200 ouro
     · média das ÚLTIMAS 4 redações (um mês, uma por semana)
     · troféu aos 200 e a série de estrelas das 4 últimas redações, antiga → recente,
       acesa onde a competência tirou 200 (formato dos "últimos jogos")
     · foco da semana = menor nota da ÚLTIMA redação (regra da Profa. Blanche)
     · descanso padrão: sábado, o aluno troca na gaveta (plano_config)
     Pendências conhecidas (fatias 2 e 3): o Preparar ainda grava as etapas pelo botão antigo,
     e o passo da competência só se marca quando a tela de exercícios existir. -->
<script>
(function(){
  var pref = 'auto';
  try { pref = localStorage.getItem('redaon-tema') || 'auto'; } catch(e) {}
  var efetivo = pref;
  if (pref === 'auto') {
    var claroNoSistema = false;
    try { claroNoSistema = window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e) {}
    efetivo = claroNoSistema ? 'claro' : 'escuro';
  }
  document.documentElement.setAttribute('data-tema', efetivo);
  document.documentElement.setAttribute('data-tema-pref', pref);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="aluno-base-v6.css?v=6-16" rel="stylesheet"/>

<style>
/* ══ Meu Plano ══ */
.estado{ display:flex; flex-direction:column; align-items:center; gap:.6rem; padding:3.2rem 1rem;
  font-size:.88rem; color:var(--muted); text-align:center; }
.estado .fe{ width:34px; height:34px; }

.rotTopo{ font-size:.66rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); margin:0 .1rem .18rem; }
.foco{ font-size:.85rem; color:var(--text2); line-height:1.5; margin:0 .1rem .2rem; }
.foco b{ color:var(--cyan); }

/* rolagem lateral dos dois cards */
.trilhoCards{ display:flex; gap:.75rem; overflow-x:auto; scroll-snap-type:x mandatory;
  scrollbar-width:none; -ms-overflow-style:none; margin:.85rem -1rem 0; padding:.1rem 1rem .3rem; }
.trilhoCards::-webkit-scrollbar{ display:none; }
.cartao{ flex:0 0 100%; scroll-snap-align:center; background:var(--surface);
  border:1px solid rgba(var(--borderRGB),.14); border-radius:1.1rem; padding:.9rem .85rem 1rem; }
.cabCart{ display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; }
.cabCart h2{ font-size:.95rem; font-weight:800; margin:0; }
.cabCart span{ font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap; }
.subCart{ font-size:.75rem; color:var(--muted); line-height:1.45; margin:.15rem 0 .7rem; }
.pontos{ display:flex; gap:.35rem; justify-content:center; margin:.6rem 0 .2rem; }
.pontos i{ width:6px; height:6px; border-radius:50%; background:rgba(var(--borderRGB),.28); display:block;
  transition:width .18s ease, background .18s ease; }
.pontos i.on{ background:var(--cyan); width:18px; border-radius:99px; }

/* progresso */
.prog{ display:flex; align-items:center; gap:.6rem; margin-bottom:.75rem; }
.prog .rot{ font-size:.73rem; font-weight:700; color:var(--muted); }
.prog .pista{ flex:1; height:7px; border-radius:99px; background:rgba(var(--borderRGB),.16); overflow:hidden; }
.prog .pista i{ display:block; height:100%; background:var(--cyan); transition:width .3s ease; }
.prog b{ font-size:.86rem; font-weight:800; font-variant-numeric:tabular-nums; }

/* ── trilha da semana ── */
.passo{ display:flex; gap:.7rem; align-items:flex-start; padding-bottom:.75rem; }
.passo:last-of-type{ padding-bottom:0; }
.marca{ flex:0 0 30px; display:flex; flex-direction:column; align-items:center; align-self:stretch; }
.icoP{ width:30px; height:30px; display:block; flex:0 0 auto; }
.linha{ flex:1; width:2px; background:rgba(var(--borderRGB),.18); margin:.2rem 0 -.75rem; min-height:13px; }
.passo:last-of-type .linha{ display:none; }
.corpoP{ flex:1; min-width:0; padding-top:.2rem; }
.dia{ font-size:.63rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.nomeP{ font-size:.86rem; font-weight:700; line-height:1.3; margin:.05rem 0 .1rem; }
.ondeP{ font-size:.72rem; color:var(--muted); line-height:1.42; }
.selo{ display:inline-block; font-size:.58rem; font-weight:800; text-transform:uppercase;
  letter-spacing:.05em; border-radius:99px; padding:2px 8px; margin-left:.35rem; vertical-align:1px; }
.selo.hoje{ background:var(--cyan); color:var(--onCyan); }
.selo.atr{ background:var(--red); color:#fff; }
html[data-tema="escuro"] .selo.atr{ color:#2a0e0e; }

.passo.feito .linha{ background:rgba(var(--greenRGB),.35); }
.passo.feito .nomeP{ color:var(--muted); font-weight:600; text-decoration:line-through; }
.passo.feito .ondeP{ opacity:.7; }
.passo.feito .dia{ color:var(--green); }
.passo.agora .icoP{ border-radius:50%; box-shadow:0 0 0 3px rgba(var(--cyanRGB),.18); }
.passo.agora .dia{ color:var(--cyan); }
.passo.agora .corpoP{ background:rgba(var(--cyanRGB),.07); border:1px solid rgba(var(--cyanRGB),.32);
  border-radius:.8rem; padding:.55rem .7rem; margin-top:-.25rem; }
.passo.depois .icoP{ opacity:.62; }
.passo.atraso .linha{ background:rgba(var(--redRGB),.35); margin-top:.25rem; }
.passo.atraso .dia, .passo.atraso .nomeP, .passo.atraso .ondeP{ color:var(--red); }
.passo.atraso .nomeP{ font-weight:800; }

.btP{ display:inline-flex; align-items:center; gap:.3rem; margin-top:.5rem; border:0; border-radius:.6rem;
  font-family:inherit; font-size:.78rem; font-weight:800; padding:.45rem .8rem; cursor:pointer;
  background:var(--cyan); color:var(--onCyan); min-height:34px; }
.btP.verm{ background:var(--red); color:#fff; }
html[data-tema="escuro"] .btP.verm{ color:#2a0e0e; }
.btP.fantasma{ background:transparent; border:1px solid rgba(var(--borderRGB),.3); color:var(--cyan); }
.btP .fim{ font-size:.9rem; line-height:1; }

.livre{ display:flex; gap:.7rem; align-items:center; margin-top:.75rem;
  border-top:1px solid rgba(var(--borderRGB),.12); padding-top:.7rem; }
.livre .icoP{ width:26px; height:26px; }
.livre .nomeP{ margin:0; }
.livre .link{ color:var(--cyan); cursor:pointer; text-decoration:underline; text-decoration-style:dotted; }

/* ── boletim ── */
.notaG{ display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; margin-bottom:.7rem; }
.notaG b{ font-size:1.85rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.notaG .de{ font-size:.74rem; color:var(--muted); }
.notaG .var{ font-size:.72rem; font-weight:800; }
.grafico{ border:1px solid rgba(var(--borderRGB),.14); border-radius:.8rem; padding:.6rem .65rem .35rem; margin-bottom:.8rem; }
.grafico .cab{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.3rem; }
.grafico .cab b{ font-size:.77rem; font-weight:800; }
.grafico .cab span{ font-size:.67rem; color:var(--muted); }
.grafico svg{ width:100%; height:56px; display:block; }
.grafico .eixo{ display:flex; justify-content:space-between; font-size:.63rem; color:var(--muted); margin-top:.1rem; }

.ajuda{ display:flex; align-items:center; gap:.35rem; font-size:.71rem; color:var(--muted); margin:0 0 .5rem; }
.comps{ display:flex; flex-direction:column; gap:.5rem; }
.comp{ background:var(--bg); border:1px solid rgba(var(--borderRGB),.14); border-radius:.75rem;
  padding:.55rem .65rem .6rem; cursor:pointer; width:100%; text-align:left; font-family:inherit; }
.comp .l1{ display:flex; align-items:center; gap:.45rem; margin-bottom:.4rem; }
.comp .nm{ flex:1; min-width:0; font-size:.8rem; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.comp .nm em{ font-style:normal; color:var(--text2); font-weight:500; }
.capsula{ display:inline-flex; align-items:center; gap:.25rem; flex:0 0 auto; font-size:.64rem; font-weight:800;
  color:var(--text); background:rgba(var(--cyanRGB),.14); border-radius:99px; padding:3px 9px 3px 7px; }
.capsula .fe{ width:13px; height:13px; }
.estrelas{ display:inline-flex; gap:3px; flex:0 0 auto; background:rgba(var(--cyanRGB),.14);
  border-radius:99px; padding:3px 7px; }
.estrelas svg{ width:12px; height:12px; color:rgba(var(--borderRGB),.30); }
.estrelas svg.on{ color:#fabd00; }
.comp .l2{ display:flex; align-items:center; gap:.55rem; }
.comp .pista{ flex:1; height:8px; border-radius:99px; background:rgba(var(--borderRGB),.14); overflow:hidden; }
.comp .pista i{ display:block; height:100%; border-radius:99px; }
.comp .vl{ flex:0 0 32px; text-align:right; font-size:.82rem; font-weight:800; font-variant-numeric:tabular-nums; }
.comp .chev{ flex:0 0 12px; display:flex; align-items:center; justify-content:center; font-size:.9rem; font-weight:800; }
/* régua igual à do Início: 0-79 vermelho · 80-120 amarelo · 121-199 verde · 200 ouro */
.nv-verm .pista i{ background:var(--red); }   .nv-verm .vl, .nv-verm .chev{ color:var(--red); }
.nv-amar .pista i{ background:var(--orange); }.nv-amar .vl, .nv-amar .chev{ color:var(--orange); }
.nv-verde .pista i{ background:var(--green); }.nv-verde .vl, .nv-verde .chev{ color:var(--green); }
.nv-ouro .pista i{ background:#fabd00; }      .nv-ouro .vl, .nv-ouro .chev{ color:#fabd00; }
html[data-tema="claro"] .nv-ouro .vl, html[data-tema="claro"] .nv-ouro .chev{ color:#9a7a10; }
.comp.focoC{ border-color:var(--orange); background:rgba(var(--orangeRGB),.06); }
.selFoco{ font-size:.58rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
  background:var(--orange); color:#fff; border-radius:99px; padding:2px 7px; flex:0 0 auto; }
.rodape{ font-size:.7rem; color:var(--muted); line-height:1.45; margin-top:.6rem; }
.rodape a{ color:var(--cyan); }

/* gaveta */
.gvBg{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
  transition:opacity .2s ease; z-index:60; }
.gvBg.open{ opacity:1; pointer-events:auto; }
.gv{ position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--surface);
  border-radius:1.1rem 1.1rem 0 0; padding:.7rem 1rem 1.4rem; transform:translateY(102%);
  transition:transform .24s ease; max-height:82vh; overflow-y:auto; }
.gv.open{ transform:translateY(0); }
.gvGrip{ width:38px; height:4px; border-radius:99px; background:rgba(var(--borderRGB),.3); margin:.15rem auto .7rem; }
.gvTit{ font-size:1rem; font-weight:800; margin-bottom:.2rem; }
.gvSub{ font-size:.78rem; color:var(--muted); line-height:1.45; margin-bottom:.8rem; }
.opt{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; min-height:46px;
  border:1px solid rgba(var(--borderRGB),.18); border-radius:.8rem; padding:.6rem .8rem;
  margin-bottom:.45rem; font-size:.86rem; cursor:pointer; background:var(--bg); color:var(--text); width:100%;
  font-family:inherit; text-align:left; }
.opt .ck{ opacity:0; color:var(--cyan); font-weight:800; }
.opt.sel{ border-color:var(--cyan); background:rgba(var(--cyanRGB),.08); }
.opt.sel .ck{ opacity:1; }

@media(min-width:641px){
  .cartao{ flex:0 0 min(420px, 86%); }
  .nomeP{ font-size:.92rem; }
}
</style>
</head>
<body>
<div id="main-content" style="display:flex;flex-direction:column;min-height:100vh;">
<div id="conteudo">

  <div class="estado" id="estadoCarregando">Montando a sua semana…</div>
  <div class="estado hidden" id="estadoErro">Não consegui carregar o seu plano agora.<br/>Confira a internet e recarregue a página.</div>

  <div class="hidden" id="tela">
    <p class="rotTopo" id="rotSemana">Semana</p>
    <p class="foco" id="fraseFoco"></p>
    <div class="trilhoCards" id="trilhoCards"></div>
    <div class="pontos" id="pontos"><i class="on"></i><i></i></div>
  </div>

</div>
</div>

<!-- gaveta: dias de descanso -->
<div class="gvBg" id="gvDiasBg" onclick="fecharGaveta('gvDias')"></div>
<div class="gv" id="gvDias">
  <div class="gvGrip"></div>
  <p class="gvTit">Quais são os seus dias de descanso?</p>
  <p class="gvSub">A RedaON sugere os dias respeitando o seu ritmo. Nenhuma tarefa é presa ao dia: você pode fazer tudo de uma vez.</p>
  <button class="opt" data-v="sab"     onclick="escolherDescanso(this)"><span>Só sábado</span><span class="ck">✓</span></button>
  <button class="opt" data-v="sab_dom" onclick="escolherDescanso(this)"><span>Sábado e domingo</span><span class="ck">✓</span></button>
  <button class="opt" data-v="dom"     onclick="escolherDescanso(this)"><span>Só domingo</span><span class="ck">✓</span></button>
  <button class="opt" data-v="nenhum"  onclick="escolherDescanso(this)"><span>Nenhum — estudo todos os dias</span><span class="ck">✓</span></button>
</div>

<!-- gaveta: trocar a competência do foco -->
<div class="gvBg" id="gvFocoBg" onclick="fecharGaveta('gvFoco')"></div>
<div class="gv" id="gvFoco">
  <div class="gvGrip"></div>
  <p class="gvTit" id="gvFocoTit">Treinar esta competência</p>
  <p class="gvSub" id="gvFocoSub"></p>
  <div id="gvFocoOpts"></div>
</div>

<script src="supabase-auth.js"></script>
<script src="aluno-base-v6.js?v=6-16"></script>
<script>
console.info('[RedaON] Meu Plano v2-2');
document.documentElement.setAttribute('data-tela','meu-plano');
if (typeof authGuard === 'function') { authGuard('aluno'); }

montarEsqueleto({ ativo:'', titulo:'Meu Plano', icone:'bussola', sino:true, versao:'aluno · meu plano · v2-2' });

var NOME_COMP = { C1:'Norma culta', C2:'Repertório', C3:'Argumentação', C4:'Coesão', C5:'Intervenção' };
var NOME_DIA  = { 1:'seg', 2:'ter', 3:'qua', 4:'qui', 5:'sex', 6:'sáb', 7:'dom' };
var DIA_LONGO = { 1:'segunda', 2:'terça', 3:'quarta', 4:'quinta', 5:'sexta', 6:'sábado', 7:'domingo' };

var SEMANA_DE = null;      /* 'YYYY-MM-DD' da segunda */
var DESCANSO  = 'sab';     /* padrão definido pela Profa. Blanche; o aluno troca na gaveta */
var TEMA      = null;      /* tema da semana */
var FOCO      = null;      /* 'C1'..'C5' */
var ITENS     = [];        /* plano_itens desta semana */
var HIST      = [];        /* redações corrigidas, recente → antiga */
var PREP      = null;      /* linha de preparacoes do tema da semana */
var ESCREVEU  = false;     /* enviou redação nesta semana? */
var TEM_EXERC = false;     /* existe exercício publicado da competência do foco? */
var UID       = null;

/* ── datas ── */
function segundaDaSemana(d){
  var x = d ? new Date(d) : new Date();
  var n = x.getDay(); var dif = (n === 0 ? -6 : 1 - n);
  x.setDate(x.getDate() + dif); x.setHours(0,0,0,0); return x;
}
function dataISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function diaHoje(){ var n = new Date().getDay(); return n === 0 ? 7 : n; }
function diasDeDescanso(){
  if (DESCANSO === 'sab') return [6];
  if (DESCANSO === 'dom') return [7];
  if (DESCANSO === 'nenhum') return [];
  return [6,7];
}
function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── a régua de cores é a mesma do Início ── */
function nivel(v){
  if (v >= 200) return 'nv-ouro';
  if (v >= 121) return 'nv-verde';
  if (v >= 80)  return 'nv-amar';
  return 'nv-verm';
}

/* ── os cinco passos da semana, na ordem aprovada pela Profa. Blanche ──
   prontos: o que acende cada um está em `feito`, lido dos fatos. */
function passos(){
  var destHub  = TEMA ? ('hub-preparacao.html?tema=' + encodeURIComponent(TEMA.id)) : 'hub-preparacao.html';
  var destEscr = 'nova-redacao.html?metodo=digitar' + (TEMA ? ('&tema=' + encodeURIComponent(TEMA.id)) : '');
  var nomeFoco = FOCO ? (FOCO + ' · ' + NOME_COMP[FOCO]) : 'a sua competência mais fraca';
  return [
    { tipo:'repertorio', ico:'lampada', nome:'Entender o tema e o material de apoio',
      onde: TEMA ? ('no Preparar · ' + esc(TEMA.titulo)) : 'no Preparar',
      dest: destHub, feito: !!(PREP && (PREP.entender_em || PREP.repertorio_em)) },
    { tipo:'flashcards', ico:'cartas', nome:'Atividades do tema',
      onde:'flashcards, resumo e quiz, no Preparar',
      dest: destHub, feito: !!(PREP && PREP.estudio_em) },
    { tipo:'redacao', ico:'lapis', nome:'Escrever e enviar a redação',
      onde:'marca sozinha quando você envia',
      dest: destEscr, feito: ESCREVEU },
    { tipo:'revisao', ico:'memo', nome:'Revisar a correção e a Reescrita',
      onde:'em Minhas Redações · Análise e Reescrita',
      dest:'minhas-redacoes.html', feito: feitoNoBanco('revisao'), botao:'revisei' },
    { tipo:'exercicio', ico:'alvo', nome:'Treinar ' + nomeFoco,
      onde: TEM_EXERC ? 'exercício da competência, no Preparar' : 'os exercícios desta competência estão em preparação',
      dest: destHub, feito: feitoNoBanco('exercicio'), bloqueado: !TEM_EXERC }
  ];
}
function feitoNoBanco(tipo){
  for (var i=0; i<ITENS.length; i++) if (ITENS[i].tipo === tipo && ITENS[i].feito_em) return true;
  return false;
}
function itemDoTipo(tipo){
  for (var i=0; i<ITENS.length; i++) if (ITENS[i].tipo === tipo) return ITENS[i];
  return null;
}

/* ── dias sugeridos: a ordem dos passos nos dias que não são de descanso ── */
function diasSugeridos(){
  var folga = diasDeDescanso();
  var uteis = [1,2,3,4,5,6,7].filter(function(d){ return folga.indexOf(d) === -1; });
  var mapa = {};
  passos().forEach(function(p, i){ mapa[p.tipo] = uteis[i] || uteis[uteis.length-1]; });
  return mapa;
}

/* ══ CARD 1 · Sua semana ══ */
function cardSemana(){
  var ps = passos();
  var sug = diasSugeridos();
  var hoje = diaHoje();
  var feitos = ps.filter(function(p){ return p.feito; }).length;

  var ini = new Date(SEMANA_DE + 'T00:00:00');
  var fim = new Date(ini); fim.setDate(fim.getDate() + 6);
  var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var periodo = ini.getDate() + ' a ' + fim.getDate() + ' de ' + MES[fim.getMonth()];

  var h = '<div class="cartao"><div class="cabCart"><h2>Sua semana</h2><span>' + periodo + '</span></div>'
    + '<p class="subCart">Os dias são sugestão. Pode fazer tudo hoje e deixar o resto da semana livre.</p>'
    + '<div class="prog"><span class="rot">Progresso</span>'
    + '<div class="pista"><i style="width:' + (feitos/ps.length*100) + '%"></i></div>'
    + '<b>' + feitos + '/' + ps.length + '</b></div>';

  /* Estados, calculados antes de desenhar:
     · feito
     · em atraso: não feito e o dia sugerido já passou (regra da Profa. Blanche: no dia seguinte)
     · agora: o primeiro não feito cujo dia é hoje; se os de hoje já estão feitos, o
       primeiro pendente adiante vira o "agora" — o aluno pode adiantar quando quiser
     · depois: o resto */
  var estados = {};
  var achouAgora = false;
  ps.forEach(function(p){
    var d = sug[p.tipo];
    if (p.feito) estados[p.tipo] = 'feito';
    else if (d < hoje) estados[p.tipo] = 'atraso';
    else if (!achouAgora && d <= hoje) { estados[p.tipo] = 'agora'; achouAgora = true; }
    else estados[p.tipo] = 'depois';
  });
  if (!achouAgora) {
    for (var k=0; k<ps.length; k++){
      if (estados[ps[k].tipo] === 'depois') { estados[ps[k].tipo] = 'agora'; break; }
    }
  }

  ps.forEach(function(p){
    var d = sug[p.tipo];
    var estado = estados[p.tipo];

    var marca = (estado === 'feito') ? feIcone('feitoBotao')
              : (estado === 'atraso') ? feIcone('despertador')
              : feIcone(p.ico);
    marca = marca.replace('class="fe"', 'class="fe icoP"');

    var rot = NOME_DIA[d] || '';
    if (estado === 'feito')  rot += ' · feito';
    if (estado === 'agora')  rot += '<span class="selo hoje">hoje</span>';
    if (estado === 'atraso') rot += '<span class="selo atr">em atraso</span>';

    var onde = (estado === 'atraso')
      ? ('era para ' + DIA_LONGO[d] + ' · faça assim que puder')
      : p.onde;

    var botao = '';
    if (!p.feito && !p.bloqueado && (estado === 'agora' || estado === 'atraso')) {
      var cls = 'btP' + (estado === 'atraso' ? ' verm' : '');
      var txt = (estado === 'atraso') ? 'Fazer agora' : 'Começar';
      botao = '<button class="' + cls + '" onclick="irPara(\'' + esc(p.dest) + '\')">' + txt + '<span class="fim">›</span></button>';
    }
    if (p.botao === 'revisei' && !p.feito) {
      botao += ' <button class="btP fantasma" onclick="marcarRevisei(this)">Já revisei</button>';
    }

    h += '<div class="passo ' + estado + '">'
      +    '<span class="marca">' + marca + '<span class="linha"></span></span>'
      +    '<div class="corpoP">'
      +      '<p class="dia">' + rot + '</p>'
      +      '<p class="nomeP">' + esc(p.nome) + '</p>'
      +      '<p class="ondeP">' + onde + '</p>'
      +      botao
      +    '</div></div>';
  });

  var folga = diasDeDescanso();
  if (folga.length) {
    var nomes = folga.map(function(d){ return DIA_LONGO[d]; }).join(' e ');
    h += '<div class="livre">' + feIcone('sol').replace('class="fe"','class="fe icoP"')
      +  '<div><p class="nomeP">' + nomes.charAt(0).toUpperCase() + nomes.slice(1) + ' livre' + (folga.length > 1 ? 's' : '') + '</p>'
      +  '<p class="ondeP"><span class="link" onclick="abrirGaveta(\'gvDias\')">ajustar meus dias de descanso</span></p></div></div>';
  } else {
    h += '<div class="livre">' + feIcone('sol').replace('class="fe"','class="fe icoP"')
      +  '<div><p class="nomeP">Sem dia de descanso</p>'
      +  '<p class="ondeP"><span class="link" onclick="abrirGaveta(\'gvDias\')">ajustar meus dias de descanso</span></p></div></div>';
  }
  return h + '</div>';
}

/* ══ CARD 2 · Como você está ══ */
function mediaDe(campo, n){
  var usa = HIST.slice(0, n || 4);
  if (!usa.length) return null;
  var soma = 0;
  usa.forEach(function(r){ soma += (r[campo] || 0); });
  return Math.round(soma / usa.length);
}
function estrelasDe(campo){
  /* v2-2 · série de resultados, no formato dos últimos jogos: uma estrela por redação,
     da mais ANTIGA à esquerda para a mais RECENTE à direita. Acende onde tirou 200. */
  return HIST.slice(0, 4).slice().reverse().map(function(r){
    return { nota: (r[campo] || 0), acesa: (r[campo] || 0) >= 200 };
  });
}
var ESTRELA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>';

function cardBoletim(){
  var usa = HIST.slice(0, 4);
  var h = '<div class="cartao"><div class="cabCart"><h2>Como você está</h2>'
    + '<span>' + (usa.length === 1 ? 'sua 1ª redação' : 'últimas ' + usa.length + ' redações') + '</span></div>';

  if (!usa.length) {
    return h + '<p class="subCart">Assim que a sua primeira redação for corrigida, o seu desempenho aparece aqui, competência por competência.</p></div>';
  }

  h += '<p class="subCart">Um mês de trabalho, uma redação por semana.</p>';

  var media = mediaDe('total', 4);
  var varTxt = '';
  if (usa.length >= 2) {
    var dif = usa[0].total - usa[1].total;
    varTxt = '<span class="var" style="color:' + (dif > 0 ? 'var(--green)' : (dif < 0 ? 'var(--red)' : 'var(--muted)')) + '">'
      + (dif > 0 ? '+' + dif : dif) + ' na última</span>';
  }
  h += '<div class="notaG"><b>' + media + '</b><span class="de">média do mês</span>' + varTxt + '</div>';

  /* gráfico: notas das 4, antiga → recente */
  var notas = usa.slice().reverse().map(function(r){ return r.total; });
  if (notas.length >= 2) {
    var W = 300, H = 56, pad = 6, max = 1000;
    var pts = notas.map(function(v, i){
      var x = pad + i * ((W - 2*pad) / (notas.length - 1));
      var y = (H - pad) - (v / max) * (H - 2*pad);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var ult = pts[pts.length-1].split(',');
    h += '<div class="grafico"><div class="cab"><b>Sua nota, redação a redação</b><span>' + notas.length + ' redações</span></div>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="evolução da nota">'
      + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--cyan)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="' + ult[0] + '" cy="' + ult[1] + '" r="3.6" fill="var(--cyan)"/>'
      + '</svg><div class="eixo"><span>mais antiga</span><span>agora</span></div></div>';
  }

  h += '<p class="ajuda">Toque em uma competência para treinar</p><div class="comps">';
  ['C1','C2','C3','C4','C5'].forEach(function(c){
    var campo = c.toLowerCase();
    var v = mediaDe(campo, 4);
    var serie = estrelasDe(campo);
    var eFoco = (FOCO === c);
    var estrelasHTML = '<span class="estrelas" title="uma estrela por redação, da mais antiga à mais recente">';
    serie.forEach(function(x){
      estrelasHTML += ESTRELA.replace('<svg ', '<svg class="' + (x.acesa ? 'on' : '') + '" ');
    });
    estrelasHTML += '</span>';
    h += '<button class="comp ' + nivel(v) + (eFoco ? ' focoC' : '') + '" onclick="abrirFoco(\'' + c + '\')">'
      +   '<span class="l1"><span class="nm">' + c + ' · <em>' + NOME_COMP[c] + '</em></span>'
      +     (v >= 200 ? '<span class="capsula">' + feIcone('trofeu') + '200</span>' : '')
      +     (eFoco ? '<span class="selFoco">foco</span>' : '')
      +     estrelasHTML
      +   '</span>'
      +   '<span class="l2"><span class="pista"><i style="width:' + Math.min(100, v/200*100) + '%"></i></span>'
      +     '<span class="vl">' + v + '</span><span class="chev">›</span></span>'
      + '</button>';
  });
  h += '</div>'
    + '<p class="rodape">Cada estrela é uma redação, da mais antiga à esquerda para a mais recente à direita, e acende quando a competência tirou 200. '
    + '<a href="evolucao.html">Ver a minha evolução completa</a></p></div>';
  return h;
}

/* ══ render ══ */
function desenhar(){
  var ini = new Date(SEMANA_DE + 'T00:00:00');
  var fim = new Date(ini); fim.setDate(fim.getDate() + 6);
  var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('rotSemana').textContent =
    'Semana de ' + ini.getDate() + ' a ' + fim.getDate() + ' de ' + MES[fim.getMonth()];

  var fr = document.getElementById('fraseFoco');
  if (FOCO) {
    fr.innerHTML = 'Esta semana mira a <b>' + FOCO + ' · ' + NOME_COMP[FOCO] + '</b> — foi onde a sua última redação ficou mais fraca.';
  } else {
    fr.innerHTML = 'Sua primeira semana de ritmo. Depois da primeira redação corrigida, o plano passa a mirar a competência que mais precisa de você.';
  }

  document.getElementById('trilhoCards').innerHTML = cardSemana() + cardBoletim();
}

function marcarPonto(){
  var tr = document.getElementById('trilhoCards');
  var i = tr.scrollLeft > tr.clientWidth / 2 ? 1 : 0;
  var ps = document.getElementById('pontos').children;
  ps[0].className = i === 0 ? 'on' : '';
  ps[1].className = i === 1 ? 'on' : '';
}

/* ══ banco ══ */
async function carregarTema(){
  try{
    var url = SUPABASE_URL + '/rest/v1/temas?select=id,titulo,semana_de&ativo=eq.true&semana_de=not.is.null&order=semana_de.desc&limit=8';
    var res = await dbFetch(url, {});
    if (!res.ok) return null;
    var linhas = await res.json();
    var hoje = dataISO(new Date());
    for (var i=0; i<linhas.length; i++){
      if (linhas[i].semana_de && linhas[i].semana_de <= hoje) return linhas[i];
    }
    return linhas[0] || null;
  }catch(e){ console.warn('[meu plano] tema', e); return null; }
}
async function carregarConfig(){
  try{
    var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_config?aluno_id=eq.' + UID + '&select=descanso', {});
    if (!res.ok) return null;
    var r = await res.json();
    return r.length ? r[0].descanso : null;
  }catch(e){ return null; }
}
async function salvarConfig(valor){
  try{
    await dbFetch(SUPABASE_URL + '/rest/v1/plano_config?on_conflict=aluno_id', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ aluno_id: UID, descanso: valor })
    });
  }catch(e){ console.warn('[meu plano] descanso', e); }
}
async function carregarItens(){
  try{
    var url = SUPABASE_URL + '/rest/v1/plano_itens?aluno_id=eq.' + UID + '&semana_de=eq.' + SEMANA_DE
      + '&order=dia.asc&select=id,dia,tipo,rotulo,destino,competencia,feito_em';
    var res = await dbFetch(url, {});
    if (!res.ok) return [];
    return await res.json();
  }catch(e){ console.warn('[meu plano] itens', e); return []; }
}
async function criarSemana(){
  /* a semana nasce com uma linha por passo; rotulo e destino são escritos aqui só para
     manter o contrato da tabela — quem manda na tela é o código (v1-6/v1-7) */
  var corpo = passos().map(function(p, i){
    return { aluno_id: UID, semana_de: SEMANA_DE, dia: i+1, tipo: p.tipo,
             rotulo: p.nome, destino: p.dest, competencia: (p.tipo === 'exercicio' ? FOCO : null) };
  });
  try{
    var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Prefer':'return=representation' },
      body: JSON.stringify(corpo)
    });
    if (res.ok) return await res.json();
    /* o índice único por aluno/semana/dia recusa a segunda criação: releia o que já existe */
    return await carregarItens();
  }catch(e){ return await carregarItens(); }
}
async function carregarPreparacao(){
  if (!TEMA) return null;
  try{
    var url = SUPABASE_URL + '/rest/v1/preparacoes?select=entender_em,repertorio_em,estudio_em&aluno_id=eq.' + UID
      + '&tema_id=eq.' + TEMA.id + '&limit=1';
    var res = await dbFetch(url, {});
    if (!res.ok) return null;
    var r = await res.json();
    return r.length ? r[0] : null;
  }catch(e){ return null; }
}
async function escreveuNaSemana(){
  try{
    var url = SUPABASE_URL + '/rest/v1/redacoes?aluno_id=eq.' + UID
      + '&created_at=gte.' + SEMANA_DE + 'T00:00:00&select=id&limit=1';
    var res = await dbFetch(url, {});
    if (!res.ok) return false;
    var r = await res.json();
    return r.length > 0;
  }catch(e){ return false; }
}
async function temExercicio(comp){
  if (!comp) return false;
  try{
    var url = SUPABASE_URL + '/rest/v1/materiais?tipo=eq.exerc&publicado=eq.true&competencia=eq.' + comp + '&select=id&limit=1';
    var res = await dbFetch(url, {});
    if (!res.ok) return false;
    var r = await res.json();
    return r.length > 0;
  }catch(e){ return false; }
}
async function marcarFeito(tipo){
  var item = itemDoTipo(tipo);
  if (!item) return false;
  try{
    var res = await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens?id=eq.' + item.id, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ feito_em: new Date().toISOString() })
    });
    if (res.ok) { item.feito_em = new Date().toISOString(); return true; }
  }catch(e){ console.warn('[meu plano] marcar', e); }
  return false;
}
async function gravarFoco(comp){
  var item = itemDoTipo('exercicio');
  if (!item) return;
  try{
    await dbFetch(SUPABASE_URL + '/rest/v1/plano_itens?id=eq.' + item.id, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ competencia: comp, rotulo: 'Treinar ' + comp + ' · ' + NOME_COMP[comp] })
    });
    item.competencia = comp;
  }catch(e){ console.warn('[meu plano] foco', e); }
}

/* ── foco: menor nota da ÚLTIMA redação (regra da Profa. Blanche);
      empate resolve pela menor média das últimas 4 ── */
function focoDaUltima(){
  if (!HIST.length) return null;
  var u = HIST[0];
  var cs = ['c1','c2','c3','c4','c5'];
  var menor = Math.min.apply(null, cs.map(function(c){ return u[c] || 0; }));
  var empatados = cs.filter(function(c){ return (u[c] || 0) === menor; });
  if (empatados.length === 1) return empatados[0].toUpperCase();
  var melhor = empatados[0], val = 1e9;
  empatados.forEach(function(c){
    var m = mediaDe(c, 4);
    if (m < val) { val = m; melhor = c; }
  });
  return melhor.toUpperCase();
}

/* ══ interações ══ */
window.irPara = function(dest){ if (dest) window.location.href = dest; };

window.marcarRevisei = async function(bt){
  bt.disabled = true;
  var ok = await marcarFeito('revisao');
  if (ok) { desenhar(); if (typeof toast === 'function') toast('Revisão marcada. Bom trabalho.'); }
  else { bt.disabled = false; if (typeof toast === 'function') toast('Não consegui marcar agora. Tente de novo.'); }
};

window.abrirGaveta = function(id){
  if (id === 'gvDias') {
    document.querySelectorAll('#gvDias .opt').forEach(function(o){
      o.classList.toggle('sel', o.getAttribute('data-v') === DESCANSO);
    });
  }
  document.getElementById(id + 'Bg').classList.add('open');
  document.getElementById(id).classList.add('open');
};
window.fecharGaveta = function(id){
  document.getElementById(id + 'Bg').classList.remove('open');
  document.getElementById(id).classList.remove('open');
};
window.escolherDescanso = async function(el){
  DESCANSO = el.getAttribute('data-v');
  document.querySelectorAll('#gvDias .opt').forEach(function(o){ o.classList.remove('sel'); });
  el.classList.add('sel');
  salvarConfig(DESCANSO);
  desenhar();
  setTimeout(function(){ fecharGaveta('gvDias'); }, 180);
};

window.abrirFoco = async function(comp){
  var temEx = await temExercicio(comp);
  document.getElementById('gvFocoTit').textContent = comp + ' · ' + NOME_COMP[comp];
  document.getElementById('gvFocoSub').textContent = temEx
    ? 'Você pode treinar esta competência nesta semana. O passo do treino passa a ser dela.'
    : 'Os exercícios desta competência ainda estão em preparação. Assim que a Profa. Blanche liberar, o treino aparece aqui.';
  var opts = '';
  if (temEx) opts += '<button class="opt" onclick="trocarFoco(\'' + comp + '\')"><span>Treinar ' + comp + ' nesta semana</span><span class="ck">›</span></button>';
  opts += '<button class="opt" onclick="fecharGaveta(\'gvFoco\')"><span>Voltar</span><span class="ck">›</span></button>';
  document.getElementById('gvFocoOpts').innerHTML = opts;
  abrirGaveta('gvFoco');
};
window.trocarFoco = async function(comp){
  FOCO = comp;
  TEM_EXERC = await temExercicio(comp);
  await gravarFoco(comp);
  fecharGaveta('gvFoco');
  desenhar();
  if (typeof toast === 'function') toast('O treino da semana agora é ' + comp + '.');
};

function mostrar(id){
  ['estadoCarregando','estadoErro','tela'].forEach(function(k){
    var el = document.getElementById(k);
    if (el) el.classList.toggle('hidden', k !== id);
  });
}

/* ══ carga ══ */
(async function init(){
  try{
    UID = (typeof authGetUserId === 'function') ? authGetUserId() : null;
    if (!UID) { mostrar('estadoErro'); return; }
    SEMANA_DE = dataISO(segundaDaSemana());

    var cfg = await carregarConfig();
    if (cfg) DESCANSO = cfg;

    TEMA = await carregarTema();
    HIST = (typeof dbGetHistoricoRedacoes === 'function') ? (await dbGetHistoricoRedacoes(4)) : [];
    FOCO = focoDaUltima();
    TEM_EXERC = await temExercicio(FOCO);

    PREP = await carregarPreparacao();
    ESCREVEU = await escreveuNaSemana();

    ITENS = await carregarItens();
    if (!ITENS.length) ITENS = await criarSemana();

    /* a redação da semana se marca sozinha */
    if (ESCREVEU && !feitoNoBanco('redacao')) await marcarFeito('redacao');
    /* as etapas do Preparar também: a fatia 2 passa a gravá-las na própria ação do aluno */
    if (PREP && (PREP.entender_em || PREP.repertorio_em) && !feitoNoBanco('repertorio')) await marcarFeito('repertorio');
    if (PREP && PREP.estudio_em && !feitoNoBanco('flashcards')) await marcarFeito('flashcards');

    desenhar();
    mostrar('tela');
    document.getElementById('trilhoCards').addEventListener('scroll', marcarPonto);
  }catch(e){
    console.warn('[meu plano]', e);
    mostrar('estadoErro');
  }
})();
</script>
