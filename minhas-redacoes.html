<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RedaON | Minhas Redações</title>
<!-- RedaON · Portal do Aluno · Minhas Redações · v3-6 · sobre aluno-base-v6 -->
<script>
(function(){
  var pref='auto';
  try{ pref=localStorage.getItem('redaon-tema')||'auto'; }catch(e){}
  var ef=pref;
  if(pref==='auto'){ var c=false; try{ c=window.matchMedia('(prefers-color-scheme: light)').matches; }catch(e){} ef=c?'claro':'escuro'; }
  document.documentElement.setAttribute('data-tema',ef);
  document.documentElement.setAttribute('data-tema-pref',pref);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="aluno-base-v6.css" rel="stylesheet"/>
<style>
/* ===== Só o que é próprio de MINHAS REDAÇÕES ===== */
.abaBtn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem .5rem;border:none;border-radius:.65rem;background:transparent;color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.abaBtn .ic{font-size:.95rem;line-height:1;font-style:normal;}
.abaBtn.ativa{background:var(--cyan);color:var(--onCyan);}
.abaBtnM{flex:1 1 0;min-width:0;padding:.55rem .2rem;border:none;border-radius:.65rem;background:transparent;color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;text-align:center;}
.abaBtnM.ativa{background:var(--cyan);color:var(--onCyan);}
@media(max-width:359px){.abaBtnM{font-size:.66rem;padding:.5rem .1rem;}}

/* LISTA */
.gridLista{display:grid;grid-template-columns:1fr;gap:.7rem;}
@media(min-width:641px){.gridLista{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.gridLista{grid-template-columns:repeat(3,1fr);}}
.rCard{background:var(--surface);border:1px solid rgba(var(--borderRGB),.18);border-radius:14px;padding:.85rem .95rem;cursor:pointer;display:flex;flex-direction:column;transition:border-color .2s;}
.rCard:hover{border-color:rgba(var(--cyanRGB),.4);}
.rCard.destaque{border-color:rgba(var(--cyanRGB),.45);}
.rCard .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;margin-bottom:.5rem;}
.selo{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:.25rem .55rem;border-radius:99px;white-space:nowrap;}
.selo.validada{color:var(--green);background:rgba(var(--greenRGB),.12);border:1px solid rgba(var(--greenRGB),.3);}
.selo.corrigida{color:var(--gold);background:rgba(var(--goldRGB),.12);border:1px solid rgba(var(--goldRGB),.3);}
.selo.analise{color:var(--muted);background:rgba(var(--borderRGB),.12);border:1px solid rgba(var(--borderRGB),.25);}
.rNota{text-align:right;flex:0 0 auto;}
.rNota .v{font-size:1.35rem;font-weight:800;line-height:1;color:var(--cyan);}
.rNota .l{font-size:8.5px;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-top:1px;}
.rCard .tit{font-size:13.5px;font-weight:700;line-height:1.35;color:var(--text);flex:1;margin-bottom:.6rem;}
.rCard .pe{display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
.rCard .data{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.miniComp{display:flex;gap:3px;flex:0 0 auto;}
.miniComp span{width:14px;height:4px;border-radius:99px;background:var(--surface2);}
.vazio{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.85rem;padding:2.5rem 0;line-height:1.6;}
.spinner{width:38px;height:38px;border:3px solid var(--surface2);border-top-color:var(--cyan);border-radius:50%;animation:girar .8s linear infinite;margin:2rem auto;}
@keyframes girar{to{transform:rotate(360deg);}}

/* CORREÇÃO */
.fichaTopo{background:var(--surface);border:1px solid rgba(var(--borderRGB),.2);border-radius:1rem;padding:.9rem 1.1rem;margin-bottom:1rem;}
.fichaLinha{display:flex;align-items:center;gap:.75rem;}
.fichaLinha .rot{font-size:.64rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.fichaLinha .nota{font-size:1.9rem;font-weight:800;color:var(--cyan);line-height:1.05;}
.seloValid{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:.25rem;font-size:.68rem;font-weight:700;padding:.28rem .65rem;border-radius:99px;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis;}
.seloValid.sim{color:var(--green);background:rgba(var(--greenRGB),.14);}
.seloValid.nao{color:var(--gold);background:rgba(var(--goldRGB),.14);}
@media(max-width:359px){.seloValid{font-size:.62rem;padding:.25rem .5rem;}}
.chipsRow{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem;}
.chipComp{font-size:.72rem;font-weight:700;padding:.3rem .6rem;border-radius:.5rem;white-space:nowrap;cursor:pointer;border:none;font-family:inherit;}
@media(max-width:1023px){.chipsRow{gap:.3rem;flex-wrap:nowrap;}.chipComp{flex:1;text-align:center;font-size:.68rem;padding:.32rem .2rem;}}
.caGrid{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;align-items:start;}
.caGrid>*{min-width:0;}
.caBox{background:var(--surface);border:1px solid rgba(var(--borderRGB),.2);border-radius:1rem;padding:1.1rem 1.25rem;}
.caHeader{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;}
.caHeader .trilho{flex:1 1 auto;width:100%;}
.trilho{display:flex;gap:.3rem;background:var(--surface);border:1px solid rgba(var(--borderRGB),.2);border-radius:.8rem;padding:.25rem;overflow-x:auto;scrollbar-width:none;}
.trilho::-webkit-scrollbar{display:none;}
.folha{font-family:Georgia,serif;font-size:.92rem;line-height:1.9;color:var(--text2);text-align:justify;white-space:pre-wrap;}
.compItem{background:var(--sunken);border:1px solid rgba(var(--borderRGB),.18);border-radius:.8rem;padding:.7rem .85rem;margin-bottom:.6rem;}
.compItem .cab{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.35rem;}
.compItem .nm{font-size:.78rem;font-weight:700;color:var(--text);}
.compItem .vl{font-size:.8rem;font-weight:800;}
.compItem .tx{font-size:.78rem;color:var(--text2);line-height:1.5;}
.barraBg{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:.35rem 0 .5rem;}
.barraFill{height:100%;border-radius:99px;}
.profBox{border:1px solid rgba(var(--greenRGB),.35);background:rgba(var(--greenRGB),.06);border-radius:.8rem;padding:.85rem;margin-bottom:.7rem;}
.profBox .quem{display:flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:700;color:var(--green);margin-bottom:.4rem;}
.profBox .txt{font-size:.85rem;color:var(--text2);line-height:1.6;font-style:italic;white-space:pre-wrap;}
@media(min-width:1024px){
  .caGrid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);}
  .caBox.rolavel{max-height:calc(100vh - 20rem);min-height:20rem;overflow-y:auto;}
}
@media(max-width:1023px){.caColDireita{display:none;}}
@media(max-width:1023px) and (orientation:portrait){
  #caHeaderLeitura{display:none;}
  #filtrosTopoLista{display:none;}
}
@media(min-width:1024px), (max-width:1023px) and (orientation:landscape){
  #dockLista{display:none!important;}
  #dockCorrecao{display:none!important;}
}

/* COMPARAR */
.cmpBarra{display:flex;align-items:center;justify-content:center;gap:1.25rem;padding:1rem;margin-bottom:1.1rem;background:linear-gradient(135deg,rgba(var(--cyanRGB),.06),rgba(var(--greenRGB),.06));border:1px solid rgba(var(--greenRGB),.2);border-radius:.875rem;flex-wrap:wrap;}
.cmpCx{text-align:center;min-width:0;}
.cmpLbl{font-size:.65rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem;}
.cmpVal{font-size:1.75rem;font-weight:900;line-height:1;}
.cmpValTxt{font-size:.78rem;font-weight:700;color:var(--green);line-height:1.3;}
.cmpSeta{color:var(--muted);font-size:1.4rem;flex:0 0 auto;}
.cmpIntro{font-family:Georgia,serif;font-size:1rem;line-height:1.6;color:var(--text2);margin-bottom:1.2rem;text-align:center;font-style:italic;}
.cmpBloco{margin-bottom:1rem;padding:1rem 1.15rem;background:var(--bg);border-left:4px solid var(--cyan);border-radius:0 .75rem .75rem 0;}
.cmpCab{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem;}
.cmpTit{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.cmpPill{font-size:.68rem;font-weight:800;padding:.15rem .5rem;border-radius:.4rem;white-space:nowrap;}
.cmpTxt{font-family:Georgia,serif;font-size:1.02rem;line-height:1.75;color:var(--text);}
.cmpAviso{font-size:.72rem;color:var(--muted);text-align:center;margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(var(--borderRGB),.15);}

/* Geração sob demanda (Reescrita/Comparar) — v3-7 */
.spinnerRed{ width:34px; height:34px; border:3px solid rgba(var(--cyanRGB),.22); border-top-color:var(--cyan); border-radius:50%; animation:girarRed .9s linear infinite; }
@keyframes girarRed{ to{ transform:rotate(360deg); } }
.btnTentar{ min-height:44px; padding:.6rem 1.2rem; border-radius:.7rem; background:var(--surface2); color:var(--text); border:1px solid rgba(var(--borderRGB),.3); font-family:inherit; font-size:.82rem; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

<div id="main-content" style="display:flex;flex-direction:column;min-height:100vh;">
  <div id="conteudo">

    <!-- VISÃO 1: LISTA -->
    <div id="viewLista">
      <div id="filtrosTopoLista">
        <div class="trilho" style="overflow:visible;margin-bottom:.7rem;" id="trilhoFiltrosTopo"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;">
        <span style="font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);">Suas reda&ccedil;&otilde;es</span>
        <span id="contagem" style="font-size:.72rem;color:var(--muted);"></span>
      </div>
      <div class="gridLista" id="gridLista"><div class="spinner" style="grid-column:1/-1;"></div></div>
    </div>

    <!-- VISÃO 2: CORREÇÃO -->
    <div id="viewCorrecao" style="display:none;">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;">
        <button onclick="voltarLista()" style="width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--surface);border:1px solid rgba(var(--borderRGB),.25);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <div style="flex:1;min-width:0;">
          <h1 id="coTitulo" style="font-size:1.1rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></h1>
          <p id="coCtx" style="font-size:.74rem;color:var(--muted);"></p>
        </div>
      </div>

      <div class="fichaTopo">
        <div class="fichaLinha">
          <div style="flex:0 0 auto;">
            <p class="rot">Nota RedaON</p>
            <p class="nota" id="coNota">&mdash;</p>
          </div>
          <span class="seloValid nao" id="coSelo"></span>
        </div>
        <div class="chipsRow" id="coChips"></div>
      </div>

      <div class="caGrid">
        <div>
          <div class="caHeader" id="caHeaderLeitura">
            <div class="trilho" id="trilhoAbas" style="overflow:visible;">
              <button class="abaBtn ativa" data-aba="original" onclick="trocarAba('original')"><i class="ic">&#128196;</i>Original</button>
              <button class="abaBtn" data-aba="analise" onclick="trocarAba('analise')"><i class="ic">&#128202;</i>An&aacute;lise</button>
              <button class="abaBtn" data-aba="reescrita" onclick="trocarAba('reescrita')"><i class="ic">&#10024;</i>Reescrita</button>
              <button class="abaBtn" data-aba="comparar" onclick="trocarAba('comparar')"><i class="ic">&#8644;</i>Comparar</button>
            </div>
          </div>
          <div class="caBox rolavel" id="abaConteudo"></div>
        </div>
        <div class="caColDireita">
          <div class="caHeader">
            <p style="flex:1;font-size:.78rem;color:var(--text2);line-height:1.3;">Sua nota, crit&eacute;rio a crit&eacute;rio, com o que fazer para subir.</p>
          </div>
          <div class="caBox rolavel" id="painelDireita"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- DOCK LISTA -->
<div class="dockPolegar on" id="dockLista">
  <div class="trilho" id="trilhoFiltros" style="overflow:visible;"></div>
</div>

<!-- DOCK CORREÇÃO -->
<div class="dockPolegar" id="dockCorrecao">
  <div style="display:flex;gap:.5rem;">
    <button class="filtroBtn" id="btnRedacaoM" style="flex:1 1 0;" onclick="alternarGvExc('gvRedacao')">&#128196; Reda&ccedil;&atilde;o<span class="seta" style="font-size:.6rem;opacity:.7;">&#9662;</span></button>
    <button class="filtroBtn" id="btnNotaM" style="flex:1 1 0;" onclick="alternarGvExc('gvNota')">&#128202; Sua nota</button>
  </div>
</div>

<!-- GAVETA: REDAÇÃO (seletor de modo) -->
<div class="gvBg atras" id="gvRedacaoBg" onclick="fecharGaveta('gvRedacao');marcarBtnDock();"></div>
<div class="gv atras" id="gvRedacao">
  <div class="grip"></div>
  <p class="tit">Ver sua reda&ccedil;&atilde;o</p>
  <p class="sub">Escolha como quer visualizar. O conte&uacute;do aparece na tela.</p>
  <div id="listaModos"></div>
</div>

<!-- GAVETA: SUA NOTA -->
<div class="gvBg atras" id="gvNotaBg" onclick="fecharGaveta('gvNota');marcarBtnDock();"></div>
<div class="gv atras" id="gvNota">
  <div class="grip"></div>
  <p class="tit">Sua nota</p>
  <div id="gvNotaConteudo"></div>
</div>

<script src="supabase-auth.js"></script>
<script src="prompts-reescrita.js?v=1-0"></script>
<script src="aluno-base-v6.js"></script>
<script>
  if (typeof authGuard === 'function') { authGuard('aluno'); }

  montarEsqueleto({
    ativo:'redacoes', titulo:'Minhas Reda\u00e7\u00f5es', icone:'auto_stories',
    sino:false, versao:'aluno \u00b7 reda\u00e7\u00f5es \u00b7 v3-7'
  });

  var NOMES=['C1 \u00b7 Norma culta','C2 \u00b7 Repert\u00f3rio','C3 \u00b7 Argumenta\u00e7\u00e3o','C4 \u00b7 Coes\u00e3o','C5 \u00b7 Interven\u00e7\u00e3o'];
  var FILTROS=[{id:'todas',r:'Todas'},{id:'corrigidas',r:'Corrigidas'},{id:'validadas',r:'Validadas'}];
  var MODOS=[
   {id:'original', ico:'\u{1F4C4}', r:'Original',  d:'Seu texto, como voc\u00ea escreveu'},
   {id:'analise',  ico:'\u{1F4CA}', r:'An\u00e1lise',   d:'Pontos fortes e o que d\u00e1 pra subir'},
   {id:'reescrita',ico:'\u2728',    r:'Reescrita', d:'Sua reda\u00e7\u00e3o buscando a nota mil'},
   {id:'comparar', ico:'\u21c4',    r:'Comparar',  d:'O que mudaria, compet\u00eancia a compet\u00eancia'}
  ];
  var REDACOES=[], atual=null, correcaoAtual=null, filtroAtivo='todas', abaAtual='original';

  function corComp(v){ return v>=160?'var(--green)':(v>=120?'var(--gold)':'var(--red)'); }
  function alternarGvExc(id){
    var g=document.getElementById(id);
    if(g && g.classList.contains('open')){ fecharGaveta(id); marcarBtnDock(); return; }
    ['gvRedacao','gvNota'].forEach(function(o){ if(o!==id) fecharGaveta(o); });
    abrirGaveta(id); marcarBtnDock();
  }
  function marcarBtnDock(){
    var r=document.getElementById('gvRedacao'), n=document.getElementById('gvNota');
    var br=document.getElementById('btnRedacaoM'), bn=document.getElementById('btnNotaM');
    if(br) br.classList.toggle('ativo', !!(r && r.classList.contains('open')));
    if(bn) bn.classList.toggle('ativo', !!(n && n.classList.contains('open')));
  }

  // ─── Carga da lista (mesma consulta da produção) ───
  async function carregarRedacoes(){
    var grid=document.getElementById('gridLista');
    try{
      var userId=(typeof authGetUserId==='function')?authGetUserId():null;
      if(!userId){ grid.innerHTML='<p class="vazio">Sess\u00e3o inv\u00e1lida. Entre novamente.</p>'; return; }
      var url=SUPABASE_URL+'/rest/v1/redacoes?aluno_id=eq.'+userId+'&order=created_at.desc'
        +'&select=id,texto,tema_livre,status,nota_final,created_at,temas(titulo),'
        +'correcoes(c1,c2,c3,c4,c5,nota_total,feedback_geral,feedback_c1,feedback_c2,feedback_c3,feedback_c4,feedback_c5,pontos_fortes,pontos_melhorar,revisao_professor,correcao_json)';
      var res=await dbFetch(url,{});
      if(!res.ok) throw new Error('HTTP '+res.status);
      var rows=await res.json();
      REDACOES=rows.map(mapearRedacao);
      renderLista();
      abrirPorParametro();
    }catch(e){
      console.warn('Erro ao carregar reda\u00e7\u00f5es:',e);
      grid.innerHTML='<p class="vazio">N\u00e3o consegui carregar suas reda\u00e7\u00f5es agora.<br><button onclick="carregarRedacoes()" style="color:var(--cyan);background:none;border:none;cursor:pointer;text-decoration:underline;font-size:.8rem;margin-top:.4rem;">Tentar de novo</button></p>';
    }
  }

  function mapearRedacao(r){
    var c=(r.correcoes && r.correcoes.length)?r.correcoes[0]:(r.correcoes||{});
    var j=c.correcao_json||{};
    var primeira=r.texto?String(r.texto).trim().split('\n')[0]:'';
    var titulo=(r.tema_livre&&r.tema_livre.trim())?r.tema_livre
      :((r.temas&&r.temas.titulo)?r.temas.titulo
      :(primeira?primeira.substring(0,80)+(primeira.length>80?'\u2026':''):'Reda\u00e7\u00e3o sem t\u00edtulo'));
    var comp=null;
    if(typeof c.c1==='number'){ comp=[c.c1,c.c2,c.c3,c.c4,c.c5].map(function(x){ return typeof x==='number'?x:0; }); }
    var nota=r.nota_final||c.nota_total||null;
    var rev=c.revisao_professor||null;
    var validada=!!(rev && rev.visivel_aluno!==false);
    // Reescrita: 4 partes no correcao_json
    var partes=[j.redacao_nota_1000_intro,j.redacao_nota_1000_dev1,j.redacao_nota_1000_dev2,j.redacao_nota_1000_conclusao]
      .filter(function(p){ return p && String(p).trim().length>20; });
    // Comparar: melhoria_c1..c5
    var cmp={};
    ['c1','c2','c3','c4','c5'].forEach(function(k,i){
      var m=j['melhoria_'+k];
      if(m && String(m).trim().length>5) cmp[i]=String(m).trim();
    });
    return {
      id:r.id, titulo:titulo,
      correcaoId:c.id||null, json:j, chamadas:(j.chamadas||{}),
      data:new Date(r.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}),
      texto:r.texto||'', nota:nota, comp:comp,
      status:(nota&&comp)?(validada?'validada':'corrigida'):'corrigindo',
      feedbackGeral:c.feedback_geral||null,
      feedbackComp:[c.feedback_c1,c.feedback_c2,c.feedback_c3,c.feedback_c4,c.feedback_c5],
      pontosFortes:c.pontos_fortes||'', pontosMelhorar:c.pontos_melhorar||'',
      reescrita:partes.length?partes.join('\n\n'):null,
      comparar:cmp, rev:validada?rev:null
    };
  }

  // ─── Lista ───
  function renderFiltros(){
    var html=FILTROS.map(function(f){
      return '<button class="abaBtnM'+(f.id===filtroAtivo?' ativa':'')+'" onclick="setFiltro(\''+f.id+'\')">'+f.r+'</button>';
    }).join('');
    var a=document.getElementById('trilhoFiltros');     if(a) a.innerHTML=html;
    var b=document.getElementById('trilhoFiltrosTopo'); if(b) b.innerHTML=html;
  }
  function setFiltro(f){ filtroAtivo=f; renderFiltros(); renderLista(); acordarDock(); }
  function renderLista(){
    var lista=REDACOES.filter(function(r){
      if(filtroAtivo==='validadas') return r.status==='validada';
      if(filtroAtivo==='corrigidas') return r.status==='corrigida';
      return true;
    });
    document.getElementById('contagem').textContent=lista.length+(lista.length===1?' reda\u00e7\u00e3o':' reda\u00e7\u00f5es');
    var g=document.getElementById('gridLista');
    if(!lista.length){
      g.innerHTML='<p class="vazio">'+(REDACOES.length?'Nenhuma reda\u00e7\u00e3o nesse filtro.':'Voc\u00ea ainda n\u00e3o enviou nenhuma reda\u00e7\u00e3o.<br>Toque em \u270F\uFE0F Escrever para come\u00e7ar.')+'</p>';
      return;
    }
    g.innerHTML=lista.map(function(r,i){
      var selo=r.status==='validada'?'<span class="selo validada">\u2713 Validada</span>'
              :r.status==='corrigida'?'<span class="selo corrigida">\u23f3 Corrigida</span>'
              :'<span class="selo analise">\u2699 Corrigindo\u2026</span>';
      var nota=r.nota?'<div class="rNota"><span class="v">'+r.nota+'</span><span class="l">nota</span></div>':'';
      var mini=r.comp?'<div class="miniComp">'+r.comp.map(function(v){return '<span style="background:'+corComp(v)+';"></span>';}).join('')+'</div>'
                     :'<span style="font-size:10px;color:var(--muted);">a IA est\u00e1 corrigindo</span>';
      var clique=(r.nota&&r.comp)?' onclick="abrirCorrecao(\''+r.id+'\')"'
        :' onclick="toast(\'Sua corre\\u00e7\\u00e3o fica pronta em segundos \\u2014 j\\u00e1 volta\')" style="opacity:.65;"';
      return '<div class="rCard'+(i===0&&r.nota?' destaque':'')+'"'+clique+'>'
        +'<div class="topo">'+selo+nota+'</div>'
        +'<p class="tit">'+escapeHtmlSimples(r.titulo)+'</p>'
        +'<div class="pe"><span class="data">'+r.data+'</span>'+mini+'</div></div>';
    }).join('');
  }

  // ─── Correção ───
  function abrirCorrecao(id){
    atual=REDACOES.filter(function(r){return r.id===id;})[0];
    if(!atual) return;
    document.getElementById('viewLista').style.display='none';
    document.getElementById('viewCorrecao').style.display='block';
    document.getElementById('dockLista').classList.remove('on');
    document.getElementById('dockCorrecao').classList.add('on');
    document.getElementById('coTitulo').textContent=atual.titulo;
    document.getElementById('coCtx').textContent='Enviada em '+atual.data;
    document.getElementById('coNota').textContent=atual.nota||'\u2014';
    var s=document.getElementById('coSelo');
    if(atual.status==='validada'){ s.className='seloValid sim'; s.textContent='\u2713 Validada'; }
    else{ s.className='seloValid nao'; s.textContent='\u23f3 Corrigida'; }
    document.getElementById('coChips').innerHTML=(atual.comp||[]).map(function(v,i){
      return '<button class="chipComp" style="color:'+corComp(v)+';background:rgba(var(--borderRGB),.12);" onclick="toast(\''+NOMES[i].replace(/'/g,'')+': '+v+'/200\')">C'+(i+1)+' '+v+'</button>';
    }).join('');
    renderPainel(); renderModos(); trocarAba('original');
    window.scrollTo(0,0);
  }
  function voltarLista(){
    document.getElementById('viewCorrecao').style.display='none';
    document.getElementById('viewLista').style.display='block';
    document.getElementById('dockCorrecao').classList.remove('on');
    document.getElementById('dockLista').classList.add('on');
    ['gvRedacao','gvNota'].forEach(fecharGaveta); marcarBtnDock();
    window.scrollTo(0,0);
  }

  function linhas(txt){
    return String(txt||'').split(/\r?\n/)
      .map(function(l){ return l.replace(/^[\u2022\-\*]\s*/,'').trim(); })
      .filter(function(l){ return l.length>2; });
  }
  function htmlProfessor(){
    if(!atual.rev) return '<p style="font-size:.74rem;color:var(--muted);line-height:1.5;margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:1px solid rgba(var(--borderRGB),.15);">\u{1F4AC} Seu professor ainda n\u00e3o comentou esta reda\u00e7\u00e3o.</p>';
    var rev=atual.rev;
    var texto=rev.comentario_geral||'';
    if(!texto.trim()) return '<p style="font-size:.74rem;color:var(--green);line-height:1.5;margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:1px solid rgba(var(--greenRGB),.25);">\u2713 Seu professor revisou esta corre\u00e7\u00e3o.</p>';
    var quando='';
    if(rev.data||rev.revisado_em){
      try{ quando=new Date(rev.data||rev.revisado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }catch(e){}
    }
    var nome=rev.professor_nome||'Seu professor';
    return '<div class="profBox"><div class="quem"><span class="material-symbols-outlined" style="font-size:1.1rem;font-variation-settings:\'FILL\' 1;">verified</span>'+escapeHtmlSimples(nome)+'</div>'
      +'<p class="txt">\u201c'+escapeHtmlSimples(texto)+'\u201d</p>'
      +(quando?'<p style="font-size:.68rem;color:var(--muted);margin-top:.5rem;">Comentada em '+quando+'</p>':'')+'</div>';
  }
  function htmlCompetencias(){
    if(!atual.comp) return '';
    return atual.comp.map(function(v,i){
      var fb=atual.feedbackComp[i]||'';
      return '<div class="compItem"><div class="cab"><span class="nm">'+NOMES[i]+'</span><span class="vl" style="color:'+corComp(v)+'">'+v+'/200</span></div>'
        +'<div class="barraBg"><div class="barraFill" style="width:'+(v/200*100)+'%;background:'+corComp(v)+'"></div></div>'
        +(fb?'<p class="tx">'+escapeHtmlSimples(fb)+'</p>':'')+'</div>';
    }).join('');
  }
  function renderPainel(){
    var c=htmlProfessor()+htmlCompetencias();
    var a=document.getElementById('painelDireita');   if(a) a.innerHTML=c;
    var b=document.getElementById('gvNotaConteudo');  if(b) b.innerHTML=c;
  }
  function renderModos(){
    var lm=document.getElementById('listaModos');
    if(!lm) return;
    lm.innerHTML=MODOS.map(function(m){
      var sel=(m.id===abaAtual);
      return '<a class="pill'+(sel?' sel':'')+'" onclick="escolherModo(\''+m.id+'\')">'
        +'<span style="font-size:1.15rem;">'+m.ico+'</span>'
        +'<span style="min-width:0;"><span style="display:block;">'+m.r+'</span>'
        +'<span style="display:block;font-size:.68rem;font-weight:400;color:var(--muted);">'+m.d+'</span></span>'
        +'<i class="fim"'+(sel?'':' style="opacity:0;"')+'>\u2713</i></a>';
    }).join('');
  }
  function escolherModo(id){ trocarAba(id); fecharGaveta('gvRedacao'); marcarBtnDock(); }

  function rotulo(t){ return '<p style="font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;">'+t+'</p>'; }
  /* Convenção de nomenclatura: "Reescrita" é o nome do recurso (× Original).
     Corrige na leitura os textos antigos da IA que dizem "redação nota 1000". */
  function nomearReescrita(t){
    return String(t)
      .replace(/(reda\u00e7\u00e3o|vers\u00e3o)\s+(reescrita\s+)?nota\s+(1000|mil)/gi,'Reescrita')
      .replace(/nota\s+1000/gi,'nota m\u00e1xima');
  }
  function montarComparar(){
    var barra='<div class="cmpBarra">'
      +'<div class="cmpCx"><p class="cmpLbl">Vers\u00e3o Original</p><p class="cmpVal" style="color:'+corComp(atual.nota/5)+';">'+atual.nota+'</p></div>'
      +'<span class="cmpSeta">\u2192</span>'
      +'<div class="cmpCx"><p class="cmpLbl">Vers\u00e3o Reescrita</p><p class="cmpValTxt">crit\u00e9rios do INEP aplicados</p></div></div>';
    var temAlgum=Object.keys(atual.comparar||{}).length>0;
    if(!temAlgum) return barra+'<p style="font-size:.85rem;color:var(--muted);text-align:center;padding:1.5rem 0;">A compara\u00e7\u00e3o compet\u00eancia a compet\u00eancia ainda n\u00e3o est\u00e1 dispon\u00edvel para esta reda\u00e7\u00e3o.</p>';
    var intro='<p class="cmpIntro">Veja o que mudaria na sua reda\u00e7\u00e3o \u2014 compet\u00eancia por compet\u00eancia:</p>';
    var noTeto=[];
    var blocos=atual.comp.map(function(v,i){
      if(v>=200){ noTeto.push('C'+(i+1)); return ''; }
      var txt=atual.comparar[i];
      if(!txt) return '';
      var cor=corComp(v);
      return '<div class="cmpBloco" style="border-left-color:'+cor+';">'
        +'<div class="cmpCab"><span class="cmpTit" style="color:'+cor+';">'+NOMES[i]+'</span>'
        +'<span class="cmpPill" style="background:rgba(var(--borderRGB),.14);color:'+cor+';">'+v+' de 200</span></div>'
        +'<p class="cmpTxt">'+escapeHtmlSimples(nomearReescrita(txt))+'</p></div>';
    }).join('');
    if(!blocos) blocos='<p style="font-size:.85rem;color:var(--green);text-align:center;padding:1.5rem 0;">\u2713 Todas as compet\u00eancias j\u00e1 est\u00e3o no teto.</p>';
    else if(noTeto.length) blocos+='<p style="font-size:.76rem;color:var(--muted);text-align:center;margin-top:.4rem;">'+noTeto.join(' e ')+' j\u00e1 '+(noTeto.length>1?'est\u00e3o':'est\u00e1')+' no teto.</p>';
    return barra+intro+blocos+'<p class="cmpAviso">A reescrita aplica os crit\u00e9rios do INEP. A nota final depende da avalia\u00e7\u00e3o da banca.</p>';
  }


  /* ═══ GERAÇÃO SOB DEMANDA · Chamadas 3 e 4 ═══
     A correção grava chamadas.redacao_nota_1000 e .melhorias_por_competencia
     como 'pendente' (Cenário B: não gerar o que ninguém vai ler). Quem dispara
     a geração é ESTA tela, quando o aluno abre a aba. Ao terminar, grava no
     correcao_json e marca 'completa' — da próxima vez abre instantâneo. */
  var _gerando = {};

  async function geminiTexto(prompt){
    var res = await fetch('/api/gemini', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    var data = await res.json();
    if(!res.ok) throw new Error((data && data.error && data.error.message) || 'Erro Gemini');
    var txt = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts[0]
      && data.candidates[0].content.parts[0].text;
    if(!txt) throw new Error('Resposta vazia da IA');
    return txt;
  }
  function jsonDaIA(txt){
    var limpo = String(txt).replace(/```json|```/g,'').trim();
    var i = limpo.indexOf('{'), f = limpo.lastIndexOf('}');
    if(i > 0 || f < limpo.length-1) limpo = limpo.substring(i, f+1);
    return JSON.parse(limpo);
  }
  async function salvarNoCorrecaoJson(campos, chamada){
    if(!atual || !atual.correcaoId) return;
    var novo = Object.assign({}, atual.json || {}, campos);
    novo.chamadas = Object.assign({}, atual.chamadas || {});
    novo.chamadas[chamada] = 'completa';
    var res = await dbFetch(SUPABASE_URL+'/rest/v1/correcoes?id=eq.'+atual.correcaoId, {
      method:'PATCH',
      body: JSON.stringify({ correcao_json: novo })
    });
    if(!res.ok) throw new Error('Não consegui salvar o resultado');
    atual.json = novo; atual.chamadas = novo.chamadas;
  }
  function blocoGerando(titulo, sub){
    return '<div style="text-align:center;padding:2.2rem 1rem;">'
      +'<div class="spinnerRed" style="margin:0 auto .9rem;"></div>'
      +'<p style="font-size:.9rem;font-weight:700;color:var(--text);">'+titulo+'</p>'
      +'<p style="font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:.3rem;">'+sub+'</p></div>';
  }
  function blocoErro(msg, fn){
    return '<div style="text-align:center;padding:2rem 1rem;">'
      +'<p style="font-size:.85rem;color:var(--muted);line-height:1.55;margin-bottom:.9rem;">'+escapeHtmlSimples(msg)+'</p>'
      +'<button class="btnTentar" onclick="'+fn+'">Tentar de novo</button></div>';
  }

  async function gerarReescrita(){
    if(_gerando.reescrita) return;
    if(!atual || !atual.texto){ return; }
    _gerando.reescrita = true;
    var c = document.getElementById('abaConteudo');
    c.innerHTML = rotulo('Reescrita') + blocoGerando('Reescrevendo sua redação\u2026','A PROfa está aplicando os critérios do INEP nas cinco competências. Leva cerca de 30 segundos.');
    try{
      var prompt = REDAON_PROMPT_REESCRITA
        + '\n\nTEMA: ' + (atual.titulo || 'não informado')
        + '\n\nREDAÇÃO DO ALUNO:\n' + atual.texto;
      var j = jsonDaIA(await geminiTexto(prompt));
      var partes = [j.redacao_nota_1000_intro, j.redacao_nota_1000_dev1, j.redacao_nota_1000_dev2, j.redacao_nota_1000_conclusao]
        .filter(function(p){ return p && String(p).trim().length > 20; });
      if(!partes.length) throw new Error('A IA não devolveu a reescrita completa');
      await salvarNoCorrecaoJson({
        redacao_nota_1000_intro: j.redacao_nota_1000_intro,
        redacao_nota_1000_dev1: j.redacao_nota_1000_dev1,
        redacao_nota_1000_dev2: j.redacao_nota_1000_dev2,
        redacao_nota_1000_conclusao: j.redacao_nota_1000_conclusao
      }, 'redacao_nota_1000');
      atual.reescrita = partes.join('\n\n');
      if(abaAtual === 'reescrita') trocarAba('reescrita');
    }catch(err){
      console.error('[redacoes] reescrita:', err);
      if(abaAtual === 'reescrita'){
        c.innerHTML = rotulo('Reescrita') + blocoErro('Não consegui gerar a reescrita agora. Confira sua internet e tente de novo.', 'gerarReescrita()');
      }
    }
    _gerando.reescrita = false;
  }

  async function gerarComparacao(){
    if(_gerando.comparar) return;
    if(!atual) return;
    if(!atual.reescrita){ await gerarReescrita(); if(!atual.reescrita) return; }
    _gerando.comparar = true;
    var c = document.getElementById('abaConteudo');
    c.innerHTML = rotulo('Comparar') + blocoGerando('Comparando as duas versões\u2026','A PROfa está explicando o que mudou em cada competência. Leva cerca de 30 segundos.');
    try{
      var prompt = REDAON_PROMPT_COMPARACAO
        + '\n\nTEMA: ' + (atual.titulo || 'não informado')
        + '\n\nREDAÇÃO ORIGINAL DO ALUNO:\n' + atual.texto
        + '\n\nREDAÇÃO REESCRITA (nível nota 1000):\n' + atual.reescrita;
      var j = jsonDaIA(await geminiTexto(prompt));
      var campos = {}, achou = false, cmp = {};
      ['c1','c2','c3','c4','c5'].forEach(function(k,i){
        var m = j['melhoria_'+k];
        if(m && String(m).trim().length > 5){ campos['melhoria_'+k] = String(m).trim(); cmp[i] = String(m).trim(); achou = true; }
      });
      if(!achou) throw new Error('A IA não devolveu a comparação');
      await salvarNoCorrecaoJson(campos, 'melhorias_por_competencia');
      atual.comparar = cmp;
      if(abaAtual === 'comparar') trocarAba('comparar');
    }catch(err){
      console.error('[redacoes] comparação:', err);
      if(abaAtual === 'comparar'){
        c.innerHTML = rotulo('Comparar') + blocoErro('Não consegui gerar a comparação agora. Confira sua internet e tente de novo.', 'gerarComparacao()');
      }
    }
    _gerando.comparar = false;
  }

  function trocarAba(a){
    if(!atual) return;      // guarda: aba sem redação aberta
    abaAtual=a;
    document.querySelectorAll('#trilhoAbas .abaBtn').forEach(function(b){ b.classList.toggle('ativa',b.dataset.aba===a); });
    renderModos();
    var c=document.getElementById('abaConteudo');
    if(a==='original'){
      c.innerHTML=rotulo('Sua reda\u00e7\u00e3o')+'<p class="folha">'+escapeHtmlSimples(atual.texto||'Texto n\u00e3o dispon\u00edvel.')+'</p>';
    } else if(a==='analise'){
      var fortes=linhas(atual.pontosFortes), melhorar=linhas(atual.pontosMelhorar);
      var html=rotulo('Pontos fortes e a melhorar');
      if(atual.feedbackGeral) html+='<p style="font-size:.86rem;line-height:1.65;color:var(--text2);background:rgba(var(--cyanRGB),.07);border:1px solid rgba(var(--cyanRGB),.22);border-radius:.7rem;padding:.7rem .85rem;margin-bottom:.9rem;">'+escapeHtmlSimples(atual.feedbackGeral)+'</p>';
      if(!fortes.length&&!melhorar.length&&!atual.feedbackGeral){
        html+='<p style="font-size:.85rem;color:var(--muted);text-align:center;padding:1.5rem 0;">A an\u00e1lise detalhada ainda n\u00e3o est\u00e1 dispon\u00edvel para esta reda\u00e7\u00e3o.</p>';
      }
      html+=fortes.map(function(t){
        return '<div style="border-left:2px solid var(--green);padding-left:.7rem;margin-bottom:.7rem;">'
          +'<p style="font-size:.74rem;font-weight:700;color:var(--green);margin-bottom:.1rem;">\u2713 Ponto forte</p>'
          +'<p style="font-size:.85rem;color:var(--text2);line-height:1.55;">'+escapeHtmlSimples(t)+'</p></div>';
      }).join('');
      html+=melhorar.map(function(t){
        return '<div style="border-left:2px solid var(--gold);padding-left:.7rem;margin-bottom:.7rem;">'
          +'<p style="font-size:.74rem;font-weight:700;color:var(--gold);margin-bottom:.1rem;">\u2197 A melhorar</p>'
          +'<p style="font-size:.85rem;color:var(--text2);line-height:1.55;">'+escapeHtmlSimples(t)+'</p></div>';
      }).join('');
      c.innerHTML=html;
    } else if(a==='reescrita'){
      // Sob demanda: sem reescrita no banco, gera agora (só quando o aluno pede).
      if(!atual.reescrita && atual.texto && !_gerando.reescrita){ gerarReescrita(); return; }
      if(!atual.reescrita && _gerando.reescrita){ c.innerHTML=rotulo('Reescrita')+blocoGerando('Reescrevendo sua reda\u00e7\u00e3o\u2026','A PROfa est\u00e1 aplicando os crit\u00e9rios do INEP nas cinco compet\u00eancias.'); return; }
      c.innerHTML=rotulo('Reescrita')
        +(atual.reescrita
          ? '<p style="font-size:.78rem;color:var(--text2);background:rgba(var(--cyanRGB),.08);border:1px solid rgba(var(--cyanRGB),.25);border-radius:.7rem;padding:.6rem .8rem;margin-bottom:.9rem;">\u2728 Esta \u00e9 a sua reda\u00e7\u00e3o <b>reescrita buscando a nota mil</b> \u2014 mantendo as suas ideias, mas aplicando os crit\u00e9rios do INEP em cada uma das cinco compet\u00eancias.</p><p class="folha">'+escapeHtmlSimples(atual.reescrita)+'</p>'
          : '<p style="font-size:.85rem;color:var(--muted);text-align:center;padding:1.5rem 0;">A reescrita ainda n\u00e3o est\u00e1 dispon\u00edvel para esta reda\u00e7\u00e3o.</p>');
    } else {
      // Sob demanda: comparação depende da reescrita; gera as duas se preciso.
      var temCmp = Object.keys(atual.comparar||{}).length > 0;
      if(!temCmp && atual.texto && !_gerando.comparar){ gerarComparacao(); return; }
      c.innerHTML=montarComparar();
    }
  }

  // ─── ?abrir=<id> vindo da nova-redacao ───
  function abrirPorParametro(){
    try{
      var p=new URLSearchParams(window.location.search);
      var id=p.get('abrir');
      if(!id) return;
      var url=new URL(window.location.href);
      url.searchParams.delete('abrir');
      window.history.replaceState({},'',url.toString());
      var alvo=REDACOES.filter(function(r){return r.id===id;})[0];
      if(alvo && alvo.nota && alvo.comp) abrirCorrecao(id);
    }catch(e){}
  }

  function acordarDock(){ if(window.mostrarDock_dockLista) window.mostrarDock_dockLista(); }
  iniciarDock('dockLista',{ protegidaPor:['gvRedacao','gvNota'] });
  renderFiltros();
  carregarRedacoes();
</script>
