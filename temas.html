<script>
(function(){
  var pref = 'auto';
  try { pref = localStorage.getItem('redaon-tema') || 'auto'; } catch(e) {}
  var efetivo = pref;
  if (pref === 'auto') {
    var claroNoSistema = false;
    try { claroNoSistema = window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e) {}
    efetivo = claroNoSistema ? 'claro' : 'escuro';
  }
  document.documentElement.setAttribute('data-tema', efetivo);
  document.documentElement.setAttribute('data-tema-pref', pref);
})();
</script>

<style>
/* ═══ Temas v5-0 · fileiras estilo streaming (amostra aprovada por Alan em 25/09/2026) ═══ */
.cabTela h1{ font-size:1.25rem; font-weight:800; margin:.2rem 0 .7rem; }
@media(max-width:1023px){ html.temPgHead .cabTela{ display:none; } }
.chipsT{ display:flex; gap:.4rem; overflow-x:auto; scrollbar-width:none; margin:0 -1rem; padding:0 1rem .15rem; }
.chipsT::-webkit-scrollbar{ display:none; }
.chipT{ flex:0 0 auto; min-height:36px; padding:0 14px; border-radius:10px; background:var(--surface);

.chipT.on{ background:var(--cyan); color:var(--onCyan); border-color:var(--cyan); }
.subT{ display:flex; gap:.4rem; margin-top:.45rem; }
.subT .chipT{ min-height:32px; font-size:.72rem; }
.subT .chipT.on{ background:rgba(var(--cyanRGB),.14); color:var(--cyan); border-color:rgba(var(--cyanRGB),.5); }
.ferrTemas{ display:flex; gap:8px; margin:.7rem 0 0; }
.fbTema{ font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text2); min-height:42px;
  background:var(--surface); border:1px solid rgba(var(--borderRGB),.2); border-radius:12px;
  padding:0 12px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:.45rem; }
.fbTema.busca{ flex:1; color:var(--muted); font-weight:500; }
.fbTema.ativo{ background:rgba(var(--cyanRGB),.12); color:var(--cyan); border-color:transparent; }

.linhaBusca{ display:none; gap:8px; margin:.7rem 0 0; }
.linhaBusca.aberta{ display:flex; }

/* fileiras */
.fileira{ margin-top:1.1rem; }
.cabF{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:.5rem; }
.cabF h2{ font-size:.92rem; font-weight:800; margin:0; color:var(--text); }
.cabF button{ background:none; border:0; font:700 .74rem Inter,sans-serif; color:var(--cyan); cursor:pointer; padding:.2rem 0; }
.trilhoT{ display:flex; gap:.6rem; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 1rem;
  margin:0 -1rem; padding:0 1rem .2rem; scrollbar-width:none; }
.trilhoT::-webkit-scrollbar{ display:none; }
.cardT{ --larg:clamp(112px, 34vw, 150px); flex:0 0 var(--larg); scroll-snap-align:start; cursor:pointer; min-width:0; }
.capaT{ position:relative; aspect-ratio:3/4; border-radius:.8rem; overflow:hidden; background:var(--surface2);

.capaT img{ width:100%; height:100%; object-fit:cover; display:block; }
.capaT .grad, .capaMini .grad{ position:absolute; inset:0; }
.capaT img, .capaMini img{ position:relative; }
.pilulaSem{ position:absolute; top:.4rem; left:.4rem; font-size:.58rem; font-weight:800; text-transform:uppercase;
  letter-spacing:.05em; background:var(--cyan); color:var(--onCyan); border-radius:99px; padding:3px 8px; }
.ttT{ font-size:.76rem; font-weight:700; line-height:1.28; margin:.4rem 0 0; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.metaT{ font-size:.66rem; color:var(--muted); margin:.15rem 0 0; }
/* convite da fileira de salvos vazia */
.conviteT{ flex:0 0 min(78%, 300px); border:1px dashed rgba(var(--borderRGB),.35); border-radius:.8rem;

.conviteT .fe{ width:30px; height:30px; flex:none; }

/* ver todos: grade */
.cabGrade{ display:flex; align-items:center; gap:.5rem; margin:.9rem 0 .8rem; }
.cabGrade button{ width:34px; height:34px; flex:none; border:1px solid rgba(var(--borderRGB),.18); background:var(--surface);
  color:var(--text); border-radius:50%; font-size:20px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0 2px 2px 0; font-family:inherit; }
.cabGrade h2{ font-size:1rem; font-weight:800; margin:0; }
.gradeT{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.9rem .6rem; }
@media(min-width:641px){ .gradeT{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
@media(min-width:1024px){ .gradeT{ grid-template-columns:repeat(6, minmax(0,1fr)); } }
.gradeT .cardT{ --larg:auto; }

/* lista (busca e campo) */
.rotLista{ font-size:.75rem; color:var(--muted); margin:1rem 0 .5rem; }
.rotLista b{ color:var(--text2); }
.listaT{ display:flex; flex-direction:column; gap:.6rem; }
.linhaTema{ display:flex; align-items:center; gap:.75rem; background:var(--surface); border-radius:16px;
  border:1px solid rgba(var(--borderRGB),.12); padding:9px 12px; cursor:pointer; }
.capaMini{ width:46px; height:62px; border-radius:10px; overflow:hidden; flex:0 0 auto; position:relative; background:var(--surface2); }
.capaMini img{ width:100%; height:100%; object-fit:cover; display:block; }
.linhaTema .lTxt{ flex:1; min-width:0; }
.linhaTema .lTxt p{ margin:0 0 4px; font-size:13.5px; font-weight:600; line-height:1.3; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.linhaTema .lPe{ font-size:11.5px; color:var(--muted); display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; }
.linhaTema .lPe .jaFiz{ font-size:10.5px; font-weight:600; color:var(--green); background:rgba(var(--greenRGB),.12); padding:1px 8px; border-radius:99px; }
.linhaTema .lPe .semT{ font-size:10.5px; font-weight:800; color:var(--cyan); }
.tPin{ flex:0 0 auto; width:34px; height:34px; border:0; border-radius:50%; background:transparent; cursor:pointer;
  display:grid; place-items:center; opacity:.45; }
.tPin .fe{ width:20px; height:20px; vertical-align:0; }
.tPin.on{ opacity:1; background:rgba(var(--cyanRGB),.12); }

.vazio{ text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 0; line-height:1.6; }
.spinner{ width:38px; height:38px; border:3px solid var(--surface2); border-top-color:var(--cyan); border-radius:50%; animation:girar .8s linear infinite; margin:2rem auto; }
@keyframes girar{ to{ transform:rotate(360deg); } }
.pillSugerir{ display:flex; align-items:center; gap:.7rem; min-height:52px; padding:0 .875rem; border-radius:13px; background:var(--surface);
  border:1px dashed rgba(var(--borderRGB),.35); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; margin:1.6rem 0 .5rem; }
.pillSugerir .fe{ width:22px; height:22px; }
.pillSugerir .fim{ margin-left:auto; color:var(--muted); }
.areaSugestao textarea{ width:100%; min-height:5rem; padding:.75rem .875rem; background:var(--surface2); border:1px solid rgba(var(--borderRGB),.3);
  border-radius:.7rem; color:var(--text); font-size:.9rem; font-family:inherit; resize:vertical; }
.areaSugestao textarea:focus{ outline:none; border-color:rgba(var(--cyanRGB),.6); }
html, body{ overflow-x:clip; }
</style>

<script>
  if (typeof authGuard === 'function') { authGuard('aluno'); }
  console.info('RedaON · temas v5-0');
  document.documentElement.setAttribute('data-tela', 'temas v5-0');

  // Professor que abrir esta página vai para o portal dele (decisão 6A)
  (function(){
    try {
      var perfil = (typeof authGetTipo === 'function') ? authGetTipo() : null;
      if (perfil === 'professor') { window.location.href = 'professor-temas.html'; }
    } catch(e) {}
  })();

  montarEsqueleto({ ativo:'temas', titulo:'Temas', icone:'library_books', sino:false });
  (function(){ var s = document.getElementById('icoSugerir'); if (s) s.innerHTML = feIcone('lampada'); })();

  // ─── Estado ───
  var TEMAS = [];
  var SEMANA_ID = null;          /* tema do ciclo do aluno (o "da semana"), com a pílula */
  var MEUS_TEMAS_IDS = [];
  var MEUS_FEITOS = {};
  var EST = { chip:'todos', sub:'principal', ver:null, campo:'todos', busca:'' };

  /* Meus Temas mora no banco (temas_salvos); o navegador guarda uma cópia para responder na hora */
  try { MEUS_TEMAS_IDS = JSON.parse(localStorage.getItem('redaon_temas_salvos') || '[]'); } catch(e) {}
  (function(){
    var vistos = {}, limpa = [];
    (MEUS_TEMAS_IDS || []).forEach(function(id){ if (id && !vistos[id]) { vistos[id] = true; limpa.push(id); } });
    MEUS_TEMAS_IDS = limpa;
  })();
  function guardarLocal(){ try { localStorage.setItem('redaon_temas_salvos', JSON.stringify(MEUS_TEMAS_IDS)); } catch(e) {} }
  function alunoId(){ try { return (typeof authGetUserId === 'function') ? authGetUserId() : null; } catch(e) { return null; } }
  var CHAVE_MIGRADO = 'redaon_salvos_migrados';
  async function carregarMeusTemas(){
    var uid = alunoId(); if (!uid) return;
    try {
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos?aluno_id=eq.' + uid + '&select=tema_id,origem&order=criado_em.desc', {});
      if (!res.ok) return;
      var doBanco = (await res.json()).map(function(r){ return r.tema_id; });
      var migrado = false;
      try { migrado = localStorage.getItem(CHAVE_MIGRADO) === '1'; } catch(e) {}
      if (!migrado) {
        var soLocal = MEUS_TEMAS_IDS.filter(function(id){ return doBanco.indexOf(id) < 0; });
        if (soLocal.length) {
          try {
            await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos', {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify(soLocal.map(function(id){ return { aluno_id:uid, tema_id:id, origem:'aluno' }; }))
            });
            doBanco = doBanco.concat(soLocal);
          } catch(e) { console.warn('[temas] subir salvos', e); }
        }
        try { localStorage.setItem(CHAVE_MIGRADO, '1'); } catch(e) {}
      }
      var vistos = {}, lista = [];
      doBanco.forEach(function(id){ if (id && !vistos[id]) { vistos[id] = true; lista.push(id); } });
      MEUS_TEMAS_IDS = lista;
      guardarLocal();
    } catch(e) { console.warn('[temas] meus temas', e); }
  }
  async function gravarSalvo(id, salvou){
    var uid = alunoId(); if (!uid) return;
    try {
      if (salvou) {
        await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ aluno_id:uid, tema_id:id, origem:'aluno' })
        });
      } else {
        await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos?aluno_id=eq.' + uid + '&tema_id=eq.' + id + '&origem=eq.aluno', { method:'DELETE' });
      }
    } catch(e) { console.warn('[temas] gravar salvo', e); }
  }

  /* campos: id do banco, nome de tela e as duas cores do degradê de quem ainda não tem capa */
  var CAMPOS = [
    { id:'trabalho',       nome:'Trabalho',       c:['#b07d10','#8a5a00'] },
    { id:'educacao',       nome:'Educa\u00e7\u00e3o',     c:['#1f6fb2','#0a8c8d'] },
    { id:'saude',          nome:'Sa\u00fade',             c:['#0f8a4d','#0a8c8d'] },
    { id:'cidadania',      nome:'Cidadania',      c:['#5a4fc4','#1f6fb2'] },
    { id:'cultura',        nome:'Cultura',        c:['#8a5cc4','#c4488f'] },
    { id:'tecnologia',     nome:'Tecnologia',     c:['#0a8c8d','#5a4fc4'] },
    { id:'meio_ambiente',  nome:'Meio ambiente',  c:['#0f8a4d','#5a8c10'] },
    { id:'alimentacao',    nome:'Alimenta\u00e7\u00e3o',  c:['#c47a10','#8a9c10'] },
    { id:'infancia',       nome:'Inf\u00e2ncia',          c:['#c4488f','#c47a10'] },
    { id:'mulher',         nome:'Mulher',         c:['#c4488f','#8a5cc4'] },
    { id:'violencia',      nome:'Viol\u00eancia',         c:['#b2452f','#8a2f4a'] },
    { id:'envelhecimento', nome:'Envelhecimento', c:['#b07d10','#0f8a4d'] },
    { id:'saneamento',     nome:'Saneamento',     c:['#1f6fb2','#0f8a4d'] }
  ];
  function campoDe(id){ for (var i=0;i<CAMPOS.length;i++){ if (CAMPOS[i].id===id) return CAMPOS[i]; } return null; }
  function nomeCampo(id){ var c=campoDe(id); return c ? c.nome : 'Sem campo'; }
  function coresCampo(id){ var c=campoDe(id); return c ? c.c : ['#8a8576','#6f6c63']; }
  function ehRedaON(t){ return !t.ano_enem; }
  function ehPrincipal(t){ return !!t.ano_enem && (t.aplicacao||'').toLowerCase()==='regular'; }
  function aplicacaoRotulo(t){
    var a=(t.aplicacao||'').toLowerCase();
    if (!t.ano_enem) return 'RedaON';
    if (a==='regular') return 'ENEM ' + t.ano_enem;
    var nomes={ ppl:'PPL', segunda_aplicacao:'reaplica\u00e7\u00e3o', digital:'digital', especial:'especial', cancelada:'cancelada' };
    return 'ENEM ' + t.ano_enem + ' \u00b7 ' + (nomes[a] || a);
  }
  function capaHtml(t, classe, comPilula){
    var c = coresCampo(t.campo);
    var grad = '<span class="grad" style="background:linear-gradient(140deg,'+c[0]+','+c[1]+')"></span>';
    var img = t.capa_url ? '<img src="'+escapeHtmlSimples(t.capa_url)+'" alt="" loading="lazy" onerror="this.remove()">' : '';
    var pil = (comPilula && t.id === SEMANA_ID) ? '<span class="pilulaSem">da semana</span>' : '';
    return '<div class="'+classe+'">' + grad + img + pil + '</div>';
  }

  // ─── Carga ───
  async function carregarTemas(){
    try {
      var url = SUPABASE_URL + '/rest/v1/temas?select=id,titulo,campo,capa_url,ano_enem,aplicacao,semana_de,created_at&ativo=eq.true&order=ano_enem.desc.nullsfirst&order=aplicacao.asc';
      var res = await dbFetch(url, {});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      TEMAS = await res.json();
      try { var c = await cicloDoAluno(); SEMANA_ID = (c && c.tema) ? c.tema.id : null; } catch(e) {}
      await Promise.all([carregarFeitos(), carregarMeusTemas()]);
      renderGvCampo();
      desenhar();
    } catch(e) {
      console.warn('[temas] carregar', e);
      document.getElementById('areaT').innerHTML = '<p class="vazio">N\u00e3o consegui carregar os temas agora.<br>Verifique sua conex\u00e3o e recarregue.</p>';
    }
  }
  async function carregarFeitos(){
    MEUS_FEITOS = {};
    try {
      var uid = alunoId(); if (!uid) return;
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/redacoes?aluno_id=eq.' + uid + '&tema_id=not.is.null&select=tema_id,nota_final,created_at&order=created_at.desc', {});
      if (!res.ok) return;
      (await res.json()).forEach(function(r){ if (!MEUS_FEITOS[r.tema_id]) MEUS_FEITOS[r.tema_id] = { nota: r.nota_final || null }; });
    } catch(e) { console.warn('[temas] feitos', e); }
  }

  // ─── Fileiras ───
  /* RedaON: o da semana primeiro, depois os programados (mais recente antes), depois o resto */
  function listaRedaON(){
    return TEMAS.filter(ehRedaON).sort(function(a,b){
      if (a.id === SEMANA_ID) return -1; if (b.id === SEMANA_ID) return 1;
      var sa = a.semana_de || '', sb = b.semana_de || '';
      if (sa !== sb) return sa < sb ? 1 : -1;
      return (b.created_at||'') < (a.created_at||'') ? -1 : 1;
    });
  }
  function porAno(a,b){ return (b.ano_enem||0) - (a.ano_enem||0); }
  var FILEIRAS = {
    redaon:    { tit:'Da RedaON',              lista:function(){ return listaRedaON(); } },
    meus:      { tit:'Seus temas salvos',      lista:function(){ return MEUS_TEMAS_IDS.map(temaPorId).filter(Boolean); } },
    principal: { tit:'ENEM \u00b7 Prova principal', lista:function(){ return TEMAS.filter(ehPrincipal).sort(porAno); } },
    especiais: { tit:'ENEM \u00b7 Especiais',       lista:function(){ return TEMAS.filter(function(t){ return t.ano_enem && !ehPrincipal(t); }).sort(porAno); } }
  };
  function fileirasDoChip(){
    if (EST.chip === 'redaon') return ['redaon'];
    if (EST.chip === 'meus')   return ['meus'];
    if (EST.chip === 'enem')   return [EST.sub];
    return ['redaon','meus','principal','especiais'];
  }
  function temaPorId(id){ for (var i=0;i<TEMAS.length;i++){ if (TEMAS[i].id===id) return TEMAS[i]; } return null; }

  function cardT(t){
    return '<div class="cardT" onclick="abrirTema(\'' + t.id + '\')">'
      + capaHtml(t, 'capaT', true)
      + '<p class="ttT">' + escapeHtmlSimples(t.titulo) + '</p>'
      + '<p class="metaT">' + aplicacaoRotulo(t) + '</p></div>';
  }
  function fileiraHtml(id){
    var f = FILEIRAS[id], lista = f.lista();
    if (!lista.length && id !== 'meus') return '';
    var corpo = lista.length ? lista.map(cardT).join('')
      : '<div class="conviteT">' + feIcone('disquete') + '<span>Salve temas pelo disquete na tela do tema. Eles aparecem aqui.</span></div>';
    var ver = lista.length > 3 ? '<button onclick="verTodos(\'' + id + '\')">ver todos &#8250;</button>' : '';
    return '<section class="fileira"><div class="cabF"><h2>' + f.tit + '</h2>' + ver + '</div><div class="trilhoT">' + corpo + '</div></section>';
  }

  // ─── Lista (busca e campo) ───
  function filtrarLista(){
    var base = [];
    fileirasDoChip().forEach(function(id){ FILEIRAS[id].lista().forEach(function(t){ if (base.indexOf(t) < 0) base.push(t); }); });
    if (EST.campo !== 'todos') base = base.filter(function(t){ return EST.campo === 'sem' ? !t.campo : t.campo === EST.campo; });
    if (EST.busca) {
      var q = EST.busca;
      base = base.filter(function(t){
        return (t.titulo || '').toLowerCase().indexOf(q) >= 0
            || nomeCampo(t.campo).toLowerCase().indexOf(q) >= 0
            || String(t.ano_enem || '').indexOf(q) >= 0;
      });
    }
    return base;
  }
  function linhaHtml(t){
    var fav = MEUS_TEMAS_IDS.indexOf(t.id) >= 0, feito = MEUS_FEITOS[t.id];
    return '<div class="linhaTema" onclick="abrirTema(\'' + t.id + '\')">'
      + capaHtml(t, 'capaMini', false)
      + '<div class="lTxt"><p>' + escapeHtmlSimples(t.titulo) + '</p>'
      + '<span class="lPe">' + aplicacaoRotulo(t) + ' \u00b7 ' + escapeHtmlSimples(nomeCampo(t.campo))
        + (t.id === SEMANA_ID ? ' <b class="semT">da semana</b>' : '')
        + (feito ? ' <b class="jaFiz">j\u00e1 escrevi' + (feito.nota ? ' \u00b7 ' + feito.nota : '') + '</b>' : '')
      + '</span></div>'
      + '<button class="tPin' + (fav ? ' on' : '') + '" onclick="event.stopPropagation();alternarFavorito(\'' + t.id + '\', this)" aria-label="Salvar em Meus Temas">' + feIcone('disquete') + '</button>'
      + '</div>';
  }

  // ─── Desenho ───
  function desenharChips(){
    var CH = [['todos','Todos'],['redaon','RedaON'],['meus','Meus'],['enem','ENEM']];
    document.getElementById('chipsT').innerHTML = CH.map(function(c){
      return '<button class="chipT' + (EST.chip===c[0]?' on':'') + '" onclick="irChip(\'' + c[0] + '\')">' + c[1] + '</button>'; }).join('');
    document.getElementById('subT').innerHTML = EST.chip !== 'enem' ? '' : [['principal','Prova principal'],['especiais','Especiais']].map(function(c){
      return '<button class="chipT' + (EST.sub===c[0]?' on':'') + '" onclick="irSub(\'' + c[0] + '\')">' + c[1] + '</button>'; }).join('');
  }
  function desenhar(){
    var area = document.getElementById('areaT');
    document.getElementById('topoT').style.display = EST.ver ? 'none' : '';
    if (EST.ver) {
      var f = FILEIRAS[EST.ver];
      area.innerHTML = '<div class="cabGrade"><button onclick="voltarFileiras()" aria-label="Voltar">\u2039</button><h2>' + f.tit + '</h2></div>'
        + '<div class="gradeT">' + f.lista().map(cardT).join('') + '</div>';
      return;
    }
    desenharChips();
    if (EST.busca || EST.campo !== 'todos') {
      var lista = filtrarLista();
      var rot = EST.busca ? ('Resultados para <b>\u201c' + escapeHtmlSimples(EST.busca) + '\u201d</b>') : ('Campo <b>' + escapeHtmlSimples(EST.campo==='sem' ? 'Sem campo' : nomeCampo(EST.campo)) + '</b>');
      area.innerHTML = '<p class="rotLista">' + rot + ' \u00b7 ' + lista.length + (lista.length === 1 ? ' tema' : ' temas') + '</p>'
        + (lista.length ? '<div class="listaT">' + lista.map(linhaHtml).join('') + '</div>'
                        : '<p class="vazio">Nenhum tema encontrado.<br>Tente outra palavra ou outro campo.</p>');
      return;
    }
    area.innerHTML = fileirasDoChip().map(fileiraHtml).join('') || '<p class="vazio">Nenhum tema aqui ainda.</p>';
  }
  window.irChip = function(c){ EST.chip = c; renderGvCampo(); desenhar(); };
  window.irSub  = function(s){ EST.sub = s; renderGvCampo(); desenhar(); };
  window.verTodos = function(id){
    EST.ver = id;
    try { history.pushState({ ver:id }, ''); } catch(e) {}
    desenhar(); window.scrollTo(0, 0);
  };
  window.voltarFileiras = function(){ if (history.state && history.state.ver) history.back(); else { EST.ver = null; desenhar(); } };
  window.addEventListener('popstate', function(){ if (EST.ver) { EST.ver = null; desenhar(); } });

  // ─── Campo (gaveta) ───
  function renderGvCampo(){
    var salvaCampo = EST.campo, salvaBusca = EST.busca;
    EST.campo = 'todos'; EST.busca = '';
    var base = filtrarLista();
    EST.campo = salvaCampo; EST.busca = salvaBusca;
    var cont = { todos: base.length };
    base.forEach(function(t){ var k = t.campo || 'sem'; cont[k] = (cont[k] || 0) + 1; });
    var itens = [{ id:'todos', nome:'Todos os campos' }].concat(CAMPOS.map(function(c){ return { id:c.id, nome:c.nome }; })).concat([{ id:'sem', nome:'Sem campo' }]);
    var alvo = document.getElementById('gvCampoLista'); if (!alvo) return;
    alvo.innerHTML = itens.map(function(i){
      var sel = (i.id === EST.campo), n = cont[i.id] || 0, vazio = (n === 0 && !sel);
      return '<a class="pill' + (sel ? ' sel' : '') + '"' + (vazio ? ' style="opacity:.45;"' : '')
        + ' onclick="escolherCampo(\'' + i.id + '\')">' + escapeHtmlSimples(i.nome)
        + '<span style="font-size:.72rem;font-weight:600;color:' + (sel ? 'var(--cyan)' : 'var(--muted)') + ';margin-left:.35rem;">(' + n + ')</span>'
        + '<i class="fim"' + (sel ? '' : ' style="opacity:0;"') + '>&#10003;</i></a>';
    }).join('');
  }
  window.escolherCampo = function(id){
    EST.campo = id;
    document.getElementById('lblCampo').textContent = id === 'todos' ? 'Campo' : (id === 'sem' ? 'Sem campo' : nomeCampo(id));
    document.getElementById('btCampo').classList.toggle('ativo', id !== 'todos');
    renderGvCampo(); fecharGaveta('gvCampo'); desenhar();
  };

  // ─── Busca ───
  window.abrirBusca = function(){
    document.getElementById('ferrTemas').classList.add('escondida');
    document.getElementById('linhaBusca').classList.add('aberta');
    var i = document.getElementById('buscaTopo'); if (i) i.focus();
  };
  window.limparBusca = function(){
    document.getElementById('linhaBusca').classList.remove('aberta');
    document.getElementById('ferrTemas').classList.remove('escondida');
    var i = document.getElementById('buscaTopo'); if (i) i.value = '';
    EST.busca = ''; desenhar();
  };
  window.sincronizarBusca = function(v){ EST.busca = (v || '').toLowerCase().trim(); desenhar(); };

  // ─── Ações ───
  window.abrirTema = function(id){
    var t = temaPorId(id); if (!t) return;
    try { definirTemaSelecionado(t); } catch(e) {}
    window.location.href = 'hub-preparacao.html?tema=' + encodeURIComponent(id);
  };
  window.alternarFavorito = function(id, el){
    var tinha = MEUS_TEMAS_IDS.indexOf(id) >= 0;
    MEUS_TEMAS_IDS = MEUS_TEMAS_IDS.filter(function(x){ return x !== id; });
    var salvou = !tinha;
    if (salvou) MEUS_TEMAS_IDS.unshift(id);
    if (el) el.classList.toggle('on', salvou);
    toast(salvou ? 'Tema salvo em Meus Temas' : 'Tema retirado de Meus Temas');
    guardarLocal();
    gravarSalvo(id, salvou);
  };
  window.enviarSugestao = async function(){
    var txt = (document.getElementById('txtSugestao').value || '').trim();
    if (txt.length < 10) { toast('Escreva a sugest\u00e3o com um pouco mais de detalhe.', 2400); return; }
    try {
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/sugestoes_temas', {
        method:'POST', headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
        body: JSON.stringify({ texto: txt })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      document.getElementById('txtSugestao').value = '';
      fecharGaveta('gvSugestao');
      toast('Sugest\u00e3o enviada para a PROfa!');
    } catch(e) {
      console.warn('[temas] sugestão', e);
      toast('N\u00e3o consegui enviar agora. Tente de novo.', 2600);
    }
  };

  desenharChips();
  carregarTemas();
</script>
</body>
</html>
