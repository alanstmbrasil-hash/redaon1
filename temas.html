<!-- v4-14 (24/09/2026): opção B — com capa, o cartão do tema da semana e a tela do tema mostram a cena limpa, sem camada escura, e selos + título ficam logo abaixo, na parte clara. -->
<!-- v4-13 (20/09/2026): o ícone deixa de se separar do nome quando o texto quebra de linha. -->
<!-- v4-12 (20/09/2026): ajuste do texto da chamada: "se Preparar ajuda a Entender o tema…". -->
<!-- v4-11 (20/09/2026): a busca deixa de esconder o tema procurado. O cartão herói sai de cena quando
     há busca ou filtro de campo, e nessas horas a lista mostra todos os temas, inclusive o que era o herói.
     O Enter do teclado fecha o teclado sem recarregar. -->
<!-- v4-10 (18/09/2026): a versão sai do título da aba (o aluno não vê versão); fica só no console e no
     atributo data-tela. -->
<!-- v4-9 (18/09/2026): corrigido o desmarcar que voltava do outro aparelho — o banco passa a ser a
     verdade e a lista do navegador não é mais somada a ele (a subida do que existia só no aparelho
     acontece uma vez, na migração). Versão no título da aba, temporária, para conferir o deploy. -->
<!-- v4-8 (18/09/2026): marca de versão no console e no atributo data-tela do <html>, para conferir em
     segundos se o arquivo publicado é o novo. -->
<!-- v4-7 (18/09/2026): Meus Temas passa a morar no banco (tabela temas_salvos), então abre em qualquer
     aparelho; o que estava só no navegador sobe na primeira abertura e a cópia local segue como resposta
     imediata e apoio sem rede. Abas na ordem Todos, RedaON, Meus Temas, ENEM Principal, ENEM Especiais,
     abrindo em Todos. -->
<!-- v4-6 (18/09/2026): no computador os três cartões ficam lado a lado, sem rolagem lateral; a capa cheia
     deixa o menu lateral e a barra de baixo à vista; texto de chamada revisado; o disquete substitui a
     prancheta na lista; faxina de ids repetidos em Meus Temas (era o que travava o tema de teste);
     texto de chamada na versão curta. -->
<!-- v4-5 (18/09/2026): abas na ordem RedaON (com a marca na cápsula), Meus Temas, ENEM Principal, ENEM
     Especiais e Todos; o disquete fica vivo e a caixa muda de cor quando salvo, com aviso "Tema salvo em
     Meus Temas"; corrigido o tema que entrava em Meus Temas e não saía (id duplicado na lista); o texto de
     chamada ficou fixo, com Preparar, Entender o tema, Material de apoio e Atividades em negrito; Escrever e
     Preparar passaram para depois dos cartões; o painel de conteúdo sobe na frente da imagem. -->
<!-- v4-4 (18/09/2026): capa cheia refeita — imagem de 340 px com apenas o selo e o tema; campo na linha de
     dados junto do ENEM e do grupo; Salvar como ícone de disquete que fica marcado; chamada que convida a
     ver o material; três cartões rolando de lado (Entender o tema, Material de apoio, Atividades) com prévia
     do que tem dentro; Escrever e Preparar no rodapé, para o aluno ver o material antes de decidir. -->
<!-- v4-3 (18/09/2026): corrigida a leitura do material. A coluna conteudo é texto com JSON dentro, e eu
     tratava como lista, então a contagem de fichas e a fileira de eixos não apareciam na capa cheia. -->
<!-- v4-2 (18/09/2026): nomes de tela para os eixos 'argumentos' e 'intervencao', que existem no banco e
     apareciam como apelido cru na capa cheia. -->
<!-- v4-1 (18/09/2026): o toque no tema abre a capa cheia (selos, título sobre a imagem, dados, Escrever,
     Preparar, Salvar e o resumo do tema quando existir material_apoio do eixo "entender"); a aba de
     favoritos passa a se chamar "Salvos", com o aviso falando a mesma língua; os dois botões do herói
     ficam do mesmo tamanho. -->
<!-- v4-0 (18/09/2026): Temas com o kit do redesenho. Fundo aquarela, título em caixa normal, cinco abas em
     chips com carrossel (Todos, RedaON, Prova principal, Outras aplicações, Meus temas), Campo e Busca logo
     abaixo, cartão herói escolhido por regra (Tema da Semana não escrito > mais recente não escrito do campo
     mais fraco > mais recente não escrito) e lista em linhas com miniatura de capa, selo de campo e selo
     "já escrevi". A dock de filtros saiu. A capa cheia do tema entra na etapa seguinte. -->
<title>RedaON | Temas</title>
<!-- RedaON · Portal do Aluno · Temas · v3-10 · sobre aluno-base-v6 -->
<script>
(function(){
  var pref = 'auto';
  try { pref = localStorage.getItem('redaon-tema') || 'auto'; } catch(e) {}
  var efetivo = pref;
  if (pref === 'auto') {
    var claroNoSistema = false;
    try { claroNoSistema = window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e) {}
    efetivo = claroNoSistema ? 'claro' : 'escuro';
  }
  document.documentElement.setAttribute('data-tema', efetivo);
  document.documentElement.setAttribute('data-tema-pref', pref);
})();
</script>

<style>

/* ═══ v4-0 · Temas com o kit do redesenho ═══

   e a linha do tema. O resto (fundo, título, chips, botões, selos) vem do kit da base. */
.ferrTemas{ display:flex; gap:8px; margin:0 auto .8rem; }
.fbTema{ flex:1; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text2);

.fbTema.busca{ color:var(--muted); font-weight:500; }
.fbTema.ativo{ background:rgba(var(--cyanRGB),.12); color:var(--cyan); border-color:transparent; }
.linhaBusca{ display:none; gap:8px; margin:0 auto .8rem; }
.linhaBusca.aberta{ display:flex; }
.linhaBusca input{ flex:1; min-width:0; font-family:inherit; font-size:13.5px; padding:9px 12px;

/* herói */

.hSelos{ position:relative; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.hSelos span{ font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;

.hSelos span.dest{ background:#fff; color:#0a4a4b; }

.hAcoesT .bt.secundario{ background:rgba(var(--cyanRGB),.12); color:var(--cyan); }

.gridTemas{ display:flex; flex-direction:column; gap:.6rem; }

@media(max-width:1023px){ .telaTema .ttAcoes{ margin-bottom:96px; } }

.ttCapa{ position:relative; min-height:340px; display:flex; flex-direction:column; justify-content:flex-end;

.ttCorpoInt{ position:relative; margin-top:-26px; padding:20px 18px 34px; background:var(--bg);

.ttChamada .junto{ white-space:nowrap; }
.ttCarr{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;

.ttCx{ flex:0 0 63%; scroll-snap-align:start; background:var(--surface); border-radius:16px;

.ttCarregando{ font-size:12.5px; color:var(--muted); }
.ttSinopse{ margin:16px 0 12px; font-size:14px; line-height:1.5; color:var(--text2); }
.ttSinopse.vazio{ color:var(--muted); }
.briefing{ display:flex; gap:10px; align-items:flex-start; background:var(--surface); border-radius:14px;

.briefing .fe{ width:20px; height:20px; flex:0 0 auto; vertical-align:0; }
.briefing b{ display:block; font-size:12.5px; color:var(--text); margin-bottom:2px; }
.briefing p{ margin:0; font-size:12.5px; line-height:1.45; color:var(--text2); }
.ttRot{ margin:18px 0 8px; font-size:12.5px; color:var(--muted); }
.ttEixos{ display:flex; flex-wrap:wrap; gap:6px; }

/* v4-14 · opção B: com capa, a imagem fica limpa (sem camada escura) e selos + título descem

<body class="aquarela">

<div id="main-content" style="display:flex;flex-direction:column;min-height:100vh;">
  <div id="conteudo">

    <div class="cabTela"><h1>Temas</h1><span class="conta" id="contTemas"></span></div>
    <div id="chipsAbas"></div>
    <div class="ferrTemas colunaTela">
      <button class="fbTema" id="btCampo" onclick="toggleGvCampo()"><span id="lblCampo">Campo</span><span class="seta">&#9662;</span></button>
      <button class="fbTema busca" onclick="abrirBusca()">&#128269; Buscar</button>
    </div>
    <div class="linhaBusca colunaTela" id="linhaBusca">
      <input id="buscaTopo" type="search" enterkeyhint="search" placeholder="Buscar tema, ano ou campo"
             oninput="sincronizarBusca(this.value)"
             onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"/>
      <button class="fbTema" onclick="limparBusca()">Fechar</button>
    </div>
    <div class="pista colunaTela" id="pistaTemas">
      <div id="heroiTema"></div>
    <div class="gridTemas" id="gridTemas"><div class="spinner" id="loadingTemas" style="grid-column:1/-1;"></div></div>

      <button class="btnMais hidden" id="btnMais" onclick="mostrarMais()">Carregar mais</button>
    </div>

    <div class="pillSugerir" onclick="abrirGaveta('gvSugestao')">
      <span style="font-size:1.1rem;">&#128161;</span> Sugerir um tema para a PROfa
      <span class="fim">&#8250;</span>
    </div>

  </div>

<script src="aluno-base-v6.js?v=6-19"></script>
<script>
  if (typeof authGuard === 'function') { authGuard('aluno'); }

  /* v4-8 · marca de versão para conferir se o arquivo no ar é o novo, sem poluir a tela.
     No computador: F12, aba Console. No celular: dá para ver em chrome://inspect ou pelo
     nome das abas (Todos, RedaON, Meus Temas, ENEM Principal, ENEM Especiais). */
  console.info('RedaON · temas v4-13 · ' + new Date().toISOString().slice(0,10));
  document.documentElement.setAttribute('data-tela', 'temas v4-13');

  // Professor que abrir esta página vai para o portal dele (decisão 6A)
  (function(){
    try {
      var perfil = (typeof authGetTipo === 'function') ? authGetTipo() : null;
      if (perfil === 'professor') { window.location.href = 'professor-temas.html'; }
    } catch(e) {}
  })();

  montarEsqueleto({
    ativo:  'temas',
    titulo: 'Temas',
    icone:  'library_books',
    sino:   false
  });

  // ─── Estado ───
  var TEMAS = [];
  var TEMA_SEMANA = null;
  var MEUS_TEMAS_IDS = [];
  /* v4-7 · Meus Temas agora mora no banco (tabela temas_salvos), então abre em qualquer
     aparelho. O que estava só no navegador é levado para o banco na primeira abertura, e o
     navegador segue como cópia local, para a tela responder na hora e funcionar sem rede. */
  try { MEUS_TEMAS_IDS = JSON.parse(localStorage.getItem('redaon_temas_salvos') || '[]'); } catch(e) {}
  (function(){
    var vistos = {}, limpa = [];
    (MEUS_TEMAS_IDS || []).forEach(function(id){ if (id && !vistos[id]) { vistos[id] = true; limpa.push(id); } });
    MEUS_TEMAS_IDS = limpa;
    try { localStorage.setItem('redaon_temas_salvos', JSON.stringify(limpa)); } catch(e) {}
  })();
  function guardarLocal(){
    try { localStorage.setItem('redaon_temas_salvos', JSON.stringify(MEUS_TEMAS_IDS)); } catch(e) {}
  }
  function alunoId(){ try { return (typeof authGetUserId === 'function') ? authGetUserId() : null; } catch(e) { return null; } }
  /* v4-9 · quem manda é o banco. Antes eu juntava as duas listas, e o que estava só no
     aparelho voltava para o banco — por isso o tema desmarcado num lugar ressuscitava no
     outro. A subida do que existia no navegador acontece UMA vez, na migração. */
  var CHAVE_MIGRADO = 'redaon_salvos_migrados';
  async function carregarMeusTemas(){
    var uid = alunoId(); if (!uid) return;
    try {
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos?aluno_id=eq.' + uid
        + '&select=tema_id,origem&order=criado_em.desc', {});
      if (!res.ok) return;                         /* sem rede: segue com a cópia local */
      var doBanco = (await res.json()).map(function(r){ return r.tema_id; });

      var migrado = false;
      try { migrado = localStorage.getItem(CHAVE_MIGRADO) === '1'; } catch(e) {}
      if (!migrado) {
        var soLocal = MEUS_TEMAS_IDS.filter(function(id){ return doBanco.indexOf(id) < 0; });
        if (soLocal.length) {
          try {
            await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos', {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify(soLocal.map(function(id){ return { aluno_id:uid, tema_id:id, origem:'aluno' }; }))
            });
            doBanco = doBanco.concat(soLocal);
          } catch(e) { console.warn('[temas] subir salvos', e); }
        }
        try { localStorage.setItem(CHAVE_MIGRADO, '1'); } catch(e) {}
      }

      var vistos = {}, lista = [];
      doBanco.forEach(function(id){ if (id && !vistos[id]) { vistos[id] = true; lista.push(id); } });
      MEUS_TEMAS_IDS = lista;                      /* o banco é a verdade */
      guardarLocal();
      renderGvCampo();
      renderTemas();
    } catch(e) { console.warn('[temas] meus temas', e); }
  }
  async function gravarSalvo(id, salvou){
    var uid = alunoId(); if (!uid) return;
    try {
      if (salvou) {
        await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ aluno_id:uid, tema_id:id, origem:'aluno' })
        });
      } else {
        await dbFetch(SUPABASE_URL + '/rest/v1/temas_salvos?aluno_id=eq.' + uid
          + '&tema_id=eq.' + id + '&origem=eq.aluno', { method:'DELETE' });
      }
    } catch(e) { console.warn('[temas] gravar salvo', e); }
  }
  /* v4-0 · cinco abas. A aplicação de cada tema aparece como selo no próprio card. */
  /* v4-5 · ordem e nomes decididos com o Alan. O RedaON leva a marca dentro da cápsula. */
  var LOGO_R = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'
    + '<rect width="40" height="40" rx="11" fill="#0a8c8d"/>'
    + '<text x="20" y="28" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">R</text></svg>');
  var ABAS = [
    { id:'todos',     rotulo:'Todos' },
    { id:'redaon',    rotulo:'RedaON', avatar:LOGO_R },
    { id:'meus',      rotulo:'Meus Temas' },
    { id:'principal', rotulo:'ENEM Principal' },
    { id:'outras',    rotulo:'ENEM Especiais' }
  ];
  /* campos: id do banco, nome de tela e as duas cores da capa composta (a arte entra depois) */
  var CAMPOS = [
    { id:'trabalho',       nome:'Trabalho',       c:['#b07d10','#8a5a00'] },
    { id:'educacao',       nome:'Educa\u00e7\u00e3o',     c:['#1f6fb2','#0a8c8d'] },
    { id:'saude',          nome:'Sa\u00fade',             c:['#0f8a4d','#0a8c8d'] },
    { id:'cidadania',      nome:'Cidadania',      c:['#5a4fc4','#1f6fb2'] },
    { id:'cultura',        nome:'Cultura',        c:['#8a5cc4','#c4488f'] },
    { id:'tecnologia',     nome:'Tecnologia',     c:['#0a8c8d','#5a4fc4'] },
    { id:'meio_ambiente',  nome:'Meio ambiente',  c:['#0f8a4d','#5a8c10'] },
    { id:'alimentacao',    nome:'Alimenta\u00e7\u00e3o',  c:['#c47a10','#8a9c10'] },
    { id:'infancia',       nome:'Inf\u00e2ncia',          c:['#c4488f','#c47a10'] },
    { id:'mulher',         nome:'Mulher',         c:['#c4488f','#8a5cc4'] },
    { id:'violencia',      nome:'Viol\u00eancia',         c:['#b2452f','#8a2f4a'] },
    { id:'envelhecimento', nome:'Envelhecimento', c:['#b07d10','#0f8a4d'] },
    { id:'saneamento',     nome:'Saneamento',     c:['#1f6fb2','#0f8a4d'] }
  ];
  var MEUS_FEITOS = {};   /* tema_id -> { nota } do que o aluno já escreveu */
  var HEROI_ID = null;
  var abaAtiva = 'todos';
  var campoAtivo = 'todos';
  var textoBusca = '';
  var LIMITE = 12, mostrando = 12;

  function campoDe(id){ for (var i=0;i<CAMPOS.length;i++){ if (CAMPOS[i].id===id) return CAMPOS[i]; } return null; }
  function nomeCampo(id){ var c=campoDe(id); return c ? c.nome : 'Sem campo'; }
  function coresCampo(id){ var c=campoDe(id); return c ? c.c : ['#8a8576','#6f6c63']; }
  function aplicacaoRotulo(t){
    var a=(t.aplicacao||'').toLowerCase();
    if (!t.ano_enem) return 'RedaON';
    if (a==='regular') return 'ENEM ' + t.ano_enem;
    var nomes={ ppl:'PPL', segunda_aplicacao:'reaplica\u00e7\u00e3o', digital:'digital', especial:'especial', cancelada:'cancelada' };
    return 'ENEM ' + t.ano_enem + ' \u00b7 ' + (nomes[a] || a);
  }
  function capaHtml(t, classe){
    if (t.capa_url) return '<div class="'+classe+'"><img src="'+t.capa_url+'" alt="" loading="lazy"></div>';
    var c=coresCampo(t.campo);
    return '<div class="'+classe+'" style="background:linear-gradient(140deg,'+c[0]+','+c[1]+')"></div>';
  }

  // ─── Carga do banco ───
  async function carregarTemas() {
    try {
      var url = SUPABASE_URL + '/rest/v1/temas?select=id,titulo,categoria,campo,capa_url,nivel,ano_enem,aplicacao,descricao,ativo,semana_de&ativo=eq.true&order=ano_enem.desc.nullsfirst&order=aplicacao.asc';
      var res = await dbFetch(url, {});
      if (!res.ok) throw new Error('Erro ao buscar temas: ' + res.status);
      TEMAS = await res.json();
      // Tema da Semana: semana_de <= hoje < semana_de + 7
      var hoje = new Date(); hoje.setHours(0,0,0,0);
      TEMA_SEMANA = TEMAS.find(function(t){
        if (!t.semana_de) return false;
        var ini = new Date(t.semana_de + 'T00:00:00');
        var fim = new Date(ini); fim.setDate(fim.getDate() + 7);
        return hoje >= ini && hoje < fim;
      }) || null;
      await carregarFeitos();
      await carregarMeusTemas();
      montarHeroi();
      renderGvCampo();
      renderTemas();
    } catch(e) {
      console.warn('Erro ao carregar temas:', e);
      var g = document.getElementById('gridTemas');
      if (g) g.innerHTML = '<p class="vazio">N\u00e3o consegui carregar os temas agora.<br>Verifique sua conex\u00e3o e recarregue.</p>';
    }
  }

  /* v4-0 · o que o aluno já escreveu: alimenta a regra do herói e o selo "já escrevi" */
  async function carregarFeitos(){
    MEUS_FEITOS = {};
    try {
      var uid = (typeof authGetUserId === 'function') ? authGetUserId() : null;
      if (!uid) return;
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/redacoes?aluno_id=eq.' + uid
        + '&tema_id=not.is.null&select=tema_id,nota_final,created_at&order=created_at.desc', {});
      if (!res.ok) return;
      (await res.json()).forEach(function(r){
        if (!MEUS_FEITOS[r.tema_id]) MEUS_FEITOS[r.tema_id] = { nota: r.nota_final || null };
      });
    } catch(e) { console.warn('[temas] feitos', e); }
  }
  function jaEscreveu(t){ return !!MEUS_FEITOS[t.id]; }
  function semanaRotulo(t){
    if (!t.semana_de) return '';
    var ini=new Date(t.semana_de+'T00:00:00'), fim=new Date(ini); fim.setDate(fim.getDate()+6);
    var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return ini.getDate()+'\u2013'+fim.getDate()+' '+MES[fim.getMonth()];
  }
  /* v4-0 · qual tema vira o herói, na ordem combinada:
     1) Tema da Semana que ele ainda não escreveu
     2) o mais recente que ele ainda não escreveu, do campo em que ele vai pior
     3) o mais recente que ele ainda não escreveu
     4) se já escreveu tudo, o Tema da Semana mesmo assim */
  function campoMaisFraco(){
    var soma={}, qtd={};
    TEMAS.forEach(function(t){
      var f=MEUS_FEITOS[t.id];
      if (!f || !f.nota || !t.campo) return;
      soma[t.campo]=(soma[t.campo]||0)+f.nota; qtd[t.campo]=(qtd[t.campo]||0)+1;
    });
    var pior=null, menor=Infinity;
    Object.keys(soma).forEach(function(k){ var m=soma[k]/qtd[k]; if (m<menor){ menor=m; pior=k; } });
    return pior;
  }
  function escolherHeroi(){
    if (TEMA_SEMANA && !jaEscreveu(TEMA_SEMANA)) return { t:TEMA_SEMANA, selo:'Tema da semana' };
    var novos = TEMAS.filter(function(t){ return !jaEscreveu(t); });
    if (novos.length){
      var fraco = campoMaisFraco();
      if (fraco){
        var doFraco = novos.filter(function(t){ return t.campo===fraco; });
        if (doFraco.length) return { t:doFraco[0], selo:'Refor\u00e7ar ' + nomeCampo(fraco) };
      }
      return { t:novos[0], selo:'Novo para voc\u00ea' };
    }
    return TEMA_SEMANA ? { t:TEMA_SEMANA, selo:'Tema da semana' } : null;
  }
  function heroiEscondido(){ return !!textoBusca || campoAtivo !== 'todos'; }
  function montarHeroi(){
    var alvo=document.getElementById('heroiTema'); if(!alvo) return;
    if (heroiEscondido()){ alvo.innerHTML=''; return; }
    var h=escolherHeroi();
    if (!h){ alvo.innerHTML=''; HEROI_ID=null; return; }
    var t=h.t, feito=MEUS_FEITOS[t.id];
    HEROI_ID = t.id;
    /* selos e título por cima da capa, como no desenho aprovado */
    var cores=coresCampo(t.campo);
    var fundo = t.capa_url
      ? 'background-image:url('+t.capa_url+');background-size:cover;background-position:center bottom;'
      : 'background:linear-gradient(140deg,'+cores[0]+','+cores[1]+');';
    var cabH = '<div class="hSelos"><span class="dest">'+h.selo+'</span>'
          + (t.semana_de?'<span>'+semanaRotulo(t)+'</span>':'')
          + '<span>'+escapeHtmlSimples(nomeCampo(t.campo))+'</span></div>'
        + '<p class="hTit">'+escapeHtmlSimples(t.titulo)+'</p>';
    alvo.innerHTML='<div class="heroiTema" onclick="abrirTema(\''+t.id+'\')">'
      + (t.capa_url
          ? '<div class="capaHeroi soImg" style="'+fundo+'"></div><div class="hCab">' + cabH + '</div>'   /* v4-14 · opção B */
          : '<div class="capaHeroi" style="'+fundo+'"><span class="scrim"></span>' + cabH + '</div>')
      + '<div class="hPe"><span>'+aplicacaoRotulo(t)+(t.nivel?(' \u00b7 n\u00edvel '+escapeHtmlSimples(String(t.nivel).toLowerCase())):'')+'</span>'
        + (feito?'<span class="jaFiz">j\u00e1 escrevi'+(feito.nota?' \u00b7 '+feito.nota:'')+'</span>':'')+'</div>'
      + '<div class="hAcoesT">'
        + '<button class="bt" onclick="event.stopPropagation();escreverTema(\''+t.id+'\')">Escrever</button>'
        + '<button class="bt secundario" onclick="event.stopPropagation();prepararTema(\''+t.id+'\')">Preparar</button>'
      + '</div></div>';
  }
  /* ─── v4-1 · capa cheia do tema (a "capa de filme") ─── */
  var _apoioCache = {};
  function temaPorId(id){ for (var i=0;i<TEMAS.length;i++){ if (TEMAS[i].id===id) return TEMAS[i]; } return null; }
  /* v4-2: o banco tem também 'argumentos' e 'intervencao' (fora dos nove eixos de repertório) */
  var NOME_EIXO = { legislacao:'Legisla\u00e7\u00e3o', historia:'Hist\u00f3ria', especialistas:'Especialistas',
    atualidades:'Atualidades e dados', literatura:'Literatura', filosofia:'Filosofia', cinema:'Cinema',
    ciencia:'Ci\u00eancia', culturapop:'Cultura pop', argumentos:'Argumentos', intervencao:'Interven\u00e7\u00e3o',
    entender:'Entender o tema' };
  /* v4-3 · a coluna conteudo é TEXTO com JSON dentro, então precisa de JSON.parse.
     Era por isso que a contagem de fichas e a fileira de eixos não apareciam. */
  function lerConteudo(c){
    if (c == null) return null;
    if (typeof c === 'object') return c;
    try { return JSON.parse(c); } catch(e) { return null; }
  }
  async function buscarApoio(temaId){
    if (_apoioCache[temaId]) return _apoioCache[temaId];
    var fora = { entender:null, fichas:0, eixos:[] };
    try {
      var res = await dbFetch(SUPABASE_URL + '/rest/v1/material_apoio?tema_id=eq.' + temaId
        + '&select=eixo,conteudo,estado', {});
      if (res.ok) {
        (await res.json()).forEach(function(m){
          var dado = lerConteudo(m.conteudo);
          if (m.eixo === 'entender') { fora.entender = dado; return; }
          var n = Array.isArray(dado) ? dado.length : (dado ? 1 : 0);
          if (n) { fora.fichas += n; fora.eixos.push({ eixo:m.eixo, n:n }); }
        });
        fora.eixos.sort(function(a,b){ return b.n - a.n; });
      }
    } catch(e) { console.warn('[temas] apoio', e); }
    _apoioCache[temaId] = fora;
    return fora;
  }
  function blocoBriefing(ico, titulo, texto){
    if (!texto) return '';
    return '<div class="briefing">' + feIcone(ico) + '<div><b>' + titulo + '</b><p>'
      + escapeHtmlSimples(String(texto)) + '</p></div></div>';
  }
  async function abrirTema(id){
    var t = temaPorId(id); if (!t) return;
    var feito = MEUS_FEITOS[id];
    var fav = MEUS_TEMAS_IDS.indexOf(id) >= 0;
    var cores = coresCampo(t.campo);
    var fundo = t.capa_url
      ? 'background-image:url(' + t.capa_url + ');background-size:cover;background-position:center bottom;'
      : 'background:linear-gradient(140deg,' + cores[0] + ',' + cores[1] + ');';
    var grupo = !t.ano_enem ? 'RedaON'
      : ((t.aplicacao||'').toLowerCase()==='regular' ? 'Prova principal' : 'Outras aplica\u00e7\u00f5es');
    var tela = document.getElementById('telaTema');
    document.getElementById('ttCorpo').innerHTML =
      /* v4-4 · sobre a imagem, só o selo e o tema. O campo desceu para a linha de dados. */
      (function(){
        var cab = ((t.semana_de || feito) ? ('<div class="hSelos">'
          + (t.semana_de?'<span class="dest">Tema da semana</span><span>'+semanaRotulo(t)+'</span>':'')
          + (feito?'<span>j\u00e1 escrevi' + (feito.nota?' \u00b7 '+feito.nota:'') + '</span>':'')
          + '</div>') : '')
          + '<p class="hTit">' + escapeHtmlSimples(t.titulo) + '</p>';
        var voltar = '<button class="ttVoltar" onclick="fecharTema()" aria-label="Voltar">\u2039</button>';
        /* v4-14 · opção B: com capa, a cena abre limpa e selos + título ficam no topo do painel claro */
        return t.capa_url
          ? '<div class="ttCapa soImg" style="' + fundo + '">' + voltar + '</div>'
            + '<div class="ttCorpoInt"><div class="hCab">' + cab + '</div>'
          : '<div class="ttCapa" style="' + fundo + '"><span class="scrim"></span>' + voltar + cab + '</div>'
            + '<div class="ttCorpoInt">';
      })()
        + '<div class="ttDados"><span><b>' + aplicacaoRotulo(t) + '</b> \u00b7 ' + grupo
          + ' \u00b7 <b class="campoTx">' + escapeHtmlSimples(nomeCampo(t.campo)) + '</b></span>'
          + '<button class="btSalvar' + (fav?' on':'') + '" id="ttSalvar" onclick="alternarFavorito(\''+id+'\', this)"'
            + ' aria-label="Salvar em Salvos" title="Salvar em Salvos">' + feIcone('disquete') + '</button>'
        + '</div>'
        + '<p class="ttChamada">Antes de <b>Escrever</b>, se <b>Preparar</b> ajuda a '
          + '<span class="junto">' + feIcone('lampada') + ' <b>Entender o tema</b></span>, juntar argumentos no '
          + '<span class="junto">' + feIcone('livros') + ' <b>Material de apoio</b></span> e treinar nas '
          + '<span class="junto">' + feIcone('alvo') + ' <b>Atividades</b></span>.</p>'
        + '<div class="ttCarr" id="ttCarr"></div>'
        /* v4-5 · os botões vêm DEPOIS dos materiais, para o aluno ver o que existe antes de decidir */
        + '<div class="ttAcoes">'
          + '<button class="bt" onclick="escreverTema(\''+id+'\')">Escrever</button>'
          + '<button class="bt secundario" onclick="prepararTema(\''+id+'\')">Preparar</button>'
        + '</div>'
      + '</div>';
    tela.classList.add('on');
    document.body.classList.add('semRolar');
    tela.scrollTop = 0;
    var ap = await buscarApoio(id);
    montarCartoes(id, ap);
  }
  /* v4-4 · os três cartões rolam de lado e dizem o que tem dentro de cada parte */
  function montarCartoes(id, ap){
    var alvo = document.getElementById('ttCarr'); if (!alvo) return;
    var e = ap.entender || {};
    var temEntender = !!(e.recorte || e.banca || e.armadilhas);
    var eixos = ap.eixos.slice(0,3).map(function(x){ return NOME_EIXO[x.eixo] || x.eixo; }).join(', ');

    function cartao(ico, titulo, linhas, acao){
      return '<div class="ttCx" onclick="' + acao + '">' + feIcone(ico)
        + '<b>' + titulo + '</b>'
        + linhas.filter(Boolean).map(function(l){ return '<span>' + l + '</span>'; }).join('')
        + '</div>';
    }
    var abrir = 'prepararTema(\'' + id + '\')';
    alvo.innerHTML =
      cartao('lampada','Entender o tema', temEntender
        ? [ 'Recorte: o que o tema pede e o que n\u00e3o pede',
            e.banca ? 'O que a banca espera na corre\u00e7\u00e3o' : '',
            e.armadilhas ? 'Armadilhas que fazem perder ponto' : '' ]
        : [ 'Recorte: o que o tema pede e o que n\u00e3o pede',
            'O que a banca espera na corre\u00e7\u00e3o',
            'Armadilhas que fazem perder ponto' ], abrir)
      + cartao('livros','Material de apoio', ap.fichas
        ? [ ap.fichas + (ap.fichas===1?' ficha':' fichas') + ' em ' + ap.eixos.length + (ap.eixos.length===1?' eixo':' eixos'),
            eixos, 'Cada uma com fonte e como usar' ]
        : [ 'Reposit\u00f3rio de repert\u00f3rio do tema', 'Com fonte e como usar na reda\u00e7\u00e3o',
            'Em prepara\u00e7\u00e3o pela PROfa' ], abrir)
      + cartao('alvo','Atividades',
        [ 'Flashcards do tema', 'Quiz das compet\u00eancias', 'Foco no que puxa sua nota para baixo' ], abrir);
  }
  function fecharTema(){
    document.getElementById('telaTema').classList.remove('on');
    document.body.classList.remove('semRolar');
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.getElementById('telaTema').classList.contains('on')) fecharTema();
  });

  // ─── Abas: chips com carrossel, do kit da base ───
  var _trilhoAbas = null;
  function montarAbas(){
    _trilhoAbas = trilhoFiltros({
      alvo:'chipsAbas', pista:'pistaTemas', area:'conteudo',
      itens: ABAS.map(function(a){ return { id:a.id, rotulo:a.rotulo, avatar:a.avatar }; }),
      ativo: abaAtiva,
      aoTrocar: function(id){ abaAtiva=id; mostrando=LIMITE; renderGvCampo(); renderTemas(); }
    });
  }
  function irAba(a){ if(_trilhoAbas) _trilhoAbas.ir(a); }

  // ─── Gaveta de Campo ───
  function contarPorCampo(){
    var base = obterFiltrados({ ignorarCampo:true, ignorarBusca:true });
    var mapa = { todos: base.length };
    base.forEach(function(t){ var k=t.campo||'sem'; mapa[k]=(mapa[k]||0)+1; });
    return mapa;
  }
  function renderGvCampo(){
    var cont = contarPorCampo();
    var itens = [{ id:'todos', nome:'Todos os campos' }]
      .concat(CAMPOS.map(function(c){ return { id:c.id, nome:c.nome }; }))
      .concat([{ id:'sem', nome:'Sem campo' }]);
    var alvo = document.getElementById('gvCampoLista');
    if (!alvo) return;
    alvo.innerHTML = itens.map(function(i){
      var sel=(i.id===campoAtivo), n=cont[i.id]||0, vazio=(n===0 && !sel);
      return '<a class="pill'+(sel?' sel':'')+'"'+(vazio?' style="opacity:.45;"':'')
        + ' onclick="escolherCampo(\''+i.id+'\')">'+escapeHtmlSimples(i.nome)
        + '<span style="font-size:.72rem;font-weight:600;color:'+(sel?'var(--cyan)':'var(--muted)')+';margin-left:.35rem;">('+n+')</span>'
        + '<i class="fim"'+(sel?'':' style="opacity:0;"')+'>&#10003;</i></a>';
    }).join('');
  }
  function escolherCampo(id){
    campoAtivo = id; mostrando = LIMITE;
    var nome = id==='todos' ? 'Campo' : (id==='sem' ? 'Sem campo' : nomeCampo(id));
    document.getElementById('lblCampo').textContent = nome;
    document.getElementById('btCampo').classList.toggle('ativo', id!=='todos');
    renderGvCampo(); fecharGaveta('gvCampo'); montarHeroi(); renderTemas();
  }
  function toggleGvCampo(){ toggleGaveta('gvCampo'); }

  // ─── Busca ───
  function abrirBusca(){
    var l=document.getElementById('linhaBusca'); l.classList.add('aberta');
    var i=document.getElementById('buscaTopo'); if(i) i.focus();
  }
  function limparBusca(){
    var l=document.getElementById('linhaBusca'); l.classList.remove('aberta');
    var i=document.getElementById('buscaTopo'); if(i) i.value='';
    textoBusca=''; mostrando=LIMITE; montarHeroi(); renderTemas();
  }
  function sincronizarBusca(v){
    textoBusca = (v || '').toLowerCase().trim();
    mostrando = LIMITE;
    montarHeroi();
    renderTemas();
  }

  // ─── Filtragem (mesmas regras da produção) ───
  function obterFiltrados(op){
    op = op || {};
    var lista = [];
    switch (abaAtiva) {
      case 'todos':     lista = TEMAS.slice(); break;
      case 'redaon':    lista = TEMAS.filter(function(t){ return !t.ano_enem; }); break;
      case 'principal': lista = TEMAS.filter(function(t){ return t.ano_enem && (t.aplicacao||'').toLowerCase()==='regular'; }); break;
      case 'outras':    lista = TEMAS.filter(function(t){ return t.ano_enem && (t.aplicacao||'').toLowerCase()!=='regular'; }); break;
      case 'meus':      lista = TEMAS.filter(function(t){ return MEUS_TEMAS_IDS.indexOf(t.id) >= 0; }); break;
    }
    if (!op.ignorarCampo && campoAtivo !== 'todos') {
      lista = lista.filter(function(t){ return campoAtivo==='sem' ? !t.campo : t.campo===campoAtivo; });
    }
    if (textoBusca && !op.ignorarBusca) {
      lista = lista.filter(function(t){
        return (t.titulo || '').toLowerCase().indexOf(textoBusca) >= 0
            || nomeCampo(t.campo).toLowerCase().indexOf(textoBusca) >= 0
            || String(t.ano_enem || '').indexOf(textoBusca) >= 0
            || (t.aplicacao || '').toLowerCase().indexOf(textoBusca) >= 0;
      });
    }
    /* v4-11 · o herói só é retirado da lista quando ele está aparecendo. Ao buscar ou ao
       filtrar por campo, o cartão grande sai de cena e a lista precisa mostrar tudo —
       antes o tema buscado desaparecia justamente por ser o herói. */
    if (!op.ignorarHeroi && HEROI_ID && !heroiEscondido()) lista = lista.filter(function(t){ return t.id !== HEROI_ID; });
    lista.sort(function(a,b){
      var fa = jaEscreveu(a)?1:0, fb = jaEscreveu(b)?1:0;
      if (fa !== fb) return fa - fb;
      return (b.ano_enem||0) - (a.ano_enem||0);
    });
    return lista;
  }

  // ─── Renderização ───
  function renderTemas(){
    var load = document.getElementById('loadingTemas');
    if (load) load.remove();
    var lista = obterFiltrados();
    var total = lista.length + (HEROI_ID?1:0);
    document.getElementById('contTemas').textContent = total + (total === 1 ? ' tema' : ' temas');
    var grid = document.getElementById('gridTemas');
    var btnMais = document.getElementById('btnMais');
    if (lista.length === 0) {
      var msgs = { meus: 'Voc\u00ea ainda n\u00e3o guardou nenhum tema.<br>Toque no disquete do tema para guardar em Meus Temas.' };
      grid.innerHTML = '<p class="vazio">' + (msgs[abaAtiva] || 'Nenhum tema neste filtro.<br>Tente outro campo ou outra aba.') + '</p>';
      btnMais.classList.add('hidden');
      return;
    }
    /* v4-0 · linha com miniatura em retrato (a capa), fonte, campo e o alfinete de salvar */
    var visiveis = lista.slice(0, mostrando);
    grid.innerHTML = visiveis.map(function(t){
      var fav = MEUS_TEMAS_IDS.indexOf(t.id) >= 0;
      var feito = MEUS_FEITOS[t.id];
      return '<div class="linhaTema' + (feito?' feito':'') + '" onclick="abrirTema(\'' + t.id + '\')">'
        + capaHtml(t,'capaMini')
        + '<div class="lTxt"><p>' + escapeHtmlSimples(t.titulo) + '</p>'
        + '<span class="lPe">' + aplicacaoRotulo(t)
          + ' <b class="eixo' + (t.campo?'':' vazio') + '">' + escapeHtmlSimples(nomeCampo(t.campo)) + '</b>'
          + (feito ? '<b class="jaFiz">j\u00e1 escrevi' + (feito.nota?' \u00b7 '+feito.nota:'') + '</b>' : '')
        + '</span></div>'
        + '<button class="tPin' + (fav ? ' on' : '') + '" onclick="event.stopPropagation();alternarFavorito(\'' + t.id + '\', this)" aria-label="Salvar em Meus Temas">'
        + feIcone('disquete') + '</button>'
        + '</div>';
    }).join('');
    btnMais.classList.toggle('hidden', lista.length <= mostrando);
  }

  function mostrarMais(){ mostrando += LIMITE; renderTemas(); }

  // ─── Ações (contrato de produção: sessionStorage tema_selecionado) ───
  function acharTema(id){ return TEMAS.find(function(t){ return t.id === id; }); }
  function escreverTema(id){
    var t = acharTema(id);
    if (!t) return;
    definirTemaSelecionado(t);
    abrirMetodos();
  }
  function prepararTema(id){
    var t = acharTema(id);
    if (!t) return;
    definirTemaSelecionado(t);
    window.location.href = 'hub-preparacao.html';
  }
  /* v4-1 · "Salvos" é do aluno. O que o professor destinar vira outra aba, quando existir. */
  function alternarFavorito(id, el){
    /* v4-5: antes era indexOf + splice, e um id duplicado ficava na lista para sempre.
       Agora a lista é filtrada e nunca aceita repetido. */
    var tinha = MEUS_TEMAS_IDS.indexOf(id) >= 0;
    MEUS_TEMAS_IDS = MEUS_TEMAS_IDS.filter(function(x){ return x !== id; });
    var salvou = !tinha;
    if (salvou) MEUS_TEMAS_IDS.push(id);
    if (el){
      el.classList.toggle('on', salvou);
    }
    var bt = document.getElementById('ttSalvar');
    if (bt && bt !== el) bt.classList.toggle('on', salvou);
    toast(salvou ? 'Tema salvo em Meus Temas' : 'Tema retirado de Meus Temas');
    guardarLocal();
    gravarSalvo(id, salvou);      /* o banco é atualizado em segundo plano */
    renderTemas();
  }

  // ─── Sugerir tema ───
  async function enviarSugestao(){
    var txt = (document.getElementById('txtSugestao').value || '').trim();
    if (txt.length < 10) { toast('Escreva a sugest\u00e3o com um pouco mais de detalhe.', 2400); return; }
    try {
      var url = SUPABASE_URL + '/rest/v1/sugestoes_temas';
      var res = await dbFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
        body: JSON.stringify({ texto: txt })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      document.getElementById('txtSugestao').value = '';
      fecharGaveta('gvSugestao');
      toast('\u{1F4A1} Sugest\u00e3o enviada para a PROfa!');
    } catch(e) {
      console.warn('Erro ao enviar sugest\u00e3o:', e);
      toast('N\u00e3o consegui enviar agora. Tente de novo.', 2600);
    }
  }

  /* v4-0 · a dock de filtros saiu: as abas moram no topo, em chips */
  function acordarDock(){}

  montarAbas();
  carregarTemas();
</script>
</body>
</html>
