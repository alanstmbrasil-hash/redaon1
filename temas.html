<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RedaON | Temas</title>
<!-- RedaON · Portal do Aluno · Temas · v3-10 · sobre aluno-base-v6 -->
<script>
(function(){
  var pref = 'auto';
  try { pref = localStorage.getItem('redaon-tema') || 'auto'; } catch(e) {}
  var efetivo = pref;
  if (pref === 'auto') {
    var claroNoSistema = false;
    try { claroNoSistema = window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e) {}
    efetivo = claroNoSistema ? 'claro' : 'escuro';
  }
  document.documentElement.setAttribute('data-tema', efetivo);
  document.documentElement.setAttribute('data-tema-pref', pref);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="aluno-base-v6.css" rel="stylesheet"/>
<style>
/* ===== Só o que é próprio de TEMAS ===== */
.temaSemana{ margin-bottom:.875rem; background:linear-gradient(135deg,rgba(var(--cyanRGB),.10),rgba(var(--purpleRGB),.08)); border:1px solid var(--cyan); border-radius:14px; padding:13px 14px; }
.tsTop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.tsBadge{ font-size:10px; font-weight:700; color:var(--cyan); letter-spacing:.04em; }
.tsData{ font-size:10px; color:var(--muted); font-weight:600; }
.tsTitulo{ margin:0 0 11px; font-size:14.5px; font-weight:700; color:var(--text); line-height:1.35; }
.tsBtns{ display:flex; gap:8px; }
.tsBtns .btn{ flex:1; }

#filtrosTopo{ display:none; }
@media (min-width:1024px), (max-width:1023px) and (orientation:landscape){
  #filtrosTopo{ display:flex; flex-direction:column; gap:.6rem; margin-bottom:.875rem; }
  #filtrosTopo .linha2{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
  #dockTemas{ display:none !important; }
  .gv.atras{ z-index:47; padding-bottom:24px; }
  .gvBg.atras{ z-index:46; }
}

.gridTemas { display:grid; grid-template-columns:1fr; gap:.7rem; }
@media(min-width:641px){ .gridTemas{ grid-template-columns:repeat(2,1fr); } }
@media(min-width:1024px){ .gridTemas{ grid-template-columns:repeat(3,1fr); } }
.tCard { background:var(--surface); border:1px solid rgba(var(--borderRGB),.18); border-radius:13px; padding:12px 13px; display:flex; flex-direction:column; }
.tCard .topo { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
.tBadge { font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; }
.tBadge.enem { color:var(--purpleSoft); background:rgba(var(--purpleRGB),.16); }
.tBadge.redaon { color:var(--gold); background:rgba(var(--goldRGB),.14); }
.tCard .dir { display:flex; align-items:center; gap:.4rem; }
.tCard .cat { font-size:10.5px; color:var(--muted); font-weight:600; }
.tPin { background:none; border:none; cursor:pointer; color:var(--muted); font-size:1rem; line-height:1; padding:.2rem; }
.tPin.on { color:var(--gold); }
.tCard .tit { margin:8px 0 10px; font-size:13.5px; font-weight:700; line-height:1.35; color:var(--text); flex:1; }
.tCard .btns { display:flex; gap:8px; }
.tCard .btns .btn{ flex:1; }
.btnMais { width:100%; margin-top:.875rem; min-height:44px; border-radius:11px; background:var(--surface2); color:var(--purpleSoft); font-size:13px; font-weight:700; border:none; cursor:pointer; }
.pillSugerir { display:flex; align-items:center; gap:.7rem; min-height:52px; padding:0 .875rem; border-radius:13px; background:var(--surface); border:1px dashed rgba(var(--purpleRGB),.45); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; margin-top:.7rem; }
.pillSugerir .fim { margin-left:auto; color:var(--muted); }

#dockBusca{ display:none; }
#dockBusca.aberta{ display:flex; }
.vazio{ grid-column:1/-1; text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 0; line-height:1.6; }
.spinner { width:38px; height:38px; border:3px solid var(--surface2); border-top-color:var(--cyan); border-radius:50%; animation:girar .8s linear infinite; margin:2rem auto; }
@keyframes girar { to { transform:rotate(360deg); } }

.areaSugestao textarea { width:100%; min-height:5rem; padding:.75rem .875rem; background:var(--surface2); border:1px solid rgba(var(--borderRGB),.3); border-radius:.7rem; color:var(--text); font-size:.9rem; font-family:inherit; resize:vertical; }
.areaSugestao textarea:focus { outline:none; border-color:rgba(var(--cyanRGB),.6); }
</style>
</head>
<body>

<div id="main-content" style="display:flex;flex-direction:column;min-height:100vh;">
  <div id="conteudo">

    <!-- TEMA DA SEMANA (some se nenhum tema estiver marcado no banco) -->
    <div class="temaSemana hidden" id="cardTemaSemana">
      <div class="tsTop"><span class="tsBadge">&#11088; TEMA DA SEMANA</span><span class="tsData" id="tsData"></span></div>
      <p class="tsTitulo" id="tsTitulo"></p>
      <div class="tsBtns">
        <button class="btn" onclick="escreverTemaSemana()">Escrever</button>
        <button class="btn ghost" onclick="prepararTemaSemana()">Preparar</button>
      </div>
    </div>

    <!-- FILTROS NO TOPO (tablet deitado + desktop) -->
    <div id="filtrosTopo">
      <div class="abasTrilho" id="abasTopo"></div>
      <div class="linha2">
        <button class="filtroBtn" id="fBtnTopo" onclick="toggleGvCategoria()"><span id="lblCatTopo">Todos os eixos</span><span class="seta">&#9662;</span></button>
        <div class="busca"><span class="material-symbols-outlined">search</span><input id="buscaTopo" placeholder="Buscar tema, ano, categoria..." oninput="sincronizarBusca(this.value)"/></div>
        <span id="contTopo" style="font-size:.75rem;color:var(--muted);white-space:nowrap;">&mdash;</span>
      </div>
    </div>

    <div class="gridTemas" id="gridTemas"><div class="spinner" id="loadingTemas" style="grid-column:1/-1;"></div></div>

    <button class="btnMais hidden" id="btnMais" onclick="mostrarMais()">Carregar mais</button>

    <div class="pillSugerir" onclick="abrirGaveta('gvSugestao')">
      <span style="font-size:1.1rem;">&#128161;</span> Sugerir um tema para a PROfa
      <span class="fim">&#8250;</span>
    </div>

  </div>
</div>

<!-- DOCK (celular + tablet em pé) -->
<div class="dockPolegar on" id="dockTemas">
  <div class="abasTrilho" id="abasDock"></div>
  <div class="busca" id="dockBusca"><span class="material-symbols-outlined">search</span><input id="buscaDock" placeholder="Buscar tema, ano, categoria..." oninput="sincronizarBusca(this.value)"/></div>
  <div style="display:flex;gap:.5rem;align-items:center;">
    <button class="filtroBtn" id="fBtnDock" style="flex:1 1 0;" onclick="toggleGvCategoria()"><span id="lblCatDock">Todos os eixos</span><span class="seta">&#9662;</span></button>
    <button class="filtroBtn" style="flex:1 1 0;justify-content:center;gap:.4rem;" onclick="toggleBuscaDock()">&#128269; Buscar</button>
  </div>
</div>

<!-- GAVETA CANÔNICA: EIXO TEMÁTICO (sobe por trás da dock e da barra) -->
<div class="gvBg atras" id="gvCategoriaBg" onclick="fecharGaveta('gvCategoria')"></div>
<div class="gv atras" id="gvCategoria">
  <div class="grip"></div>
  <p class="tit">Eixo tem&aacute;tico</p>
  <div id="gvCategoriaLista"></div>
</div>

<!-- GAVETA: SUGERIR TEMA -->
<div class="gvBg" id="gvSugestaoBg" onclick="fecharGaveta('gvSugestao')"></div>
<div class="gv" id="gvSugestao">
  <div class="grip"></div>
  <p class="tit">Sugerir um tema</p>
  <p class="sub">Sua sugest&atilde;o vai para a PROfa avaliar. Se aprovada, entra na biblioteca.</p>
  <div class="areaSugestao">
    <textarea id="txtSugestao" placeholder="Ex.: Os impactos das apostas online entre os jovens brasileiros"></textarea>
    <button class="btn" style="width:100%;margin-top:.7rem;min-height:44px;" onclick="enviarSugestao()">Enviar sugest&atilde;o</button>
  </div>
</div>

<script src="supabase-auth.js"></script>
<script src="aluno-base-v6.js"></script>
<script>
  if (typeof authGuard === 'function') { authGuard('aluno'); }

  // Professor que abrir esta página vai para o portal dele (decisão 6A)
  (function(){
    try {
      var perfil = (typeof authGetTipo === 'function') ? authGetTipo() : null;
      if (perfil === 'professor') { window.location.href = 'professor-temas.html'; }
    } catch(e) {}
  })();

  montarEsqueleto({
    ativo:  'temas',
    titulo: 'Temas',
    icone:  'library_books',
    sino:   false,
    versao: 'aluno \u00b7 temas \u00b7 v3-10'
  });

  // ─── Estado ───
  var TEMAS = [];
  var TEMA_SEMANA = null;
  var MEUS_TEMAS_IDS = [];
  try { MEUS_TEMAS_IDS = JSON.parse(localStorage.getItem('redaon_temas_salvos') || '[]'); } catch(e) {}
  var ABAS = [
    { id:'todos',     rotulo:'Todas' },
    { id:'recentes',  rotulo:'Recentes' },
    { id:'classicos', rotulo:'Cl\u00e1ssicos' },
    { id:'ppl',       rotulo:'PPL' },
    { id:'meus',      rotulo:'Meus Temas' },
    { id:'turma',     rotulo:'Da turma' }
  ];
  var EIXOS = ['Todos os eixos'];
  var abaAtiva = 'todos';
  var eixoAtivo = 'Todos os eixos';
  var textoBusca = '';
  var LIMITE = 12, mostrando = 12;

  // ─── Carga do banco (mesma consulta da produção + semana_de) ───
  async function carregarTemas() {
    try {
      var url = SUPABASE_URL + '/rest/v1/temas?select=id,titulo,categoria,nivel,ano_enem,aplicacao,descricao,ativo,semana_de&ativo=eq.true&order=ano_enem.desc.nullsfirst&order=aplicacao.asc';
      var res = await dbFetch(url, {});
      if (!res.ok) throw new Error('Erro ao buscar temas: ' + res.status);
      TEMAS = await res.json();
      // Eixos reais presentes no banco
      var vistos = {};
      TEMAS.forEach(function(t){ if (t.categoria) vistos[t.categoria] = true; });
      EIXOS = ['Todos os eixos'].concat(Object.keys(vistos).sort());
      // Tema da Semana: semana_de <= hoje < semana_de + 7
      var hoje = new Date(); hoje.setHours(0,0,0,0);
      TEMA_SEMANA = TEMAS.find(function(t){
        if (!t.semana_de) return false;
        var ini = new Date(t.semana_de + 'T00:00:00');
        var fim = new Date(ini); fim.setDate(fim.getDate() + 7);
        return hoje >= ini && hoje < fim;
      }) || null;
      montarTemaSemana();
      renderGvCategoria();
      renderTemas();
    } catch(e) {
      console.warn('Erro ao carregar temas:', e);
      var g = document.getElementById('gridTemas');
      if (g) g.innerHTML = '<p class="vazio">N\u00e3o consegui carregar os temas agora.<br>Verifique sua conex\u00e3o e recarregue.</p>';
    }
  }

  function montarTemaSemana() {
    var card = document.getElementById('cardTemaSemana');
    if (!card) return;
    if (!TEMA_SEMANA) { card.classList.add('hidden'); return; }
    document.getElementById('tsTitulo').textContent = TEMA_SEMANA.titulo;
    var ini = new Date(TEMA_SEMANA.semana_de + 'T00:00:00');
    var fim = new Date(ini); fim.setDate(fim.getDate() + 6);
    var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('tsData').textContent =
      ini.getDate() + '\u2013' + fim.getDate() + ' ' + MES[fim.getMonth()];
    card.classList.remove('hidden');
  }
  function escreverTemaSemana(){ if (TEMA_SEMANA) { definirTemaSelecionado(TEMA_SEMANA); abrirMetodos(); } }
  function prepararTemaSemana(){ if (TEMA_SEMANA) { definirTemaSelecionado(TEMA_SEMANA); window.location.href = 'hub-preparacao.html'; } }

  // ─── Abas ───
  function renderAbas(){
    var html = ABAS.map(function(a){
      return '<button class="abaT' + (a.id === abaAtiva ? ' ativa' : '') + '" onclick="irAba(\'' + a.id + '\')">' + a.rotulo + '</button>';
    }).join('');
    document.getElementById('abasDock').innerHTML = html;
    document.getElementById('abasTopo').innerHTML = html;
  }
  function irAba(a){ abaAtiva = a; mostrando = LIMITE; renderAbas(); renderGvCategoria(); renderTemas(); acordarDock(); }

  // ─── Gaveta de eixo (canônica) ───
  // Conta quantos temas cada eixo tem DENTRO da aba ativa (o número precisa ser verdadeiro)
  function contarPorEixo(){
    var base = obterFiltrados({ ignorarEixo:true, ignorarBusca:true });
    var mapa = { 'Todos os eixos': base.length };
    base.forEach(function(t){
      var c = t.categoria || '—';
      mapa[c] = (mapa[c] || 0) + 1;
    });
    return mapa;
  }
  function renderGvCategoria(){
    var cont = contarPorEixo();
    document.getElementById('gvCategoriaLista').innerHTML = EIXOS.map(function(e){
      var sel = (e === eixoAtivo);
      var n = cont[e] || 0;
      var vazio = (n === 0 && !sel);
      return '<a class="pill' + (sel ? ' sel' : '') + '"' + (vazio ? ' style="opacity:.45;"' : '') +
        ' onclick="escolherEixo(\'' + e.replace(/'/g, "\\'") + '\')">' +
        escapeHtmlSimples(e) +
        '<span style="font-size:.72rem;font-weight:600;color:' + (sel ? 'var(--cyan)' : 'var(--muted)') + ';margin-left:.35rem;">(' + n + ')</span>' +
        '<i class="fim"' + (sel ? '' : ' style="opacity:0;"') + '>&#10003;</i></a>';
    }).join('');
  }
  function escolherEixo(e){
    eixoAtivo = e;
    mostrando = LIMITE;
    document.getElementById('lblCatDock').textContent = e;
    document.getElementById('lblCatTopo').textContent = e;
    var ativo = (e !== 'Todos os eixos');
    document.getElementById('fBtnDock').classList.toggle('ativo', ativo);
    document.getElementById('fBtnTopo').classList.toggle('ativo', ativo);
    renderGvCategoria();
    fecharGaveta('gvCategoria');
    renderTemas();
    acordarDock();
  }
  function toggleGvCategoria(){ toggleGaveta('gvCategoria'); acordarDock(); }

  // ─── Busca ───
  function toggleBuscaDock(){
    var b = document.getElementById('dockBusca');
    b.classList.toggle('aberta');
    if (b.classList.contains('aberta')) document.getElementById('buscaDock').focus();
    acordarDock();
  }
  function sincronizarBusca(v){
    textoBusca = (v || '').toLowerCase().trim();
    mostrando = LIMITE;
    var bd = document.getElementById('buscaDock'); if (bd && bd.value !== v) bd.value = v;
    var bt = document.getElementById('buscaTopo'); if (bt && bt.value !== v) bt.value = v;
    renderTemas();
  }

  // ─── Filtragem (mesmas regras da produção) ───
  function obterFiltrados(op){
    op = op || {};
    var lista = [];
    switch (abaAtiva) {
      case 'todos':      lista = TEMAS.slice(); break;
      case 'recentes':   lista = TEMAS.filter(function(t){ return t.ano_enem != null && t.ano_enem >= 2020; }); break;
      case 'classicos':  lista = TEMAS.filter(function(t){ return t.ano_enem != null && t.ano_enem < 2020; }); break;
      case 'ppl':        lista = TEMAS.filter(function(t){ return t.aplicacao && String(t.aplicacao).toLowerCase() !== 'regular'; }); break;
      case 'meus':       lista = TEMAS.filter(function(t){ return MEUS_TEMAS_IDS.indexOf(t.id) >= 0; }); break;
      case 'turma':      lista = []; break; /* temas compartilhados pelo professor: pendência de produto */
    }
    if (!op.ignorarEixo && eixoAtivo !== 'Todos os eixos') lista = lista.filter(function(t){ return t.categoria === eixoAtivo; });
    if (textoBusca && !op.ignorarBusca) {
      lista = lista.filter(function(t){
        return (t.titulo || '').toLowerCase().indexOf(textoBusca) >= 0
            || (t.categoria || '').toLowerCase().indexOf(textoBusca) >= 0
            || String(t.ano_enem || '').indexOf(textoBusca) >= 0
            || (t.aplicacao || '').toLowerCase().indexOf(textoBusca) >= 0;
      });
    }
    return lista;
  }

  // ─── Renderização ───
  function renderTemas(){
    var load = document.getElementById('loadingTemas');
    if (load) load.remove();
    var lista = obterFiltrados();
    document.getElementById('contTopo').textContent = lista.length + (lista.length === 1 ? ' tema' : ' temas');
    var grid = document.getElementById('gridTemas');
    var btnMais = document.getElementById('btnMais');
    if (lista.length === 0) {
      var msgs = {
        meus: 'Voc\u00ea ainda n\u00e3o salvou nenhum tema.<br>Toque no \u{1F4CC} dos cards para favoritar.',
        turma: 'Seu professor ainda n\u00e3o compartilhou nenhum tema com a turma.'
      };
      grid.innerHTML = '<p class="vazio">' + (msgs[abaAtiva] || 'Nenhum tema encontrado.<br>Tente outro filtro.') + '</p>';
      btnMais.classList.add('hidden');
      return;
    }
    var visiveis = lista.slice(0, mostrando);
    grid.innerHTML = visiveis.map(function(t){
      var fonte = t.ano_enem ? ('ENEM ' + t.ano_enem + (t.aplicacao && String(t.aplicacao).toLowerCase() !== 'regular' ? ' \u00B7 ' + t.aplicacao : '')) : 'RedaON';
      var tipo = t.ano_enem ? 'enem' : 'redaon';
      var fav = MEUS_TEMAS_IDS.indexOf(t.id) >= 0;
      return '<div class="tCard">'
        + '<div class="topo"><span class="tBadge ' + tipo + '">' + escapeHtmlSimples(fonte) + '</span>'
        + '<span class="dir"><span class="cat">' + escapeHtmlSimples(t.categoria || '') + '</span>'
        + '<button class="tPin' + (fav ? ' on' : '') + '" onclick="alternarFavorito(\'' + t.id + '\', this)" title="Salvar nos Meus Temas">\u{1F4CC}</button></span></div>'
        + '<p class="tit">' + escapeHtmlSimples(t.titulo) + '</p>'
        + '<div class="btns">'
        + '<button class="btn" onclick="escreverTema(\'' + t.id + '\')">Escrever</button>'
        + '<button class="btn ghost" onclick="prepararTema(\'' + t.id + '\')">Preparar</button>'
        + '</div></div>';
    }).join('');
    btnMais.classList.toggle('hidden', lista.length <= mostrando);
  }
  function mostrarMais(){ mostrando += LIMITE; renderTemas(); }

  // ─── Ações (contrato de produção: sessionStorage tema_selecionado) ───
  function acharTema(id){ return TEMAS.find(function(t){ return t.id === id; }); }
  function escreverTema(id){
    var t = acharTema(id);
    if (!t) return;
    definirTemaSelecionado(t);
    abrirMetodos();
  }
  function prepararTema(id){
    var t = acharTema(id);
    if (!t) return;
    definirTemaSelecionado(t);
    window.location.href = 'hub-preparacao.html';
  }
  function alternarFavorito(id, el){
    var i = MEUS_TEMAS_IDS.indexOf(id);
    if (i >= 0) { MEUS_TEMAS_IDS.splice(i, 1); if (el) el.classList.remove('on'); toast('Removido dos seus temas'); }
    else { MEUS_TEMAS_IDS.push(id); if (el) el.classList.add('on'); toast('\u{1F4CC} Tema salvo nos seus favoritos!'); }
    try { localStorage.setItem('redaon_temas_salvos', JSON.stringify(MEUS_TEMAS_IDS)); } catch(e) {}
    if (abaAtiva === 'meus') renderTemas();
  }

  // ─── Sugerir tema ───
  async function enviarSugestao(){
    var txt = (document.getElementById('txtSugestao').value || '').trim();
    if (txt.length < 10) { toast('Escreva a sugest\u00e3o com um pouco mais de detalhe.', 2400); return; }
    try {
      var url = SUPABASE_URL + '/rest/v1/sugestoes_temas';
      var res = await dbFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Prefer':'return=minimal' },
        body: JSON.stringify({ texto: txt })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      document.getElementById('txtSugestao').value = '';
      fecharGaveta('gvSugestao');
      toast('\u{1F4A1} Sugest\u00e3o enviada para a PROfa!');
    } catch(e) {
      console.warn('Erro ao enviar sugest\u00e3o:', e);
      toast('N\u00e3o consegui enviar agora. Tente de novo.', 2600);
    }
  }

  // ─── Dock ───
  function acordarDock(){ if (window.mostrarDock_dockTemas) window.mostrarDock_dockTemas(); }
  iniciarDock('dockTemas', { protegidaPor:['gvCategoria','gvSugestao'] });

  renderAbas();
  carregarTemas();
</script>
</body>
</html>
